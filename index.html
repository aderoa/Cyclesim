<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CycleSim v14 — skeleton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/6.6.6/css/flag-icons.min.css">
<style>
:root{
  --bg:#15161A; --panel:#1E2026; --panel2:#24262E; --line:#2E313B;
  --ink:#E8E6E0; --muted:#8A8D96;
  --d1:#F2C200; --d2:#9BB7D4; --d3:#C98A4B; --d4:#6B7280;
  --up:#3FB36B; --dn:#E0483D; --champ:#9B7BD4;
  --disp:'Barlow Condensed',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding:0 0 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:.04em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.18em;margin-left:8px}
.status{text-align:right;font-family:var(--disp);font-weight:600}
#yp{font-size:18px;letter-spacing:.02em}
.ptype{display:block;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.ptype.special{color:var(--d1)} .ptype.champs{color:var(--champ)}

.ticker{display:flex;gap:3px;padding:14px 22px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tcell{width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel);border-radius:4px;
  border:1px solid transparent;cursor:default}
.tcell.co{background:var(--panel)}
.tcell.sp{background:rgba(242,194,0,.14);color:var(--d1);border-color:rgba(242,194,0,.3)}
.tcell.ch{background:rgba(155,123,212,.16);color:#c9b6ec;border-color:rgba(155,123,212,.35)}
.tcell.now{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink)}

.controls{display:flex;align-items:center;gap:10px;padding:16px 22px;flex-wrap:wrap}
button,.filebtn{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.03em;text-transform:uppercase;
  background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer}
button:hover:not(:disabled),.filebtn:hover{border-color:#454a57}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent}
.filebtn{background:var(--d1);color:#1a1a1a;border-color:var(--d1)}
.filebtn input{display:none}
.msg{color:var(--muted);font-size:13px;margin-left:6px}

.pyramid{padding:8px 22px 18px;display:flex;flex-direction:column;gap:7px}
.prow{display:flex;align-items:center;gap:12px}
.pbar{position:relative;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;color:#15161A;font-family:var(--disp);font-weight:700;min-width:120px;transition:width .35s ease}
.pbar.d1{background:var(--d1)} .pbar.d2{background:var(--d2)} .pbar.d3{background:var(--d3)} .pbar.d4{background:var(--d4);color:#E8E6E0}
.plabel{font-size:15px;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
.pcount{font-family:var(--mono);font-size:15px}
.pflow{display:flex;gap:10px;font-family:var(--disp);font-weight:700;font-size:15px}
.pflow .up{color:var(--up)} .pflow .dn{color:var(--dn)}

.tabs{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;
  color:var(--muted);padding:10px 12px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--d1)}

main{padding:18px 22px}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.phead{font-family:var(--disp);font-size:18px;margin-bottom:12px}
.mut{color:var(--muted)} .r{text-align:right} .mono{font-family:var(--mono)}
.tn{font-weight:500}

.divsel,.tabs{flex-wrap:wrap}
.divsel{display:flex;gap:6px;margin-bottom:14px}
.pill{font-family:var(--disp);font-weight:700;padding:6px 16px;border-radius:20px;border:1px solid var(--line);
  background:transparent;color:var(--muted)}
.pill.on.d1{background:var(--d1);color:#1a1a1a;border-color:var(--d1)}
.pill.on.d2{background:var(--d2);color:#15161A;border-color:var(--d2)}
.pill.on.d3{background:var(--d3);color:#15161A;border-color:var(--d3)}
.pill.on.d4{background:var(--d4);color:#fff;border-color:var(--d4)}

.chip{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;color:#15161A;vertical-align:middle}
.chip.d1{background:var(--d1)} .chip.d2{background:var(--d2)} .chip.d3{background:var(--d3)} .chip.d4{background:var(--d4);color:#fff}
.chip.champ{background:var(--champ);color:#fff}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-family:var(--disp);font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  font-size:11px;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 10px;border-bottom:1px solid rgba(46,49,59,.5)}
.tbl tbody tr:hover{background:var(--panel)}
.tbl tbody tr{cursor:pointer}

.race{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.race.justran{border-color:var(--d1);box-shadow:0 0 0 1px var(--d1)}
.rhead{font-family:var(--disp);font-size:16px;margin-bottom:6px}
.rtop{list-style:none;margin:0;padding:0;font-size:13px}
.rtop li{padding:2px 0;display:flex;gap:8px;align-items:baseline}
.rtop .pos{font-family:var(--mono);color:var(--muted);width:16px}
.rfoot{margin-top:6px;font-size:12px}
.debut{font-family:var(--mono);font-size:10px;background:rgba(63,179,107,.16);color:var(--up);padding:2px 6px;border-radius:4px}
.movesum{margin-bottom:12px;font-family:var(--disp);font-size:15px}
.movesum .up{color:var(--up)} .movesum .dn{color:var(--dn)}
.champbox{background:rgba(155,123,212,.1);border:1px solid rgba(155,123,212,.3);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.up{color:var(--up)} .dn{color:var(--dn)} .ok{color:var(--muted)}

.teamsel{font-family:var(--disp);font-weight:600;font-size:15px;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-bottom:14px;min-width:280px}
.tmeta{font-family:var(--disp);font-size:16px;margin-bottom:6px}
.tmeta.mut{font-size:13px;margin-bottom:12px}

.lnk{font-family:var(--disp);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;
  background:none;border:none;color:var(--d1);padding:0 0 0 10px;cursor:pointer}
.rdetail{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.dsec{font-family:var(--disp);font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.jerseys{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
.jw{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:3px 10px}
.jw.pts{color:var(--up)} .jw.kom{color:var(--dn)} .jw.spr{color:#4ea3ff}
.favrow{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px}
.favchip{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.favchip .favn{color:var(--mut);font-size:11px;min-width:12px;text-align:center}
.palmh{font-family:var(--disp);font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin:10px 0 3px}
.logyear{margin:0 0 18px}
.logyear>h3{font-family:var(--disp);font-size:17px;margin:0 0 8px;color:var(--fg)}
.logphase{margin:0 0 10px;border-left:2px solid var(--line);padding-left:10px}
.logph{font-family:var(--disp);font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin:6px 0 3px}
.logrow{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-size:13.5px;border-bottom:1px dotted var(--line2,#26262b)}
.logrow .lr-race{color:var(--mut);flex:1;min-width:0}
.logrow .lr-win{white-space:nowrap}
.logrow.champ{color:var(--fg)}
.tierbadge{font-size:9px;background:var(--accent2,#3a3a44);color:#fff;border-radius:4px;padding:1px 4px;letter-spacing:.4px;vertical-align:middle}
.natdet{display:inline}
.natdet summary{cursor:pointer;color:var(--acc,#4ea3ff);font-size:12px;display:inline;list-style:none}
.calwrap{display:flex;flex-direction:column;gap:2px}
.calph{background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin:0 0 4px;padding:2px 4px}
.calph.calcur{outline:2px solid var(--acc,#4ea3ff)}
.calph>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:6px 8px;font-size:14px}
.calph>summary::-webkit-details-marker{display:none}
.calph .calno{font-family:var(--disp);color:var(--mut);font-size:12px;min-width:34px}
.calph .calttl{font-weight:600;flex:1}
.calph .calcnt{font-size:11.5px}
.calbody{padding:2px 8px 8px 44px;display:flex;flex-direction:column;gap:1px}
.calrace{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:2px 0;border-bottom:1px dotted var(--line2,#26262b)}
.calrace .lr-race{flex:1;min-width:0}
.selwrap{display:flex;align-items:center;gap:12px;margin:8px 0 10px;flex-wrap:wrap}
.selwrap .selttl{font-family:var(--disp);font-size:18px}
.terrsel{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
tr.rrow{cursor:pointer} tr.rrow:hover{background:var(--panel2)}
.slgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slteam{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.slname{font-family:var(--disp);font-weight:600;font-size:13px;margin-bottom:3px}
.slr{font-size:11px;color:var(--muted)}
.fullgc{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto;font-size:12px;
  border:1px solid var(--line);border-radius:6px}
.fullgc li{display:flex;gap:8px;padding:3px 8px;border-bottom:1px solid rgba(46,49,59,.4)}
.fullgc .pos{font-family:var(--mono);color:var(--muted);width:26px;text-align:right}
.fullgc .gap{margin-left:auto;font-family:var(--mono);color:var(--muted);white-space:nowrap}
.flowsub{font-size:13px;color:var(--ink);margin:2px 0 12px}
.daycard{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:7px;padding:9px 12px;margin-bottom:7px;font-size:13px}
.daycard .dnum{font-family:var(--mono);color:var(--muted);width:1.6em;text-align:right}
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort:hover{color:var(--ink)}
.tbl th .ar{color:var(--d1)}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0 8px}
.subtab{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:6px;
  padding:4px 11px;font-family:var(--disp);font-size:12px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
.subtab:hover{color:var(--ink)} .subtab.on{background:var(--d1);color:#15161A;border-color:var(--d1);font-weight:600}
.chmp{font-size:.85em;margin-left:1px}
.srat{margin-left:auto;font-family:var(--mono);color:var(--d1);font-weight:600}
.slr{display:flex;align-items:center;gap:3px}
.fullgc.tall{max-height:520px}
.resumebar{background:rgba(242,194,0,.12);border:1px solid var(--d1);border-radius:7px;
  padding:8px 12px;margin-bottom:12px;font-size:13px;color:var(--ink)}
.injlist{display:flex;flex-direction:column;gap:3px}
.injrow{display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:12px;
  padding:5px 10px;background:var(--bg);border-radius:5px}
.injr{display:flex;align-items:center;gap:5px;min-width:0}
.injtag{font-family:var(--mono);font-size:11px;white-space:nowrap}
.mktcell{display:flex;gap:5px;flex-wrap:wrap}
.mktbtn{background:rgba(63,179,107,.14);border:1px solid rgba(63,179,107,.4);color:var(--up);
  border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.mktbtn:hover{background:rgba(63,179,107,.26)}
.mktbtn.cur{background:var(--panel);border-color:var(--line);color:var(--muted);cursor:default}
.mktnow .mktlbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mktnow .mktname{font-size:21px;font-weight:700;margin:3px 0 4px;display:flex;align-items:center;gap:8px}
.mktqueue{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 14px}
.mktqueue .mktq{font-size:12px;color:var(--text);display:inline-flex;align-items:center;gap:5px}
tr.mktactive td{background:rgba(63,179,107,.08)}
.jersey{vertical-align:-3px;margin-right:5px;border-radius:2px;flex:none}
.histyear{margin:0 0 16px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--panel)}
.histyear h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:10px}
.histyear h3 .yr{font-family:var(--mono);color:var(--up)}
.histcrown{font-size:13px;margin:2px 0;color:var(--text)}
.histmaj{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:12px}
.histmaj .hm{color:var(--muted)}
.histmaj .hm b{color:var(--text);font-weight:600}
.stagelist{display:flex;flex-direction:column;gap:2px}
.stagerow{display:grid;grid-template-columns:80px 110px 1fr;gap:8px;align-items:baseline;font-size:12px;
  padding:3px 8px;background:var(--bg);border-radius:4px}
.stname{font-family:var(--disp);font-weight:600}
.stterr{color:var(--muted);font-size:11px}

.flag{display:inline-block;width:18px;height:13px;border-radius:2px;background-size:cover;background-position:center;
  vertical-align:-1px;margin-right:5px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.ccbadge{font-family:var(--mono);font-size:9px;background:rgba(120,128,160,.2);color:var(--muted);
  border-radius:3px;padding:1px 4px;margin-right:5px;vertical-align:1px}
.rl,.tl{cursor:pointer;border-bottom:1px dotted transparent}
.rl:hover,.tl:hover{border-bottom-color:var(--d1);color:var(--d1)}
#build{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.12em;margin-left:8px}

.modal{position:fixed;inset:0;background:rgba(8,9,11,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:560px;width:100%;
  max-height:84vh;overflow:auto;padding:18px 20px;position:relative}
.modalx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--muted);font-size:22px;padding:0;line-height:1}
.pmtitle{font-family:var(--disp);font-size:22px;font-weight:700;margin:0 0 2px}
.pmsub{color:var(--muted);font-size:13px;margin-bottom:12px}
.attrgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 14px}
.attr{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px;text-align:center}
.attr b{display:block;font-family:var(--mono);font-size:13px}
.attr span{font-size:9px;color:var(--muted);letter-spacing:.04em}
.palm{list-style:none;margin:0;padding:0;font-size:13px}
.palm li{padding:3px 0;border-bottom:1px solid rgba(46,49,59,.4);display:flex;gap:8px;align-items:baseline}
.palm .pwhen{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:54px}
.palm .win{color:var(--d1)} .palm .title{color:var(--champ)}
.palmsum{font-size:12px;color:var(--muted);margin-top:8px}
.saveinfo{font-family:var(--mono);font-size:11px;color:var(--up)}
</style>
</head>
<body>
<header>
  <div class="brand">CycleSim <span id="build">v14</span></div>
  <div class="status"><span id="yp">—</span><span id="ptype" class="ptype"></span></div>
</header>
<div id="ticker" class="ticker"></div>
<div class="controls">
  <label class="filebtn" id="loadwrap">Load database<input type="file" id="csv" accept=".csv"></label>
  <label class="filebtn ghost" id="updatewrap" style="display:none">Update database<input type="file" id="updcsv" accept=".csv"></label>
  <button id="btnDraft" disabled>Run draft</button>
  <button id="btnPhase" disabled>Start phase</button>
  <button id="btnYear" disabled>Advance year</button>
  <button id="btnReset" class="ghost">Reset</button>
  <button id="btnSave" class="ghost" disabled>Save</button>
  <button id="btnExport" class="ghost">Export</button>
  <button id="btnImport" class="ghost">Import</button>
  <span id="saveinfo" class="saveinfo"></span>
  <span id="msg" class="msg"></span>
</div>
<nav class="tabs">
  <button data-tab="divisions" class="on">Divisions</button>
  <button data-tab="calendar">Calendar</button>
  <button data-tab="phase">Last phase</button>
  <button data-tab="ranking">World ranking</button>
  <button data-tab="nations">Nations</button>
  <button data-tab="history">History</button>
  <button data-tab="riders">Riders</button>
  <button data-tab="team">Team</button>
  <button data-tab="market">Market</button>
</nav>
<main id="view"></main>
<div id="modal" class="modal" style="display:none"><div class="modalbox"><button class="modalx" id="modalx">×</button><div id="modalbody"></div></div></div>

      const c=T[country]; for(const name in c){ (agg[name]||(agg[name]={pts:0,races:0})); agg[name].pts+=c[name].pts; agg[name].races+=c[name].races; } });
    return Object.entries(agg).map(([name,v])=>({ name, country:S.riderCountry[name]||'', teamId:S.riderTeam[name], pts:v.pts, races:v.races }))
      .filter(x=>x.pts>0).sort((a,b)=>b.pts-a.pts);
  }
  function gdist(a,b){
    const A=geo(a),B=geo(b); let dlng=Math.abs(A[1]-B[1]); if(dlng>180) dlng=360-dlng;
    const dlat=A[0]-B[0]; return Math.sqrt(dlat*dlat+dlng*dlng);
  }

  // ---- rng helpers ------------------------------------------------------
  function randn(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

  // ---- CSV parse --------------------------------------------------------
  // Accepts the locked schema, with OPTIONAL trailing id + lastSeen columns.
  // Rating,Team,RIDER,Country,<14 attrs>[,id][,lastSeen]
  function parseCSV(text){
    const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
    const out=[];
    for(let i=0;i<lines.length;i++){
      const c = lines[i].split(',');
      if(c.length<18) continue;
      if(c[2]==='RIDER' || c[2]===undefined) continue;          // header
      const avg = parseFloat(c[0]); if(isNaN(avg)) continue;     // header/garbage
      const a={}; for(let k=0;k<14;k++) a[ATTRS[k]] = parseInt(c[4+k],10)||0;
      out.push({
        id: (c[18]!=null && c[18].trim()) ? c[18].trim() : null,
        name: c[2].trim(),
        country: c[3].trim(),
        avg: avg,
        a: a,
        lastSeen: (c[19]!=null && c[19].trim()) ? c[19].trim() : null
      });
    }
    return out;
  }

  // ---- genesis draft ----------------------------------------------------
  // One-time. 15 per team. (1) Randomly pick 8/15 of all riders as "natives",
  // bucket them by nationality into cores of 8 (small-nation leftovers merged
  // geographically). (2) Draft the rest: best rider -> best team, second -> second,
  // and so on, the SAME team order every round, so strength compounds.
  function genesisDraft(riders){
    const teamCount=Math.floor(riders.length/15);
    const nativeTarget=teamCount*8;
    const shuffled=shuffle(riders.slice());
    const natives=shuffled.slice(0,nativeTarget);
    const pool=shuffled.slice(nativeTarget);

    // bucket natives by nation -> cores of 8
    const byC={}; natives.forEach(r=>{(byC[r.country]||(byC[r.country]=[])).push(r);});
    const cores=[]; const leftover=[];
    Object.keys(byC).forEach(c=>{ const list=byC[c]; const g=Math.floor(list.length/8);
      for(let k=0;k<g;k++) cores.push({country:c, riders:list.slice(k*8,k*8+8)});
      list.slice(g*8).forEach(r=>leftover.push(r));
    });
    // geographic merge of leftovers into mixed cores (home = most-represented nation)
    leftover.sort((a,b)=>regionOf(a.country).localeCompare(regionOf(b.country)));
    for(let i=0;i+8<=leftover.length;i+=8){
      const grp=leftover.slice(i,i+8); const cnt={};
      grp.forEach(r=>cnt[r.country]=(cnt[r.country]||0)+1);
      const home=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
      cores.push({country:home, riders:grp});
    }
    leftover.slice(Math.floor(leftover.length/8)*8).forEach(r=>pool.push(r));

    // build teams, each named after an unused city of its home nation
    const cityUse={}; const teams=[]; let tid=0;
    cores.forEach(core=>{
      const city=cityFor(core.country, cityUse);
      teams.push({ id:tid++, name:city, homeCity:city, country:core.country,
                   riders:core.riders.slice(), avg:0, division:0,
                   phasesByDivision:{}, debutDivision:null });
    });
    teams.forEach(t=>t.avg=coreAvg(t));

    // straight draft: fixed team order (best core first), best remaining rider each round
    pool.sort((a,b)=>b.avg-a.avg);
    const order=teams.slice().sort((a,b)=>b.avg-a.avg);
    let pi=0;
    for(let round=0; round<7; round++){
      for(const t of order){ if(pi<pool.length) t.riders.push(pool[pi++]); }
    }
    teams.forEach(t=>{ t.avg = mean(t.riders.map(r=>r.avg)); });
    return { teams, freeAgents: pool.slice(pi) };
  }
  function cityFor(country, used){
    const list=CITIES[country]||[]; used[country]=used[country]||0;
    if(used[country]<list.length) return list[used[country]++];
    used[country]++; return country+' '+(used[country]-list.length); // fallback if cities exhausted
  }
  function coreAvg(t){ return mean(t.riders.map(r=>r.avg)); }
  function mean(a){ return a.length? a.reduce((s,x)=>s+x,0)/a.length : 0; }

  // ---- division seeding -------------------------------------------------
  // By average rating. Caps 25/50/100 then D4 = everlasting remainder.
  // Robust to small datasets (clamps to team count).
  function seedDivisions(teams){
    const sorted = teams.slice().sort((a,b)=>b.avg-a.avg);
    const caps=[25,50,100];
    let i=0, div=1;
    for(const cap of caps){
      for(let k=0;k<cap && i<sorted.length;k++,i++) sorted[i].division=div;
      div++;
      if(i>=sorted.length) break;
    }
    while(i<sorted.length){ sorted[i].division=4; i++; } // D4 everlasting
    return divisionMap(teams);
  }
  function divisionMap(teams){
    const m={1:[],2:[],3:[],4:[]};
    teams.forEach(t=>{ if(m[t.division]) m[t.division].push(t); });
    return m;
  }
  function racesPerDivision(divTeamCount, division){
    if(division===1) return 1;
    if(division===2) return 2;
    if(division===3) return 4;
    return Math.max(1, Math.ceil(divTeamCount/25)); // D4
  }
  // full race-by-race schedule for the current year (hosts are deterministic from the fixture pool;
  // only the participating teams are decided at race time). Used by the calendar view.
  function seasonSchedule(S){
    const dm=divisionMap(S.teams);
    const commonPerYear=(S.calendar||[]).filter(c=>c.type==='COMMON').length||1;
    const yearBaseCC=S.year*commonPerYear;
    let ci=0;
    return (S.calendar||[]).map(c=>{
      if(c.type==='CHAMPS') return { phase:c.phase, type:'CHAMPS', races:[
        {name:'World Championship', tier:'WORLDS', terrain:'HIL'},
        {name:'TT World Championship', tier:'WORLDS', terrain:'TTR'},
        {name:'National Championships', tier:'NATIONAL'} ] };
      if(c.type==='SPECIAL'){ const s=c.special;
        return { phase:c.phase, type:'SPECIAL', races:[
          {name:s.name, host:s.host, country:s.host, division:1, tier:s.tier, terrain:s.terrain, gt:s.gt||null, special:true}] }; }
      const cc=yearBaseCC+ci; ci++;
      const races=[];
      for(let d=1; d<=4; d++){
        const pool=S.fixtures[d]||[]; if(!pool.length) continue;
        const nR=racesPerDivision((dm[d]||[]).length, d);
        drawFixtures(pool, nR, cc*nR).forEach(f=>races.push({
          name:f.name, host:f.host, country:f.country, division:d, oneday:f.oneday, tier:'COMMON' }));
      }
      return { phase:c.phase, type:'COMMON', races };
    });
  }

  // ---- calendar ---------------------------------------------------------
  // 34 phases/year: 25 common + 8 special (D1 only) + phase 34 championships.
  // Specials evenly spaced, real-world order, Lombardia last special.
  const SPECIALS = [
    {name:'Milano-Sanremo',  host:'Italy',   terrain:'HIL', tier:'MONUMENT'},
    {name:'Tour of Flanders',host:'Belgium', terrain:'COB', tier:'MONUMENT'},
    {name:'Paris-Roubaix',   host:'France',  terrain:'COB', tier:'MONUMENT'},
    {name:'Liege-Bastogne-Liege',host:'Belgium',terrain:'MTN',tier:'MONUMENT'},
    {name:'Giro d\'Italia',  host:'Italy',   terrain:'MTN',tier:'GT', gt:'GIRO'},
    {name:'Tour de France',  host:'France',  terrain:'MTN',tier:'TOUR', gt:'TOUR'},
    {name:'Vuelta a Espana', host:'Spain',   terrain:'MTN',tier:'GT', gt:'VUELTA'},
    {name:'Il Lombardia',    host:'Italy',   terrain:'MTN',tier:'MONUMENT'}
  ];
  function buildCalendar(){
    // Championships open the year at phase 1; the racing season runs phases 2..34.
    const phases=[{phase:1, type:'CHAMPS'}];
    // place 8 specials across phases 2..34, evenly, distinct; Lombardia falls last.
    const specialPhase={};
    for(let i=0;i<8;i++){ const p=2+Math.round((i+1)*32/9); specialPhase[p]=i; }
    const used=new Set();
    for(let p=2;p<=34;p++){
      if(specialPhase[p]!=null && !used.has(specialPhase[p])){
        used.add(specialPhase[p]);
        phases.push({phase:p,type:'SPECIAL',special:SPECIALS[specialPhase[p]]});
      } else {
        phases.push({phase:p,type:'COMMON'});
      }
    }
    // any specials not placed (collisions) -> drop into earliest free common phases
    for(let i=0;i<8;i++){ if(!used.has(i)){
      const slot=phases.find(ph=>ph.type==='COMMON'); if(slot){slot.type='SPECIAL';slot.special=SPECIALS[i];used.add(i);}
    }}
    return phases;
  }

  // ---- points -----------------------------------------------------------
  const PTS_BASE=[100,80,70,62,54,48,42,38,34,30,26,22,18,14,10,6];
  const TIER_MULT={ TOUR:1.0, GT:0.8, MONUMENT:0.7, UWT:0.55, PRO:0.4, C21:0.28, C22:0.16, WORLDS:0.9, NATIONAL:0.2 };
  function pointsFor(tier,pos){ if(pos>=PTS_BASE.length) return 0; return Math.round(PTS_BASE[pos]*(TIER_MULT[tier]||0.2)); }
  function tierFor(division, race){
    if(race.special) return race.special.tier;     // TOUR / GT / MONUMENT
    if(division===1) return 'UWT';
    if(division===2) return 'PRO';
    if(division===3) return 'C21';
    return 'C22';
  }

  // ---- rider selection (7 of 15) ---------------------------------------
  function selectRaceRiders(team, race, S){
    const abs=S.abs;
    let pool = team.riders.filter(r=>{
      if(r.retired) return false;                                           // retired
      const inj=S.injuries[r.name]; if(inj!=null && inj>=abs) return false;  // still out
      if(race.gt && (S.gt[r.name]||0)>=2) return false;                       // GT cap
      return true;
    });
    const forced=[];
    if(race.gt==='TOUR' && pool.length){
      const best=pool.slice().sort((a,b)=>b.avg-a.avg)[0];
      forced.push(best); pool=pool.filter(r=>r!==best);
    }
    pool.sort((a,b)=>{
      const pa=S.phasesRidden[a.name]||0, pb=S.phasesRidden[b.name]||0;
      return pa-pb || Math.random()-0.5;
    });
    const pick = forced.concat(pool).slice(0,7);
    return pick;
  }

  // ---- race simulation: stage race (one-day = single stage) ------------
  function simulateRace(entries, stages){
    if(typeof stages==='string') stages=[{name:'One-day',terrain:stages}]; // back-compat
    const riders = entries.map(e=>({name:e.rider.name, teamId:e.teamId, country:e.rider.country,
      rider:e.rider, gc:0, pts:0, kom:0, out:false}));
    const stageResults=[]; const abandons=[];
    const dnfChance = stages.length>1 ? 0.012 : 0.04;
    stages.forEach(st=>{
      const wa=TERRAIN_ATTRS[st.terrain]||['FLA','STA'];
      riders.forEach(r=>{ if(!r.out && Math.random()<dnfChance){ r.out=true; abandons.push(r); } });
      const racing=riders.filter(r=>!r.out);
      racing.forEach(r=>{ const spec=(r.rider.a[wa[0]]+r.rider.a[wa[1]])/2;
        r._p = 0.5*r.rider.avg + 0.5*spec + 4*randn(); });
      const order=racing.slice().sort((a,b)=>b._p-a._p);
      order.forEach((r,i)=>{ r.gc += r._p;
        if(FLATISH.has(st.terrain)) r.pts += Math.max(0,15-i)*(r.rider.a.SPR/100);
        if(CLIMBISH.has(st.terrain)) r.kom += Math.max(0,15-i)*(r.rider.a.MTN/100);
      });
      stageResults.push({ name:st.name, terrain:st.terrain,
        top: order.slice(0,5).map((r,i)=>({pos:i,name:r.name,teamId:r.teamId})),
        winner: order[0]?{name:order[0].name,teamId:order[0].teamId}:null });
    });
    const finishers=riders.filter(r=>!r.out).sort((a,b)=>b.gc-a.gc);
    const gc=finishers.map((r,i)=>({pos:i,name:r.name,teamId:r.teamId,rider:r.rider}));
    const byTeam={}; gc.forEach(g=>{ (byTeam[g.teamId]||(byTeam[g.teamId]=[])).push(g.pos); });
    const teamClass=Object.keys(byTeam).map(tid=>{ const ps=byTeam[tid].sort((a,b)=>a-b).slice(0,3);
      return { teamId:+tid, score: ps.reduce((s,x)=>s+x,0)+(3-ps.length)*999 }; }).sort((a,b)=>a.score-b.score);
    const jp=best(finishers,r=>r.pts), jk=best(finishers,r=>r.kom);
    return { gc, abandons:abandons.map(a=>({name:a.name,teamId:a.teamId})), teamClass,
      jersey:{ points: jp?{name:jp.name,teamId:jp.teamId}:null, kom: jk?{name:jk.name,teamId:jk.teamId}:null },
      winner: gc[0]||null, stages:stageResults };
  }
  function best(arr,f){ let bv=-1,bx=null; arr.forEach(a=>{const v=f(a); if(v>bv){bv=v;bx=a;}}); return bx; }
  // provisional promotion/relegation zones from a race's current standings (for display)
  // promotion order = 1st rider, 1st team, 2nd rider, 2nd team, … (skip repeats)
  function interleavePromote(riderSeq, teamSeq, need, exclude){
    // merge as rider1, team1, rider2, team2, … then keep first occurrence of each team.
    // when the Nth rider and Nth team are the same club, that pairing collapses and the
    // next promotion falls to the (N+1)th rider — not the (N+1)th team.
    const out=[], seen=new Set(exclude||[]);
    const max=Math.max(riderSeq.length, teamSeq.length);
    for(let k=0; k<max && out.length<need; k++){
      if(k<riderSeq.length){ const id=riderSeq[k]; if(!seen.has(id)){ seen.add(id); out.push(id); if(out.length>=need) break; } }
      if(k<teamSeq.length){ const id=teamSeq[k]; if(!seen.has(id)){ seen.add(id); out.push(id); } }
    }
    return out;
  }
  function computeZones(S, division, gc, teamClass, jpTid, jkTid){
    const ctx=S.phaseCtx, special=!!(ctx&&ctx.special);
    // how many go down from this race (D4 is the everlasting floor → none)
    const relN = division===4 ? 0 : ((special && division===1) ? 2 : 4);
    // how many come up from this race
    let promoK;
    if(division===1) promoK = special?2:0;            // D1 only promotes in special phases
    else { const cnt={}; (ctx?ctx.races:[]).forEach(r=>cnt[r.division]=(cnt[r.division]||0)+1);
      const above=cnt[division-1]||0, here=cnt[division]||1;
      promoK = Math.max(1, Math.round(4*above/here)); }
    // relegation: bottom relN non-exempt teams by team classification
    const safe=new Set(); gc.slice(0,10).forEach(g=>safe.add(g.teamId)); if(jpTid!=null)safe.add(jpTid); if(jkTid!=null)safe.add(jkTid);
    const relZone=[]; for(let i=teamClass.length-1;i>=0 && relZone.length<relN;i--){ if(!safe.has(teamClass[i].teamId)) relZone.push(teamClass[i].teamId); }
    // promotion (display): interleave individual GC (rider) with team classification (team)
    const promoZone=interleavePromote(gc.map(g=>g.teamId), teamClass.map(tc=>tc.teamId), promoK);
    return { relZone, promoZone };
  }

  // ---- world ranking (rolling 33 phases) -------------------------------
  function worldRanking(S){
    const sums={};
    S.ledger.forEach(e=>{ if(S.abs - e.abs < 33){ sums[e.teamId]=(sums[e.teamId]||0)+e.pts; } });
    return S.teams.map(t=>({team:t, pts:sums[t.id]||0})).sort((a,b)=>b.pts-a.pts);
  }
  function worldRankingRiders(S){
    const sums={};
    S.riderLedger.forEach(e=>{ if(S.abs - e.abs < 33){ sums[e.name]=(sums[e.name]||0)+e.pts; } });
    return Object.keys(sums).map(n=>({name:n, pts:sums[n], teamId:S.riderTeam[n],
            country:S.riderCountry[n]})).sort((a,b)=>b.pts-a.pts);
  }
  function rankIndex(S){ const r=worldRanking(S); const idx={}; r.forEach((o,i)=>idx[o.team.id]=i); return idx; }

  // ---- phase execution: setup -> step each stage -> finish -------------
  // setupPhase builds the races (selecting riders + stages) without simulating;
  // stepPhase runs the next stage of every active race; finishPhase resolves
  // standings/points/promotion. runPhase composes them for fast-forward.
  function setupPhase(S){
    if(S.marketPool && S.marketPool.length) finishMarket(S);   // ensure every team is at 15 before racing
    const cal=S.calendar[S.phase-1];
    S.phaseCtx={ type:cal.type, races:[], log:{year:S.year,phase:S.phase,type:cal.type,races:[],moves:[]}, stage:0, maxStages:0 };
    if(cal.type==='CHAMPS'){ S.phaseCtx.champs=true; return phaseDescriptor(S); }
    const dm=divisionMap(S.teams);
    if(cal.type==='SPECIAL'){
      reshapeEliteD1(S, dm);
      const fresh=divisionMap(S.teams);
      S.phaseCtx.races.push(prepareRace(1, cal.special, fresh[1], S));
      S.phaseCtx.special=true;
    } else {
      for(let d=1; d<=4; d++){
        const teams=dm[d]; if(!teams||!teams.length) continue;
        const nR=racesPerDivision(teams.length,d); const pool=S.fixtures[d]||[]; if(!pool.length) continue;
        const hosts=drawFixtures(pool, nR, S.commonCount*nR);
        assignTeams(teams,hosts).forEach(b=>{ if(b.teams.length) S.phaseCtx.races.push(prepareRace(d,b.fixture,b.teams,S)); });
      }
      S.phaseCtx.dmBefore=dm;
    }
    // resolve races east-to-west (time-zone order): Australia/NZ first, California last
    S.phaseCtx.races.sort((a,b)=> geo(b.country)[1] - geo(a.country)[1]);
    S.phaseCtx.maxStages=Math.max(1, ...S.phaseCtx.races.map(r=>r.nStages));
    // unit queue: round-major, race-by-race (stage 1 of every race in TZ order, then stage 2, …)
    const units=[];
    for(let round=1; round<=S.phaseCtx.maxStages; round++)
      S.phaseCtx.races.forEach((rs,ri)=>{ if(rs.nStages>=round) units.push(ri); });
    S.phaseCtx.units=units; S.phaseCtx.uptr=0;
    return phaseDescriptor(S);
  }
  function phaseDescriptor(S){
    const ctx=S.phaseCtx;
    return { type:ctx.type, champs:!!ctx.champs, special:!!ctx.special, maxStages:ctx.maxStages||0,
      totalUnits:(ctx.units||[]).length,
      races: ctx.races.map(rs=>({ name:rs.name, host:rs.host, country:rs.country, division:rs.division,
        nStages:rs.nStages, tier:rs.tier, gt:rs.gt, teams:rs.teams.slice(),
        startlist: rs.riders.map(r=>({name:r.name,teamId:r.teamId})) })) };
  }
  function stepPhase(S){
    const ctx=S.phaseCtx; if(!ctx||ctx.champs) return null;
    if(ctx.uptr>=ctx.units.length) return { allDone:true, stage:null, unit:ctx.uptr, total:ctx.units.length };
    const ri=ctx.units[ctx.uptr++]; const rs=ctx.races[ri];
    const sr=stepRaceStage(rs);
    // multi-stage race: log each stage win to the winner's (and team's) palmarès as it happens
    if(rs.nStages>1 && sr && sr.winner){
      const y=S.year, p=S.phase, label=rs.name+' — stage '+rs.cur;
      (S.palmares[sr.winner.name]||(S.palmares[sr.winner.name]=[])).push({y,p,race:label,div:rs.division,place:'stage'});
      (S.teamPalmares[sr.winner.teamId]||(S.teamPalmares[sr.winner.teamId]=[])).push({y,p,race:label,div:rs.division,place:'stage'});
    }
    const inj=applyInjuries(S, sr.abandons); (rs.injuries||(rs.injuries=[])).push(...inj);
    let recap=null;
    if(rs.done && !rs.recorded){ recordRacePalmares(rs, S); rs.recorded=true; recap=finalizeRace(rs,S); }
    return { unit:ctx.uptr, total:ctx.units.length, raceIndex:ri, allDone: ctx.uptr>=ctx.units.length,
      stage:sr, injuries:inj, recap,
      race:{ name:rs.name, division:rs.division, host:rs.host, country:rs.country, tier:rs.tier, gt:rs.gt,
             done:rs.done, cur:rs.cur, nStages:rs.nStages } };
  }
  // peek the next race-stage WITHOUT simulating (for the preview page)
  function nextUnit(S){
    const ctx=S.phaseCtx; if(!ctx||ctx.champs||ctx.uptr>=ctx.units.length) return null;
    const ri=ctx.units[ctx.uptr]; const rs=ctx.races[ri]; const st=rs.stages[rs.cur];
    const gcNow=rs.riders.filter(r=>!r.out).sort((a,b)=>(a.time||0)-(b.time||0)||b.gc-a.gc);
    const lead=gcNow.length?(gcNow[0].time||0):0;
    // favourites for THIS stage's terrain (same weighting the race engine uses)
    const favorites=gcNow.map(r=>{ const a=r.rider.a;
        const s=(st.terrain==='FLA')?(a.SPR*0.65+a.ACC*0.20+a.STA*0.15):terrainScore(a,st.terrain);
        return {name:r.name,teamId:r.teamId,country:r.country,score:s}; })
      .sort((x,y)=>y.score-x.score).slice(0,6)
      .map((f,i)=>({rank:i+1,name:f.name,teamId:f.teamId,country:f.country}));
    // teams making their first-ever appearance in this division
    const seenT=new Set(); const debutTeams=[];
    rs.riders.forEach(r=>{ if(seenT.has(r.teamId)) return; seenT.add(r.teamId);
      const t=S.teamById[r.teamId];
      if(t && !((t.phasesByDivision||{})[rs.division])) debutTeams.push({teamId:r.teamId, name:t.name, country:t.country}); });
    return { raceIndex:ri, name:rs.name, division:rs.division, country:rs.country, host:rs.host,
      tier:rs.tier, gt:rs.gt, nStages:rs.nStages, stageNo:rs.cur+1, terrain:st.terrain, favorites, debutTeams,
      isRaceStart: rs.cur===0, isRaceEnd: rs.cur+1>=rs.nStages,
      unit:ctx.uptr+1, total:ctx.units.length,
      startlist: rs.cur===0 ? rs.riders.map(r=>({name:r.name,teamId:r.teamId,country:r.country,rating:r.rider.avg})) : null,
      gc: rs.cur>0 ? gcNow.slice(0,10).map((r,i)=>({pos:i,name:r.name,teamId:r.teamId,gap:(r.time||0)-lead})) : null };
  }

const DBNAME='cyclesim_v14', STORE='saves', SKEY='current';
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DBNAME,1);
  r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function saveStamp(ts){ const e=document.getElementById('saveinfo'); if(e) e.textContent = ts?('saved '+new Date(ts).toLocaleTimeString()):''; }
async function saveGame(){ if(!S) return; try{ const db=await idbOpen(); const data=E.serialize(S); data.savedAt=Date.now();
  await new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(data,SKEY); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
  saveStamp(data.savedAt); }catch(e){ console.warn('CycleSim save failed', e); } }
async function loadGame(){ try{ const db=await idbOpen();
  const data=await new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readonly'); const rq=tx.objectStore(STORE).get(SKEY); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); });
  if(!data) return false; S=E.deserialize(data); if(!S.form||!Object.keys(S.form).length) E.refreshForm(S); riders=null; lastLog=null; flow=null; cur=null; pdesc=null; selTeamId=null;
  saveStamp(data.savedAt); return true; }catch(e){ console.warn('CycleSim load failed', e); return false; } }
async function clearSave(){ try{ const db=await idbOpen(); await new Promise(res=>{ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).delete(SKEY); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} saveStamp(null); }
function exportSave(){ if(!S){ msg('no game to export'); return; }
  const data=E.serialize(S); data.savedAt=Date.now();
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='cyclesim-'+dyear(S.year)+'-P'+S.phase+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); msg('save exported');
}
function importSave(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return; const fr=new FileReader();
    fr.onload=()=>{ try{ const data=JSON.parse(fr.result); S=E.deserialize(data); if(!S.form||!Object.keys(S.form).length) E.refreshForm(S);
        riders=null; lastLog=null; flow=null; cur=null; pdesc=null; selTeamId=null; saveGame();
        tab='divisions'; setTab(); render(); syncButtons(); msg('save imported — '+dyear(S.year)+' · Phase '+S.phase);
      }catch(e){ msg('could not read that save file'); console.warn(e); } };
    fr.readAsText(f); };
  inp.click();
}

  if(/^[A-Za-z]{2}$/.test(c)) return c.toLowerCase(); // value is already an ISO code
  return null; };
const cname=c=>CODE2NAME[c]||c;                       // display name
const flag=c=>{ const iso=isoFor(c);
  return iso?'<span class="flag fi fi-'+iso+'" title="'+cname(c)+'"></span>'

const champBadge=n=>{ if(!S||!S.champions||!n) return ''; let b='';

const JERSEY_PAL=[['#e6194b','#fff'],['#3cb44b','#fff'],['#4363d8','#fff'],['#f58231','#111'],['#911eb4','#fff'],['#1aa6c4','#111'],['#f032e6','#fff'],['#8bbf2a','#111'],['#469990','#fff'],['#9a6324','#fff'],['#e6c200','#111'],['#800000','#fff'],['#3fa37a','#fff'],['#808000','#fff'],['#d35400','#fff'],['#000075','#fff'],['#5d6d7e','#fff'],['#c0392b','#fff'],['#16a085','#fff'],['#7d3c98','#fff']];
function teamColors(t){ const id=(t&&t.id!=null)?t.id:0; const a=JERSEY_PAL[id%JERSEY_PAL.length]; const b=JERSEY_PAL[(id*7+5)%JERSEY_PAL.length]; return {body:a[0], ink:a[1], accent:b[0]}; }
function jersey(t,sz){ const c=teamColors(t); const w=sz||17, h=Math.round(w*0.92);

    '<rect x="10.8" y="3.6" width="2.4" height="16.4" fill="'+c.accent+'"/></svg>'; }

const hasMore=()=>!!E.nextUnit(S);
// primary stepper walks the guided pages: day → (preview → stage result → GC) per stage → recap → phase recap
$('btnPhase').onclick=()=>{ if(!S) return;
  if(flow===null){
    pdesc=E.setupPhase(S);
    if(pdesc.champs){ lastLog=E.finishPhase(S); flow='phaserecap'; }
    else { flow='day'; }
    tab='flow'; render(); syncButtons(); return;
  }
  if(flow==='day'){ cur=E.nextUnit(S); flow='preview'; flowTab='gc'; tab='flow'; render(); syncButtons(); return; }
  if(flow==='preview'){ cur=E.stepPhase(S); flow='result'; tab='flow'; render(); syncButtons(); return; }
  if(flow==='result'){
    flow = cur.race.done ? 'recap' : (cur.race.nStages>1 ? 'gc' : 'recap');
    tab='flow'; render(); syncButtons(); return;
  }
  if(flow==='gc' || flow==='recap'){
    if(hasMore()){ cur=E.nextUnit(S); flow='preview'; }
    else { lastLog=E.finishPhase(S); flow='phaserecap'; }
    tab='flow'; render(); syncButtons(); return;
  }
  if(flow==='phaserecap'){
    if((S.market||[]).length){ flow='market'; tab='flow'; render(); syncButtons(); }
    else { flow=null; cur=null; pdesc=null; tab='phase'; setTab(); render(); syncButtons(); saveGame(); }
    return;
  }
  if(flow==='market'){
    if(S.marketPool&&S.marketPool.length){ E.finishMarket(S); saveGame(); render(); syncButtons(); return; }  // place rest → show recap
    flow=null; cur=null; pdesc=null; tab='phase'; setTab(); render(); syncButtons(); saveGame(); return;        // recap shown → close
  }
};
$('btnYear').onclick=()=>{ if(!S||flow!==null) return; const y=S.year; let g=0; do{ lastLog=E.runPhase(S); g++; }while(S.year===y && g<40); tab='phase'; setTab(); render(); syncButtons(); saveGame(); };
function syncButtons(){
  const on=!!S;
  $('btnYear').disabled=!on||flow!==null;
  $('btnSave').disabled=!on;
  $('btnDraft').style.display = (riders && !S) ? '' : 'none';
  { const lw=$('loadwrap'), uw=$('updatewrap'); if(lw) lw.style.display = S?'none':''; if(uw) uw.style.display = S?'':'none'; }
  const b=$('btnPhase'); b.disabled=!on;
  if(!on){ b.textContent='Advance phase'; return; }
  if(flow===null){ const cal=S.calendar[S.phase-1]; b.textContent = cal.type==='CHAMPS'?'Run championships':'Start phase'; return; }
  const prog = cur&&cur.total ? ' ('+(cur.unit||cur.total)+'/'+cur.total+')' : '';
  if(flow==='day') b.textContent='Begin →';
  else if(flow==='preview') b.textContent=(cur&&cur.nStages>1?'Ride stage →':'Ride race →');
  else if(flow==='result') b.textContent='Continue →';
  else if(flow==='gc') b.textContent='Next stage →'+prog;
  else if(flow==='recap') b.textContent=hasMore()?('Next race →'+prog):'Finish phase →';
  else if(flow==='phaserecap') b.textContent=(S.market||[]).length?'Transfer market →':'Done →';
  else if(flow==='market') b.textContent=(S.marketPool&&S.marketPool.length)?'Finish market →':'Close market →';
}

function palmaresLine(e){
  const lab={win:'Won',['2nd']:'2nd',['3rd']:'3rd',points:'Points jersey',sprints:'Sprints jersey',kom:'Mountains jersey',NC:'National Champion',WC:'World Champion','WC-TT':'TT World Champion',stage:'Stage win'}[e.place]||e.place;
  const cls=(e.place==='win'||e.place==='stage')?'win':(e.place==='NC'||e.place==='WC'||e.place==='WC-TT')?'title':'';
  return '<li><span class="pwhen">'+dyear(e.y)+' · P'+e.p+'</span><span class="'+cls+'">'+lab+'</span> — '+e.race+(e.div?' <span class="mut">(D'+e.div+')</span>':'')+'</li>';
}
function palmaresBlock(entries){
  if(!entries||!entries.length) return '<div class="palmsum">No notable results yet.</div>';
  const POrd={WC:0,'WC-TT':1,NC:2};
  const titles=entries.filter(e=>['WC','WC-TT','NC'].includes(e.place))
    .sort((a,b)=>(POrd[a.place]-POrd[b.place])||(b.y-a.y));
  const wins=entries.filter(e=>e.place==='win');
  const stages=entries.filter(e=>e.place==='stage');
  const jerseys=entries.filter(e=>e.place==='points'||e.place==='sprints'||e.place==='kom');
  // group one-day/overall wins by race name → "Race ×N (years)"
  const winBy={}; wins.forEach(e=>{ (winBy[e.race]||(winBy[e.race]=[])).push(e.y); });
  const grouped=Object.entries(winBy).map(([race,ys])=>({race,ys:ys.sort((a,b)=>a-b)})).sort((a,b)=>b.ys.length-a.ys.length||a.race.localeCompare(b.race));
  // group stage wins by parent race
  const stBy={}; stages.forEach(e=>{ const base=String(e.race).replace(/ — stage.*$/,''); stBy[base]=(stBy[base]||0)+1; });
  let h='';
  if(titles.length) h+='<ul class="palm">'+titles.map(palmaresLine).join('')+'</ul>';
  if(grouped.length){ h+='<div class="palmh">Race wins</div><ul class="palm">'+
    grouped.slice(0,40).map(g=>'<li><span class="win">'+g.race+(g.ys.length>1?' <b>×'+g.ys.length+'</b>':'')+'</span> <span class="pwhen">'+g.ys.map(y=>dyear(y)).join(', ')+'</span></li>').join('')+'</ul>'; }
  const stKeys=Object.keys(stBy);
  if(stKeys.length){ h+='<div class="palmh">Stage wins</div><ul class="palm">'+
    stKeys.sort((a,b)=>stBy[b]-stBy[a]).slice(0,30).map(k=>'<li><span class="win">'+k+'</span> <span class="pwhen">'+stBy[k]+' stage'+(stBy[k]>1?'s':'')+'</span></li>').join('')+'</ul>'; }
  if(jerseys.length){ h+='<div class="palmh">Classification jerseys</div><ul class="palm">'+jerseys.slice(0,20).map(palmaresLine).join('')+'</ul>'; }
  const pod=entries.filter(e=>e.place==='2nd'||e.place==='3rd').length;
  const worlds=titles.filter(e=>e.place==='WC'||e.place==='WC-TT').length;
  h+='<div class="palmsum">'+wins.length+' wins · '+stages.length+' stage wins · '+pod+' other podiums · '+
    worlds+' world / '+titles.filter(e=>e.place==='NC').length+' national titles</div>';
  return h;
}
function openRider(name){
  const {r,team}=findRider(name); const box=$('modalbody');
  if(!r){ box.innerHTML='<div class="pmtitle">'+name+'</div><div class="pmsub">Not on a current roster.</div>'+palmaresBlock(S.palmares[name]); $('modal').style.display='flex'; return; }
  const inj=S.injuries[name]; const out=(inj!=null&&inj>=S.abs);
  const attrs=E.ATTRS.map(a=>'<div class="attr"><b>'+r.a[a]+'</b><span>'+a+'</span></div>').join('');
  const fm=(S.form&&S.form[name])||1;
  const formTag = fm>=1.035?'<span class="up" title="on a strong season">▲ in form</span>'
    : fm<=0.965?'<span class="dn" title="off-form season">▼ off form</span>'
    : '<span class="mut">→ steady</span>';
  box.innerHTML='<div class="pmtitle">'+flag(r.country)+name+(r.retired?' <span class="dn" style="font-size:.6em">RETIRED</span>':'')+'</div>'+
    '<div class="pmsub">'+cname(r.country)+' · '+(team?(divChip(team.division)+' '+tname(team)):'free agent')+
    ' · avg '+r.avg.toFixed(1)+' · '+(S.phasesRidden[name]||0)+' phases · '+(S.gt[name]||0)+' GTs · '+formTag+
    (out?' · <span class="dn">OUT '+(inj-S.abs+1)+'p</span>':'')+(r.lastSeen?' · last seen '+r.lastSeen:'')+'</div>'+
    '<div class="attrgrid">'+attrs+'</div>'+
    '<div style="margin:2px 0 12px"><button class="lnk" id="retireBtn">'+(r.retired?'↩ Un-retire rider':'⛔ Mark as retired')+'</button></div>'+
    '<div class="dsec">Palmarès</div>'+palmaresBlock(S.palmares[name]);
  const rb=document.getElementById('retireBtn'); if(rb) rb.onclick=()=>{ r.retired=!r.retired; saveGame(); openRider(name); render(); };
  $('modal').style.display='flex';
}

function render(){
  if(!S){ return; }
  const cal=S.calendar[S.phase-1];
  $('yp').textContent=dyear(S.year)+' · Phase '+S.phase+'/34';
  $('ptype').textContent = cal.type==='SPECIAL' ? ('SPECIAL — '+cal.special.name)
                         : cal.type==='CHAMPS' ? 'CHAMPIONSHIPS' : 'COMMON';
  $('ptype').className='ptype '+cal.type.toLowerCase();
  renderTicker();
  if(tab==='racescreen') renderRaceScreen();
  else if(tab==='flow') renderFlow();
  else if(tab==='divisions') renderDivisions();
  else if(tab==='calendar') renderCalendar();
  else if(tab==='phase') renderPhase();
  else if(tab==='ranking') renderRanking();
  else if(tab==='nations') renderNations();
  else if(tab==='history') renderHistory();
  else if(tab==='riders') renderRiders();
  else if(tab==='team') renderTeam();
  else if(tab==='market') renderMarket();
  // if a race flow is mid-way and we've wandered off to browse, offer a way back
  if(flow!==null && flow!=='phaserecap' && tab!=='flow' && tab!=='racescreen'){
    const bar=el('div','resumebar','↩ A race is in progress · <button class="lnk">Resume race</button>');
    bar.querySelector('.lnk').onclick=()=>{ tab='flow'; setTab(); render(); };
    const view=$('view'); view.insertBefore(bar, view.firstChild);
  }
}

function renderCalendar(){
  const v=$('view'); v.innerHTML='';
  v.appendChild(el('div','phead','<b>'+dyear(S.year)+' calendar</b> <span class="mut">— every race, phase by phase (hosts are set; line-ups are decided race day)</span>'));
  const sched=E.seasonSchedule(S);
  const tierBadge=t=>({MONUMENT:'Monument',TOUR:'Grand Tour',GT:'Grand Tour'}[t]);
  sched.forEach(ph=>{
    const cur=ph.phase===S.phase;
    const det=document.createElement('details'); det.className='calph'+(cur?' calcur':'');
    if(cur || ph.type!=='COMMON') det.open=true;
    const title = ph.type==='CHAMPS'?'🌈 Championships' : ph.type==='SPECIAL'?(flag(ph.races[0].host)+ph.races[0].name):'Race day';
    det.innerHTML='<summary><span class="calno">P'+ph.phase+'</span> <span class="calttl">'+title+'</span>'+
      '<span class="calcnt mut">'+ph.races.length+' race'+(ph.races.length>1?'s':'')+'</span></summary>';
    const body=el('div','calbody');
    ph.races.forEach(r=>{
      let left, right='';
      if(ph.type==='CHAMPS'){ left='<span class="lr-race">'+r.name+'</span>'; }
      else if(r.special){ const tb=tierBadge(r.tier); left='<span class="lr-race">'+flag(r.host)+'<b>'+r.name+'</b>'+(tb?' <span class="tierbadge">'+tb+'</span>':'')+'</span>';
        right='<span class="mut">D1 only · '+(E.TERRAIN_LABEL[r.terrain]||r.terrain)+(r.gt?' · 3 weeks':'')+'</span>'; }
      else { left='<span class="lr-race">'+divChip(r.division)+' '+flag(r.country)+r.name+'</span>';
        right='<span class="mut">'+(r.oneday?'one-day':'stage race')+'</span>'; }
      body.innerHTML+='<div class="calrace">'+left+right+'</div>';
    });
    det.appendChild(body); v.appendChild(det);
  });
}

function renderHistory(){
  const v=$('view'); v.innerHTML='';
  v.appendChild(el('div','phead','<b>History</b> <span class="mut">— season race log, newest first</span>'));
  const log=(S.log||[]);
  if(!log.length){ v.appendChild(el('div','empty','No results yet. Race a phase and winners will appear here.')); return; }
  const bar=el('div','subtabs');
  [['all','All races'],['1','D1'],['2','D2'],['3','D3'],['4','D4']].forEach(x=>{ const b=el('button','subtab'+(x[0]===histDiv?' on':''),x[1]);
    b.onclick=()=>{ histDiv=x[0]; renderHistory(); }; bar.appendChild(b); });
  v.appendChild(bar);
  // championship events always show; regular races obey the division filter
  const items=log.filter(e=> e.kind!=='race' || histDiv==='all' || e.div===+histDiv);
  const years={}; items.forEach(e=>{ (years[e.y]||(years[e.y]={})); (years[e.y][e.p]||(years[e.y][e.p]=[])).push(e); });
  const tierRank=t=>({WORLDS:0,MONUMENT:1,TOUR:2,GT:2,NATIONAL:9}[t]||5);
  Object.keys(years).map(Number).sort((a,b)=>b-a).forEach(y=>{
    const yb=el('div','logyear'); yb.innerHTML='<h3>'+dyear(y)+' season</h3>';
    const hy=(S.history||[]).find(h=>h.year===y);
    Object.keys(years[y]).map(Number).sort((a,b)=>b-a).forEach(p=>{
      const evs=years[y][p].slice().sort((a,b)=>tierRank(a.tier)-tierRank(b.tier)||((a.div||0)-(b.div||0))||String(a.race).localeCompare(String(b.race)));

      evs.forEach(e=>{
        if(e.kind==='world') h+='<div class="logrow champ">🌈 <b>World Champion</b> — '+flag(e.country)+rname(e.name)+' '+teamNameById(e.teamId)+'</div>';
        else if(e.kind==='worldtt') h+='<div class="logrow champ">⏱️ <b>TT World Champion</b> — '+flag(e.country)+rname(e.name)+' '+teamNameById(e.teamId)+'</div>';
        else if(e.kind==='national'){
          h+='<div class="logrow mut">🏅 National Championships — '+(e.count||0)+' nations';
          if(hy && Array.isArray(hy.nationals) && hy.nationals.length){

            h+=' <details class="natdet"><summary>show all</summary><div class="histmaj">'+
              nat.map(n=>'<span class="hm">'+flag(n.country)+'<b>'+n.name+'</b> <span class="mut">'+cname(n.country)+'</span></span>').join('')+'</div></details>';
          }

          const badge = e.tier && /MONUMENT|TOUR|GT/.test(e.tier) ? ' <span class="tierbadge">'+e.tier+'</span>' : '';
          h+='<div class="logrow"><span class="lr-race">'+divChip(e.div)+' '+e.race+badge+'</span><span class="lr-win">'+flag(e.country)+rname(e.name)+' '+teamNameById(e.teamId)+'</span></div>';
        }
      });
      pb.innerHTML=h; yb.appendChild(pb);
    });
    v.appendChild(yb);
  });
}
// ---- guided race flow: day → preview → stage result → GC → recap → phase recap ----
function renderFlow(){
  const v=$('view'); v.innerHTML='';
  if(flow==='day') return flowDay(v);
  if(flow==='preview') return flowPreview(v);
  if(flow==='result') return flowResult(v);
  if(flow==='gc') return flowGC(v);
  if(flow==='recap') return flowRecap(v);
  if(flow==='phaserecap') return renderPhase();
  if(flow==='market') return renderMarket();
  v.appendChild(el('div','empty','—'));
}
function flowDay(v){

    ' <span class="mut">· '+pdesc.races.length+' race'+(pdesc.races.length>1?'s':'')+' today</span>'));
  const first=pdesc.races[0];
  v.appendChild(el('div','flowsub','Race day — events resolve east to west'+(first?', '+flag(first.country)+cname(first.country)+' first':'')+'. Press <b>Begin</b>.'));

    const profile = r.nStages>1 ? r.nStages+' stages' : 'one-day';

      '<b>'+r.name+'</b> <span class="mut">· '+profile+' · '+r.tier+'</span>');

function flowPreview(v){

    const d=el('div'); d.innerHTML='<div class="dsec">Division debut <span class="mut">· first time in '+divChip(u.division)+'</span></div><div class="favrow">'+

    v.appendChild(d);

  if(u.isRaceStart && u.startlist){
    const byTeam={}; u.startlist.forEach(s=>{(byTeam[s.teamId]||(byTeam[s.teamId]=[])).push(s);});
    const order=Object.keys(byTeam).sort((a,b)=>Math.max.apply(null,byTeam[b].map(s=>s.rating))-Math.max.apply(null,byTeam[a].map(s=>s.rating)));

    h+='</div>'; const d=el('div'); d.innerHTML=h; v.appendChild(d);

    const d=el('div'); d.innerHTML='<div class="dsec">General classification — going into stage '+u.stageNo+'</div><ol class="fullgc">'+
      u.gc.map((g,i)=>gline(g,i,g.gap)).join('')+'</ol>';

function flowGC(v){
  const t=cur, r=t.race;
  const snap=E.phaseRaceSnapshot(S, r.name) || {gc:t.stage.gcTop, nStages:r.nStages, teamClass:[], pointsStand:[], komStand:[]};
  v.appendChild(el('div','phead',divChip(r.division)+' '+flag(r.country)+'<b>'+r.name+'</b> <span class="mut">· standings after stage '+r.cur+'/'+r.nStages+'</span>'));
  const ld=t.stage.gcTop[0];
  v.appendChild(el('div','flowsub','🟡 Race leader: '+(ld?flag(rcountry(ld.name))+rname(ld.name)+' '+teamNameById(ld.teamId):'—')));
  const tabs=[['gc','General']];
  if(snap.sprintStand&&snap.sprintStand.length) tabs.push(['spr','Sprints']);
  if(snap.isStage && snap.pointsStand&&snap.pointsStand.length) tabs.push(['pts','Points']);
  if(snap.komStand&&snap.komStand.length) tabs.push(['kom','Mountains']);
  if(snap.teamClass&&snap.teamClass.length) tabs.push(['team','Teams']);
  if(!tabs.some(x=>x[0]===flowTab)) flowTab='gc';
  const bar=el('div','subtabs'); tabs.forEach(x=>{ const b=el('button','subtab'+(x[0]===flowTab?' on':''),x[1]); b.onclick=()=>{ flowTab=x[0]; renderFlow(); }; bar.appendChild(b); });
  v.appendChild(bar);
  if(flowTab==='team') v.appendChild(el('div','flowsub mut','Provisional — ▲ promotion / ▼ relegation if standings hold.'));
  const body=el('div'); body.innerHTML=classRows(snap, flowTab); v.appendChild(body);
}
function flowRecap(v){

function flowInjuries(v, list){
  if(!list||!list.length){ v.appendChild(el('div','flowsub mut','No abandons.')); return; }
  const hurt=list.filter(i=>i.missed>0), fine=list.filter(i=>i.missed===0);
  const row=(i,tagHtml)=>{ const t=S.teamById[i.teamId];
    return '<div class="injrow"><span class="injr">'+flag(rcountry(i.name))+rname(i.name)+
      ' <span class="mut">·&nbsp;'+(t?tname(t):'—')+'</span></span>'+tagHtml+'</div>'; };
  let h='<div class="dsec">Abandons & injury report <span class="mut">· '+list.length+' out, '+hurt.length+' injured</span></div><div class="injlist">';
  hurt.forEach(i=>{ const c=i.severity==='minor'?'':'dn';
    h+=row(i,'<span class="injtag '+c+'">'+i.severity+' · '+i.days+'d · out '+i.missed+'p</span>'); });
  fine.forEach(i=>{ h+=row(i,'<span class="injtag mut">no injury</span>'); });
  h+='</div>'; const d=el('div'); d.innerHTML=h; v.appendChild(d);
}

function teamNameById(id){ const t=S.teamById[id]; return t?('<span class="mut">·</span> '+flag(t.country)+tname(t)):''; }
// rider row for classification lists: flag + name (+champion badges) + team + optional gap/value
function gline(g,i,gap){ return '<li><span class="pos">'+(i+1)+'</span> '+flag(rcountry(g.name))+rname(g.name)+' '+
  teamNameById(g.teamId)+(gap!==undefined?'<span class="gap">'+(typeof gap==='number'?gtime(gap):gap)+'</span>':'')+'</li>'; }
function teamClassList(r){ const rel=new Set(r.relZone||[]), pro=new Set(r.promoZone||[]);
  return '<ol class="fullgc tall">'+r.teamClass.slice(0,25).map((t,i)=>{ const tm=S.teamById[t.teamId];
    const mark = pro.has(t.teamId) ? '<span class="up" title="promotion">▲</span> '
               : rel.has(t.teamId) ? '<span class="dn" title="relegation">▼</span> ' : '';
    return '<li><span class="pos">'+(i+1)+'</span> '+mark+(tm?flag(tm.country)+tname(tm):t.teamId)+'</li>'; }).join('')+'</ol>'; }
function classRows(data, which){
  if(which==='spr') return '<ol class="fullgc tall">'+(data.sprintStand||[]).map((g,i)=>gline(g,i,g.val+' pts')).join('')+'</ol>';
  if(which==='pts') return '<ol class="fullgc tall">'+(data.pointsStand||[]).map((g,i)=>gline(g,i,g.val+' pts')).join('')+'</ol>';
  if(which==='kom') return '<ol class="fullgc tall">'+(data.komStand||[]).map((g,i)=>gline(g,i,g.val+' pts')).join('')+'</ol>';
  if(which==='team') return teamClassList(data);
  return '<ol class="fullgc tall">'+data.gc.map((g,i)=>gline(g,i,g.gap)).join('')+'</ol>';
}

// ---- full race screen ----
function openRaceFromResult(race, back){ const r=race.result;
  openRace({ name:race.name, division:race.division, country:race.country, tier:race.tier, gt:race.gt,
    nStages:race.nStages, terrain:race.terrain, done:true,

  const j=r.jersey||{}; const lead=r.done?'':' (leading)';

  v.appendChild(el('div','jerseys','<span class="jw">🏆 '+(r.gc[0]?flag(rcountry(r.gc[0].name))+rname(r.gc[0].name)+lead:'—')+'</span>'+

  // classification tab bar

  if(r.sprintStand&&r.sprintStand.length) tabs.push(['spr','Sprints']);
  if(isStage && r.pointsStand&&r.pointsStand.length) tabs.push(['pts','Points']);
  if(r.komStand&&r.komStand.length) tabs.push(['kom','Mountains']);

    body.innerHTML=classRows(r, raceTab);

  } else if(raceTab==='stages'){
    body.innerHTML='<div class="stagelist">'+r.stages.map(st=>'<div class="stagerow"><span class="stname">'+st.name+'</span><span class="stterr">'+(E.TERRAIN_LABEL[st.terrain]||st.terrain)+
      '</span><span class="stwin">'+(st.winner?flag(rcountry(st.winner.name))+rname(st.winner.name)+' '+teamNameById(st.winner.teamId):'—')+'</span></div>').join('')+'</div>';
  } else if(raceTab==='dnf'){
    body.innerHTML = r.abandons.length?('<div class="slgrid">'+r.abandons.map(a=>'<div class="slr">'+flag(rcountry(a.name))+rname(a.name)+' '+teamNameById(a.teamId)+'</div>').join('')+'</div>'):'<div class="palmsum">No abandons.</div>';
  }
  v.appendChild(body);
}

function renderRanking(){
  const v=$('view'); v.innerHTML='';
  const r=E.worldRanking(S);
  v.appendChild(el('div','phead','<b>World ranking</b> <span class="mut">— rolling last 33 phases</span>'));
  const tbl=el('table','tbl');
  tbl.innerHTML='<thead><tr><th>#</th><th></th><th>Team</th><th>Country</th><th class="r">Points</th></tr></thead>';
  const tb=el('tbody');
  r.slice(0,50).forEach((o,i)=>{
    const tr=el('tr');
    tr.innerHTML='<td class="mut">'+(i+1)+'</td><td>'+divChip(o.team.division)+'</td>'+
      '<td class="tn">'+tname(o.team)+'</td><td class="mut">'+flag(o.team.country)+cname(o.team.country)+'</td><td class="r mono">'+o.pts+'</td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); v.appendChild(tbl);
}

let nationsView='country', nationsSel=null;
function renderNations(){
  const v=$('view'); v.innerHTML='';
  v.appendChild(el('div','phead','<b>Territory ranking</b> <span class="mut">— riders ranked by career points earned in races held there</span>'));
  const bar=el('div','subtabs');
  [['country','By country'],['continent','By continent']].forEach(x=>{ const b=el('button','subtab'+(x[0]===nationsView?' on':''),x[1]);
    b.onclick=()=>{ nationsView=x[0]; nationsSel=null; renderNations(); }; bar.appendChild(b); });
  v.appendChild(bar);

  const list = nationsView==='continent' ? E.continentList(S) : E.territoryList(S);
  if(!list.length){ v.appendChild(el('div','empty','No race points yet. Race a few phases and territory rankings will build up.')); return; }
  const keyOf = x => nationsView==='continent' ? x.continent : x.country;
  if(!nationsSel || !list.some(x=>keyOf(x)===nationsSel)) nationsSel = keyOf(list[0]);

  // territory selector
  const selWrap=el('div','selwrap');
  const sel=document.createElement('select'); sel.className='terrsel';
  list.forEach(x=>{ const o=document.createElement('option'); const k=keyOf(x);
    o.value=k; o.textContent=(nationsView==='continent'? k : cname(k))+'  ·  '+Math.round(x.pts)+' pts';
    if(k===nationsSel) o.selected=true; sel.appendChild(o); });
  sel.onchange=()=>{ nationsSel=sel.value; renderNations(); };
  const lbl=nationsView==='continent' ? nationsSel : (flag(nationsSel)+' '+cname(nationsSel));
  selWrap.innerHTML='<span class="selttl">'+lbl+'</span>';
  selWrap.appendChild(sel);
  v.appendChild(selWrap);

  const riders = nationsView==='continent' ? E.continentRiderRanking(S, nationsSel) : E.nationRiderRanking(S, nationsSel);
  const tbl=el('table','tbl'); const tb=el('tbody');
  tbl.innerHTML='<thead><tr><th>#</th><th>Rider</th><th>Team</th><th class="r">Races</th><th class="r">Points</th></tr></thead>';
  riders.slice(0,100).forEach((r,i)=>{ const tr=el('tr'); tr.className='rrow';
    tr.innerHTML='<td class="mut">'+(i+1)+'</td>'+
      '<td class="tn">'+flag(r.country)+rname(r.name)+'</td>'+
      '<td>'+(r.teamId!=null?teamNameById(r.teamId):'<span class="mut">—</span>')+'</td>'+
      '<td class="r mono">'+r.races+'</td><td class="r mono">'+Math.round(r.pts)+'</td>';
    tr.onclick=()=>openRider(r.name); tb.appendChild(tr); });
  tbl.appendChild(tb); v.appendChild(tbl);
}

function renderRiders(){
  const v=$('view'); v.innerHTML='';
  const rankPts={}; E.worldRankingRiders(S).forEach(o=>rankPts[o.name]=o.pts);
  const rows=[];
  S.teams.forEach(t=>t.riders.forEach(r=>{
    const inj=S.injuries[r.name]; const out=(inj!=null&&inj>=S.abs)?(inj-S.abs+1):0;
    rows.push({name:r.name, country:r.country, cn:cname(r.country), teamId:t.id, teamName:t.name,
      division:t.division, rating:r.avg, phases:S.phasesRidden[r.name]||0, out, pts:rankPts[r.name]||0, retired:!!r.retired}); }));
  (S.freeAgents||[]).forEach(r=>{ const inj=S.injuries[r.name]; const out=(inj!=null&&inj>=S.abs)?(inj-S.abs+1):0;
    rows.push({name:r.name, country:r.country, cn:cname(r.country), teamId:null, teamName:'', division:9,
      rating:r.avg, phases:S.phasesRidden[r.name]||0, out, pts:rankPts[r.name]||0, retired:!!r.retired}); });
  v.appendChild(el('div','phead','<b>Riders</b> <span class="mut">— '+rows.length.toLocaleString()+' riders · click a column to sort</span>'));

  const cmp={ name:(a,b)=>a.name.localeCompare(b.name), country:(a,b)=>a.cn.localeCompare(b.cn)||a.name.localeCompare(b.name),
    team:(a,b)=>(a.division-b.division)||a.teamName.localeCompare(b.teamName)||b.rating-a.rating,
    division:(a,b)=>a.division-b.division||b.rating-a.rating, rating:(a,b)=>a.rating-b.rating,
    phases:(a,b)=>a.phases-b.phases, health:(a,b)=>a.out-b.out||b.rating-a.rating, points:(a,b)=>a.pts-b.pts };
  rows.sort((a,b)=>cmp[riderSort.key](a,b)*riderSort.dir);

  const cols=[['name','Rider',1],['country','Country',1],['team','Team',1],['division','Div',1],
    ['rating','Rating',-1],['phases','Phases',-1],['health','Health',1],['points','Points',-1]];
  const tbl=el('table','tbl');
  const ar=k=> riderSort.key===k ? ('<span class="ar">'+(riderSort.dir>0?'▲':'▼')+'</span>') : '';
  tbl.innerHTML='<thead><tr><th>#</th>'+cols.map(c=>'<th class="sort'+(c[0]==='rating'||c[0]==='phases'||c[0]==='points'?' r':'')+'" data-k="'+c[0]+'" data-d="'+c[2]+'">'+c[1]+' '+ar(c[0])+'</th>').join('')+'</tr></thead>';
  const tb=el('tbody');
  rows.slice(0,400).forEach((o,i)=>{ const t=o.teamId!=null?S.teamById[o.teamId]:null;
    const health=o.retired?'<span class="dn">retired</span>':o.out>0?'<span class="dn">out '+o.out+'p</span>':'<span class="up">fit</span>';
    const tr=el('tr');
    tr.innerHTML='<td class="mut">'+(i+1)+'</td><td class="tn">'+rname(o.name)+'</td>'+
      '<td class="mut">'+flag(o.country)+cname(o.country||'')+'</td>'+
      '<td class="mut">'+(t?tname(t):'<span class="mut">free agent</span>')+'</td>'+
      '<td>'+(o.division===9?'<span class="mut">—</span>':divChip(o.division))+'</td>'+
      '<td class="r mono">'+o.rating.toFixed(1)+'</td><td class="r mono">'+o.phases+'</td>'+
      '<td>'+health+'</td><td class="r mono">'+o.pts+'</td>';
    tb.appendChild(tr); });
  tbl.appendChild(tb); v.appendChild(tbl);
  if(rows.length>400) v.appendChild(el('div','palmsum','Showing top 400 of '+rows.length.toLocaleString()+' by current sort.'));
  tbl.querySelectorAll('th.sort').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k, d=+th.dataset.d;
    riderSort = (riderSort.key===k) ? {key:k,dir:-riderSort.dir} : {key:k,dir:d};
    render();
  });
}

function renderTeam(){
  const v=$('view'); v.innerHTML='';
  const sel=el('select','teamsel'); sel.id='teamPick';
  S.teams.slice().sort((a,b)=>a.division-b.division||a.name.localeCompare(b.name)).forEach(t=>{
    const o=el('option',null,'D'+t.division+' · '+t.name+' ('+cname(t.country)+')'); o.value=String(t.id); sel.appendChild(o);
  });
  if(selTeamId==null) selTeamId=S.teams[0].id;
  sel.value=String(selTeamId);
  sel.onchange=()=>{ selTeamId=+sel.value; renderTeamBody(selTeamId); };
  v.appendChild(sel);
  v.appendChild(el('div','teambody'));
  renderTeamBody(selTeamId);
}
function renderTeamBody(id){
  const t=S.teamById[id]; const box=document.querySelector('.teambody'); if(!t||!box)return;
  const rp=rankPts();
  let h='<div class="tmeta">'+divChip(t.division)+' '+flag(t.country)+'<b>'+t.name+'</b> <span class="mut">· '+cname(t.country)+
    ' · avg '+t.avg.toFixed(1)+' · '+(rp[t.id]||0)+' ranking pts</span></div>';
  h+='<div class="tmeta mut">Phases by division: '+[1,2,3,4].map(d=>'D'+d+' '+(t.phasesByDivision[d]||0)).join(' · ')+'</div>';
  h+='<div class="dsec">Roster</div>';
  h+='<table class="tbl"><thead><tr><th>Rider</th><th>Country</th><th class="r">Avg</th><th class="r">Phases</th><th class="r">GTs</th><th>Status</th></tr></thead><tbody>';
  t.riders.slice().sort((a,b)=>b.avg-a.avg).forEach(r=>{
    const inj=S.injuries[r.name]; const out=(inj!=null&&inj>=S.abs);
    const status=out?('<span class="dn">OUT '+(inj-S.abs+1)+'p</span>'):'<span class="ok">fit</span>';
    h+='<tr><td class="tn">'+rname(r.name)+'</td><td class="mut">'+flag(r.country)+cname(r.country)+'</td><td class="r mono">'+r.avg.toFixed(1)+
      '</td><td class="r mono">'+(S.phasesRidden[r.name]||0)+'</td><td class="r mono">'+(S.gt[r.name]||0)+
      '</td><td>'+status+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="dsec">Team palmarès</div>'+palmaresBlock(S.teamPalmares[id]);
  box.innerHTML=h;
}

function renderMarket(){
  const v=$('view'); v.innerHTML='';
  const pool=S.marketPool||[];
  v.appendChild(el('div','phead','<b>Transfer market</b> <span class="mut">— sign each rider (best first) to one of three random teams; every team finishes with exactly 15</span>'));
  if(!pool.length){
    const log=(S.marketLog||[]).slice().sort((a,b)=>b.avg-a.avg);
    v.appendChild(el('div','phead','<b>Transfer market — summary</b> <span class="mut">— every team is back to 15 riders</span>'));
    if(!log.length){ v.appendChild(el('div','empty','No signings this window.')); return; }
    const moved=log.filter(l=>l.fromId!==l.toId).length;
    v.appendChild(el('div','flowsub',log.length+' rider'+(log.length===1?'':'s')+' signed · '+moved+' changed teams · '+(log.length-moved)+' re-signed. Click “Close market” to continue.'));
    const tbl=el('table','tbl');
    tbl.innerHTML='<thead><tr><th>Rider</th><th>Country</th><th class="r">Avg</th><th>Former team</th><th></th><th>Current team</th></tr></thead>';
    const tb=el('tbody');
    log.forEach(l=>{ const ft=S.teamById[l.fromId], ct=S.teamById[l.toId]; const same=l.fromId===l.toId;
      const tcell=tt=>tt?(divChip(tt.division)+' '+tname(tt)):'<span class="mut">—</span>';
      const tr=el('tr');
      tr.innerHTML='<td class="tn">'+rname(l.name)+'</td><td class="mut">'+flag(l.country)+cname(l.country)+'</td>'+
        '<td class="r mono">'+l.avg.toFixed(1)+'</td>'+
        '<td class="mut">'+tcell(ft)+'</td>'+
        '<td class="mut" style="text-align:center">'+(same?'<span class="mut">=</span>':'→')+'</td>'+
        '<td'+(same?' class="mut"':'')+'>'+tcell(ct)+'</td>';
      tb.appendChild(tr);
    });
    tbl.appendChild(tb); v.appendChild(tbl);
    return;
  }
  const active=pool[0];                                   // best unsigned rider = the one in play
  const cand=(S.marketTeams||[]).map(id=>S.teamById[id]).filter(Boolean);
  const aft=S.teamById[active.fromId]; const adiv=aft?aft.division:null;
  const range = adiv!=null ? (' <span class="mut">· eligible divisions '+[adiv-1,adiv,adiv+1].filter(d=>d>=1&&d<=4).map(d=>'D'+d).join('/')+'</span>') : '';
  v.appendChild(el('div','flowsub','Now signing: '+flag(active.country)+'<b>'+active.name+'</b> <span class="mut">'+active.avg.toFixed(1)+' — pick one of three teams</span>'+range));
  const rows=pool.map(p=>{ const ft=S.teamById[p.fromId];
    return { name:p.name, country:p.country||'', cn:cname(p.country||''), avg:p.avg,
      fromId:p.fromId, fromName:ft?ft.name:'', fromDiv:ft?ft.division:9 }; });
  const cmp={ name:(a,b)=>a.name.localeCompare(b.name), country:(a,b)=>a.cn.localeCompare(b.cn)||a.name.localeCompare(b.name),
    avg:(a,b)=>a.avg-b.avg, from:(a,b)=>(a.fromDiv-b.fromDiv)||a.fromName.localeCompare(b.fromName) };
  rows.sort((a,b)=>cmp[marketSort.key](a,b)*marketSort.dir);
  const cols=[['name','Rider',1],['country','Country',1],['avg','Avg',-1],['from','Former team',1]];
  const ar=k=> marketSort.key===k?('<span class="ar">'+(marketSort.dir>0?'▲':'▼')+'</span>'):'';
  const tbl=el('table','tbl');
  tbl.innerHTML='<thead><tr>'+cols.map(c=>'<th class="sort'+(c[0]==='avg'?' r':'')+'" data-k="'+c[0]+'" data-d="'+c[2]+'">'+c[1]+' '+ar(c[0])+'</th>').join('')+'<th>Sign with</th></tr></thead>';
  const tb=el('tbody');
  rows.forEach(o=>{ const ft=S.teamById[o.fromId]; const isActive=o.name===active.name;
    let sign;
    if(isActive) sign = cand.length
      ? cand.map(ct=>'<button class="mktbtn" data-n="'+o.name.replace(/"/g,'&quot;')+'" data-t="'+ct.id+'">'+divChip(ct.division)+' '+flag(ct.country)+ct.name+'</button>').join(' ')
      : '<span class="mut">no eligible teams</span>';
    else sign='<span class="mut">—</span>';
    const tr=el('tr'); if(isActive) tr.className='mktactive';
    tr.innerHTML='<td class="tn">'+rname(o.name)+'</td><td class="mut">'+flag(o.country)+cname(o.country)+'</td>'+
      '<td class="r mono">'+o.avg.toFixed(1)+'</td>'+
      '<td class="mut">'+(ft?divChip(ft.division)+' '+tname(ft):'—')+'</td>'+
      '<td class="mktcell">'+sign+'</td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); v.appendChild(tbl);
  tbl.querySelectorAll('th.sort').forEach(th=>th.onclick=()=>{ const k=th.dataset.k, d=+th.dataset.d;
    marketSort=(marketSort.key===k)?{key:k,dir:-marketSort.dir}:{key:k,dir:d}; render(); });
  tbl.querySelectorAll('.mktbtn').forEach(b=>b.onclick=()=>{ if(E.signFromPool(S, b.dataset.n, +b.dataset.t)){ msg(b.dataset.n+' → '+S.teamById[+b.dataset.t].name); saveGame(); render(); } });
  const af=el('button','ghost'); af.textContent='Auto-fill remaining'; af.style.marginTop='12px';
  af.onclick=()=>{ E.finishMarket(S); msg('Remaining riders auto-placed'); saveGame(); render(); };
  v.appendChild(af);
}

msg('load a rider database to begin');
// auto-resume a saved season if one exists
(async function boot(){ try{ const ok=await loadGame();
  if(ok){ tab='divisions'; setTab(); render(); syncButtons(); msg('resumed your saved season — '+dyear(S.year)+' · Phase '+S.phase); }
}catch(e){} })();
})();

</script>
</body>
