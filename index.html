<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CycleSim v14 — skeleton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/6.6.6/css/flag-icons.min.css">
<style>
:root{
  --bg:#15161A; --panel:#1E2026; --panel2:#24262E; --line:#2E313B;
  --ink:#E8E6E0; --muted:#8A8D96;
  --d1:#F2C200; --d2:#9BB7D4; --d3:#C98A4B; --d4:#6B7280;
  --up:#3FB36B; --dn:#E0483D; --champ:#9B7BD4;
  --disp:'Barlow Condensed',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding:0 0 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:.04em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.18em;margin-left:8px}
.status{text-align:right;font-family:var(--disp);font-weight:600}
#yp{font-size:18px;letter-spacing:.02em}
.ptype{display:block;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.ptype.special{color:var(--d1)} .ptype.champs{color:var(--champ)}

.ticker{display:flex;gap:3px;padding:14px 22px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tcell{width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel);border-radius:4px;
  border:1px solid transparent;cursor:default}
.tcell.co{background:var(--panel)}
.tcell.sp{background:rgba(242,194,0,.14);color:var(--d1);border-color:rgba(242,194,0,.3)}
.tcell.ch{background:rgba(155,123,212,.16);color:#c9b6ec;border-color:rgba(155,123,212,.35)}
.tcell.now{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink)}

.controls{display:flex;align-items:center;gap:10px;padding:16px 22px;flex-wrap:wrap}
button,.filebtn{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.03em;text-transform:uppercase;
  background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer}
button:hover:not(:disabled),.filebtn:hover{border-color:#454a57}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent}
.filebtn{background:var(--d1);color:#1a1a1a;border-color:var(--d1)}
.filebtn input{display:none}
.msg{color:var(--muted);font-size:13px;margin-left:6px}

.pyramid{padding:8px 22px 18px;display:flex;flex-direction:column;gap:7px}
.prow{display:flex;align-items:center;gap:12px}
.pbar{position:relative;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;color:#15161A;font-family:var(--disp);font-weight:700;min-width:120px;transition:width .35s ease}
.pbar.d1{background:var(--d1)} .pbar.d2{background:var(--d2)} .pbar.d3{background:var(--d3)} .pbar.d4{background:var(--d4);color:#E8E6E0}
.plabel{font-size:15px;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
.pcount{font-family:var(--mono);font-size:15px}
.pflow{display:flex;gap:10px;font-family:var(--disp);font-weight:700;font-size:15px}
.pflow .up{color:var(--up)} .pflow .dn{color:var(--dn)}

.tabs{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;
  color:var(--muted);padding:10px 12px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--d1)}

main{padding:18px 22px}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.phead{font-family:var(--disp);font-size:18px;margin-bottom:12px}
.mut{color:var(--muted)} .r{text-align:right} .mono{font-family:var(--mono)}
.tn{font-weight:500}

.divsel,.tabs{flex-wrap:wrap}
.divsel{display:flex;gap:6px;margin-bottom:14px}
.pill{font-family:var(--disp);font-weight:700;padding:6px 16px;border-radius:20px;border:1px solid var(--line);
  background:transparent;color:var(--muted)}
.pill.on.d1{background:var(--d1);color:#1a1a1a;border-color:var(--d1)}
.pill.on.d2{background:var(--d2);color:#15161A;border-color:var(--d2)}
.pill.on.d3{background:var(--d3);color:#15161A;border-color:var(--d3)}
.pill.on.d4{background:var(--d4);color:#fff;border-color:var(--d4)}

.chip{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;color:#15161A;vertical-align:middle}
.chip.d1{background:var(--d1)} .chip.d2{background:var(--d2)} .chip.d3{background:var(--d3)} .chip.d4{background:var(--d4);color:#fff}
.chip.champ{background:var(--champ);color:#fff}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-family:var(--disp);font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  font-size:11px;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 10px;border-bottom:1px solid rgba(46,49,59,.5)}
.tbl tbody tr:hover{background:var(--panel)}
.tbl tbody tr{cursor:pointer}

.race{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.race.justran{border-color:var(--d1);box-shadow:0 0 0 1px var(--d1)}
.rhead{font-family:var(--disp);font-size:16px;margin-bottom:6px}
.rtop{list-style:none;margin:0;padding:0;font-size:13px}
.rtop li{padding:2px 0;display:flex;gap:8px;align-items:baseline}
.rtop .pos{font-family:var(--mono);color:var(--muted);width:16px}
.rfoot{margin-top:6px;font-size:12px}
.debut{font-family:var(--mono);font-size:10px;background:rgba(63,179,107,.16);color:var(--up);padding:2px 6px;border-radius:4px}
.movesum{margin-bottom:12px;font-family:var(--disp);font-size:15px}
.movesum .up{color:var(--up)} .movesum .dn{color:var(--dn)}
.champbox{background:rgba(155,123,212,.1);border:1px solid rgba(155,123,212,.3);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.up{color:var(--up)} .dn{color:var(--dn)} .ok{color:var(--muted)}

.teamsel{font-family:var(--disp);font-weight:600;font-size:15px;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-bottom:14px;min-width:280px}
.tmeta{font-family:var(--disp);font-size:16px;margin-bottom:6px}
.tmeta.mut{font-size:13px;margin-bottom:12px}

.lnk{font-family:var(--disp);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;
  background:none;border:none;color:var(--d1);padding:0 0 0 10px;cursor:pointer}
.rdetail{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.dsec{font-family:var(--disp);font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.jerseys{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
.jw{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:3px 10px}
.jw.pts{color:var(--up)} .jw.kom{color:var(--dn)}
.slgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slteam{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.slname{font-family:var(--disp);font-weight:600;font-size:13px;margin-bottom:3px}
.slr{font-size:11px;color:var(--muted)}
.fullgc{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto;font-size:12px;
  border:1px solid var(--line);border-radius:6px}
.fullgc li{display:flex;gap:8px;padding:3px 8px;border-bottom:1px solid rgba(46,49,59,.4)}
.fullgc .pos{font-family:var(--mono);color:var(--muted);width:26px;text-align:right}
.fullgc .gap{margin-left:auto;font-family:var(--mono);color:var(--muted);white-space:nowrap}
.flowsub{font-size:13px;color:var(--ink);margin:2px 0 12px}
.daycard{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:7px;padding:9px 12px;margin-bottom:7px;font-size:13px}
.daycard .dnum{font-family:var(--mono);color:var(--muted);width:1.6em;text-align:right}
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort:hover{color:var(--ink)}
.tbl th .ar{color:var(--d1)}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0 8px}
.subtab{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:6px;
  padding:4px 11px;font-family:var(--disp);font-size:12px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer}
.subtab:hover{color:var(--ink)} .subtab.on{background:var(--d1);color:#15161A;border-color:var(--d1);font-weight:600}
.chmp{font-size:.85em;margin-left:1px}
.srat{margin-left:auto;font-family:var(--mono);color:var(--d1);font-weight:600}
.slr{display:flex;align-items:center;gap:3px}
.fullgc.tall{max-height:520px}
.resumebar{background:rgba(242,194,0,.12);border:1px solid var(--d1);border-radius:7px;
  padding:8px 12px;margin-bottom:12px;font-size:13px;color:var(--ink)}
.injlist{display:flex;flex-direction:column;gap:3px}
.injrow{display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:12px;
  padding:5px 10px;background:var(--bg);border-radius:5px}
.injr{display:flex;align-items:center;gap:5px;min-width:0}
.injtag{font-family:var(--mono);font-size:11px;white-space:nowrap}
.mktcell{display:flex;gap:5px;flex-wrap:wrap}
.mktbtn{background:rgba(63,179,107,.14);border:1px solid rgba(63,179,107,.4);color:var(--up);
  border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.mktbtn:hover{background:rgba(63,179,107,.26)}
.mktbtn.cur{background:var(--panel);border-color:var(--line);color:var(--muted);cursor:default}
.mktnow .mktlbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mktnow .mktname{font-size:21px;font-weight:700;margin:3px 0 4px;display:flex;align-items:center;gap:8px}
.mktqueue{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 14px}
.mktqueue .mktq{font-size:12px;color:var(--text);display:inline-flex;align-items:center;gap:5px}
.stagelist{display:flex;flex-direction:column;gap:2px}
.stagerow{display:grid;grid-template-columns:80px 110px 1fr;gap:8px;align-items:baseline;font-size:12px;
  padding:3px 8px;background:var(--bg);border-radius:4px}
.stname{font-family:var(--disp);font-weight:600}
.stterr{color:var(--muted);font-size:11px}

.flag{display:inline-block;width:18px;height:13px;border-radius:2px;background-size:cover;background-position:center;
  vertical-align:-1px;margin-right:5px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.ccbadge{font-family:var(--mono);font-size:9px;background:rgba(120,128,160,.2);color:var(--muted);
  border-radius:3px;padding:1px 4px;margin-right:5px;vertical-align:1px}
.rl,.tl{cursor:pointer;border-bottom:1px dotted transparent}
.rl:hover,.tl:hover{border-bottom-color:var(--d1);color:var(--d1)}
#build{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.12em;margin-left:8px}

.modal{position:fixed;inset:0;background:rgba(8,9,11,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:560px;width:100%;
  max-height:84vh;overflow:auto;padding:18px 20px;position:relative}
.modalx{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--muted);font-size:22px;padding:0;line-height:1}
.pmtitle{font-family:var(--disp);font-size:22px;font-weight:700;margin:0 0 2px}
.pmsub{color:var(--muted);font-size:13px;margin-bottom:12px}
.attrgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 14px}
.attr{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px;text-align:center}
.attr b{display:block;font-family:var(--mono);font-size:13px}
.attr span{font-size:9px;color:var(--muted);letter-spacing:.04em}
.palm{list-style:none;margin:0;padding:0;font-size:13px}
.palm li{padding:3px 0;border-bottom:1px solid rgba(46,49,59,.4);display:flex;gap:8px;align-items:baseline}
.palm .pwhen{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:54px}
.palm .win{color:var(--d1)} .palm .title{color:var(--champ)}
.palmsum{font-size:12px;color:var(--muted);margin-top:8px}
.saveinfo{font-family:var(--mono);font-size:11px;color:var(--up)}
</style>
</head>
<body>
<header>
  <div class="brand">CycleSim <span id="build">v14</span></div>
  <div class="status"><span id="yp">—</span><span id="ptype" class="ptype"></span></div>
</header>
<div id="ticker" class="ticker"></div>
<div class="controls">
  <label class="filebtn" id="loadwrap">Load database<input type="file" id="csv" accept=".csv"></label>
  <label class="filebtn ghost" id="updatewrap" style="display:none">Update database<input type="file" id="updcsv" accept=".csv"></label>
  <button id="btnDraft" disabled>Run draft</button>
  <button id="btnPhase" disabled>Start phase</button>
  <button id="btnSkip" disabled>Skip to result</button>
  <button id="btnYear" disabled>Advance year</button>
  <button id="btnReset" class="ghost">Reset</button>
  <button id="btnSave" class="ghost" disabled>Save</button>
  <span id="saveinfo" class="saveinfo"></span>
  <span id="msg" class="msg"></span>
</div>
<nav class="tabs">
  <button data-tab="divisions" class="on">Divisions</button>
  <button data-tab="phase">Last phase</button>
  <button data-tab="ranking">World ranking</button>
  <button data-tab="riders">Riders</button>
  <button data-tab="team">Team</button>
  <button data-tab="market">Market</button>
</nav>
<main id="view"></main>
<div id="modal" class="modal" style="display:none"><div class="modalbox"><button class="modalx" id="modalx">×</button><div id="modalbody"></div></div></div>

  function parseCSV(text){
    const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
    const out=[];
    for(let i=0;i<lines.length;i++){
      const c = lines[i].split(',');
      if(c.length<18) continue;
      if(c[2]==='RIDER' || c[2]===undefined) continue;          // header

  // ---- genesis draft ----------------------------------------------------
  // One-time. 15 per team. (1) Randomly pick 8/15 of all riders as "natives",
  // bucket them by nationality into cores of 8 (small-nation leftovers merged
  // geographically). (2) Draft the rest: best rider -> best team, second -> second,
  // and so on, the SAME team order every round, so strength compounds.
  function genesisDraft(riders){
    const teamCount=Math.floor(riders.length/15);
    const nativeTarget=teamCount*8;
    const shuffled=shuffle(riders.slice());
    const natives=shuffled.slice(0,nativeTarget);
    const pool=shuffled.slice(nativeTarget);

    // bucket natives by nation -> cores of 8
    const byC={}; natives.forEach(r=>{(byC[r.country]||(byC[r.country]=[])).push(r);});
    const cores=[]; const leftover=[];
    Object.keys(byC).forEach(c=>{ const list=byC[c]; const g=Math.floor(list.length/8);
      for(let k=0;k<g;k++) cores.push({country:c, riders:list.slice(k*8,k*8+8)});
      list.slice(g*8).forEach(r=>leftover.push(r));
    });
    // geographic merge of leftovers into mixed cores (home = most-represented nation)
    leftover.sort((a,b)=>regionOf(a.country).localeCompare(regionOf(b.country)));
    for(let i=0;i+8<=leftover.length;i+=8){
      const grp=leftover.slice(i,i+8); const cnt={};
      grp.forEach(r=>cnt[r.country]=(cnt[r.country]||0)+1);
      const home=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
      cores.push({country:home, riders:grp});
    }
    leftover.slice(Math.floor(leftover.length/8)*8).forEach(r=>pool.push(r));

    // build teams, each named after an unused city of its home nation
    const cityUse={}; const teams=[]; let tid=0;
    cores.forEach(core=>{
      const city=cityFor(core.country, cityUse);
      teams.push({ id:tid++, name:city, homeCity:city, country:core.country,
                   riders:core.riders.slice(), avg:0, division:0,
                   phasesByDivision:{}, debutDivision:null });
    });
    teams.forEach(t=>t.avg=coreAvg(t));

    // straight draft: fixed team order (best core first), best remaining rider each round
    pool.sort((a,b)=>b.avg-a.avg);
    const order=teams.slice().sort((a,b)=>b.avg-a.avg);
    let pi=0;
    for(let round=0; round<7; round++){
      for(const t of order){ if(pi<pool.length) t.riders.push(pool[pi++]); }
    }
    teams.forEach(t=>{ t.avg = mean(t.riders.map(r=>r.avg)); });
    return { teams, freeAgents: pool.slice(pi) };
  }
  function cityFor(country, used){
    const list=CITIES[country]||[]; used[country]=used[country]||0;
    if(used[country]<list.length) return list[used[country]++];
    used[country]++; return country+' '+(used[country]-list.length); // fallback if cities exhausted
  }
  function coreAvg(t){ return mean(t.riders.map(r=>r.avg)); }
  function mean(a){ return a.length? a.reduce((s,x)=>s+x,0)/a.length : 0; }

  // By average rating. Caps 25/50/100 then D4 = everlasting remainder.
  // Robust to small datasets (clamps to team count).
  function seedDivisions(teams){
    const sorted = teams.slice().sort((a,b)=>b.avg-a.avg);
    const caps=[25,50,100];
    let i=0, div=1;
    for(const cap of caps){
      for(let k=0;k<cap && i<sorted.length;k++,i++) sorted[i].division=div;
      div++;
      if(i>=sorted.length) break;
    }
    while(i<sorted.length){ sorted[i].division=4; i++; } // D4 everlasting
    return divisionMap(teams);
  }
  function divisionMap(teams){
    const m={1:[],2:[],3:[],4:[]};
    teams.forEach(t=>{ if(m[t.division]) m[t.division].push(t); });
    return m;
  }
  function racesPerDivision(divTeamCount, division){
    if(division===1) return 1;
    if(division===2) return 2;
    if(division===3) return 4;
    return Math.max(1, Math.ceil(divTeamCount/25)); // D4
  }

  function buildCalendar(){

    const specialPhase = {}; // phase -> special index

    return phases;
  }

  const PTS_BASE=[100,80,70,62,54,48,42,38,34,30,26,22,18,14,10,6];
  const TIER_MULT={ TOUR:1.0, GT:0.8, MONUMENT:0.7, UWT:0.55, PRO:0.4, C21:0.28, C22:0.16, WORLDS:0.9, NATIONAL:0.2 };
  function pointsFor(tier,pos){ if(pos>=PTS_BASE.length) return 0; return Math.round(PTS_BASE[pos]*(TIER_MULT[tier]||0.2)); }
  function tierFor(division, race){
    if(race.special) return race.special.tier;     // TOUR / GT / MONUMENT
    if(division===1) return 'UWT';
    if(division===2) return 'PRO';
    if(division===3) return 'C21';
    return 'C22';
  }

  // ---- rider selection (7 of 15) ---------------------------------------
  function selectRaceRiders(team, race, S){
    const abs=S.abs;
    let pool = team.riders.filter(r=>{
      if(r.retired) return false;                                           // retired
      const inj=S.injuries[r.name]; if(inj!=null && inj>=abs) return false;  // still out
      if(race.gt && (S.gt[r.name]||0)>=2) return false;                       // GT cap
      return true;
    });
    const forced=[];
    if(race.gt==='TOUR' && pool.length){
      const best=pool.slice().sort((a,b)=>b.avg-a.avg)[0];
      forced.push(best); pool=pool.filter(r=>r!==best);
    }
    pool.sort((a,b)=>{
      const pa=S.phasesRidden[a.name]||0, pb=S.phasesRidden[b.name]||0;
      return pa-pb || Math.random()-0.5;
    });
    const pick = forced.concat(pool).slice(0,7);
    return pick;
  }

  // ---- race simulation: stage race (one-day = single stage) ------------
  function simulateRace(entries, stages){
    if(typeof stages==='string') stages=[{name:'One-day',terrain:stages}]; // back-compat
    const riders = entries.map(e=>({name:e.rider.name, teamId:e.teamId, country:e.rider.country,
      rider:e.rider, gc:0, pts:0, kom:0, out:false}));
    const stageResults=[]; const abandons=[];
    const dnfChance = stages.length>1 ? 0.012 : 0.04;
    stages.forEach(st=>{
      const wa=TERRAIN_ATTRS[st.terrain]||['FLA','STA'];
      riders.forEach(r=>{ if(!r.out && Math.random()<dnfChance){ r.out=true; abandons.push(r); } });
      const racing=riders.filter(r=>!r.out);
      racing.forEach(r=>{ const spec=(r.rider.a[wa[0]]+r.rider.a[wa[1]])/2;
        r._p = 0.5*r.rider.avg + 0.5*spec + 4*randn(); });
      const order=racing.slice().sort((a,b)=>b._p-a._p);
      order.forEach((r,i)=>{ r.gc += r._p;
        if(FLATISH.has(st.terrain)) r.pts += Math.max(0,15-i)*(r.rider.a.SPR/100);
        if(CLIMBISH.has(st.terrain)) r.kom += Math.max(0,15-i)*(r.rider.a.MTN/100);
      });
      stageResults.push({ name:st.name, terrain:st.terrain,
        top: order.slice(0,5).map((r,i)=>({pos:i,name:r.name,teamId:r.teamId})),
        winner: order[0]?{name:order[0].name,teamId:order[0].teamId}:null });
    });
    const finishers=riders.filter(r=>!r.out).sort((a,b)=>b.gc-a.gc);
    const gc=finishers.map((r,i)=>({pos:i,name:r.name,teamId:r.teamId,rider:r.rider}));
    const byTeam={}; gc.forEach(g=>{ (byTeam[g.teamId]||(byTeam[g.teamId]=[])).push(g.pos); });
    const teamClass=Object.keys(byTeam).map(tid=>{ const ps=byTeam[tid].sort((a,b)=>a-b).slice(0,3);
      return { teamId:+tid, score: ps.reduce((s,x)=>s+x,0)+(3-ps.length)*999 }; }).sort((a,b)=>a.score-b.score);
    const jp=best(finishers,r=>r.pts), jk=best(finishers,r=>r.kom);
    return { gc, abandons:abandons.map(a=>({name:a.name,teamId:a.teamId})), teamClass,
      jersey:{ points: jp?{name:jp.name,teamId:jp.teamId}:null, kom: jk?{name:jk.name,teamId:jk.teamId}:null },
      winner: gc[0]||null, stages:stageResults };
  }
  function best(arr,f){ let bv=-1,bx=null; arr.forEach(a=>{const v=f(a); if(v>bv){bv=v;bx=a;}}); return bx; }
  // provisional promotion/relegation zones from a race's current standings (for display)
  function computeZones(S, division, gc, teamClass, jpTid, jkTid){
    const ctx=S.phaseCtx, special=!!(ctx&&ctx.special);
    // how many go down from this race (D4 is the everlasting floor → none)
    const relN = division===4 ? 0 : ((special && division===1) ? 2 : 4);
    // how many come up from this race
    let promoK;
    if(division===1) promoK = special?2:0;            // D1 only promotes in special phases
    else { const cnt={}; (ctx?ctx.races:[]).forEach(r=>cnt[r.division]=(cnt[r.division]||0)+1);
      const above=cnt[division-1]||0, here=cnt[division]||1;
      promoK = Math.max(1, Math.round(4*above/here)); }
    // relegation: bottom relN non-exempt teams by team classification
    const safe=new Set(); gc.slice(0,10).forEach(g=>safe.add(g.teamId)); if(jpTid!=null)safe.add(jpTid); if(jkTid!=null)safe.add(jkTid);
    const relZone=[]; for(let i=teamClass.length-1;i>=0 && relZone.length<relN;i--){ if(!safe.has(teamClass[i].teamId)) relZone.push(teamClass[i].teamId); }
    // promotion (display): the race winner's team first, then world-ranking top-up —
    // mirrors the real promotion (winner + ranking), NOT the 2nd/3rd rider's team.
    const promoZone=[], seen=new Set();
    if(promoK>0 && gc.length){ promoZone.push(gc[0].teamId); seen.add(gc[0].teamId); }
    if(promoZone.length<promoK){
      const ranking=rankIndex(S);
      teamClass.map(tc=>tc.teamId).filter(id=>!seen.has(id))
        .sort((a,b)=>(ranking[a]??1e9)-(ranking[b]??1e9))
        .forEach(id=>{ if(promoZone.length<promoK){ promoZone.push(id); seen.add(id); } });
    }
    return { relZone, promoZone };
  }

  // ---- world ranking (rolling 33 phases) -------------------------------
  function worldRanking(S){
    const sums={};
    S.ledger.forEach(e=>{ if(S.abs - e.abs < 33){ sums[e.teamId]=(sums[e.teamId]||0)+e.pts; } });
    return S.teams.map(t=>({team:t, pts:sums[t.id]||0})).sort((a,b)=>b.pts-a.pts);
  }
  function worldRankingRiders(S){
    const sums={};
    S.riderLedger.forEach(e=>{ if(S.abs - e.abs < 33){ sums[e.name]=(sums[e.name]||0)+e.pts; } });
    return Object.keys(sums).map(n=>({name:n, pts:sums[n], teamId:S.riderTeam[n],
            country:S.riderCountry[n]})).sort((a,b)=>b.pts-a.pts);
  }
  function rankIndex(S){ const r=worldRanking(S); const idx={}; r.forEach((o,i)=>idx[o.team.id]=i); return idx; }

  // ---- phase execution: setup -> step each stage -> finish -------------
  // setupPhase builds the races (selecting riders + stages) without simulating;
  // stepPhase runs the next stage of every active race; finishPhase resolves
  // standings/points/promotion. runPhase composes them for fast-forward.
  function setupPhase(S){
    if(S.marketPool && S.marketPool.length) finishMarket(S);   // ensure every team is at 15 before racing
    const cal=S.calendar[S.phase-1];
    S.phaseCtx={ type:cal.type, races:[], log:{year:S.year,phase:S.phase,type:cal.type,races:[],moves:[]}, stage:0, maxStages:0 };
    if(cal.type==='CHAMPS'){ S.phaseCtx.champs=true; return phaseDescriptor(S); }
    const dm=divisionMap(S.teams);
    if(cal.type==='SPECIAL'){
      reshapeEliteD1(S, dm);
      const fresh=divisionMap(S.teams);
      S.phaseCtx.races.push(prepareRace(1, cal.special, fresh[1], S));
      S.phaseCtx.special=true;
    } else {
      for(let d=1; d<=4; d++){
        const teams=dm[d]; if(!teams||!teams.length) continue;
        const nR=racesPerDivision(teams.length,d); const pool=S.fixtures[d]||[]; if(!pool.length) continue;
        const hosts=drawFixtures(pool, nR, S.commonCount*nR);
        assignTeams(teams,hosts).forEach(b=>{ if(b.teams.length) S.phaseCtx.races.push(prepareRace(d,b.fixture,b.teams,S)); });
      }
      S.phaseCtx.dmBefore=dm;
    }
    // resolve races east-to-west (time-zone order): Australia/NZ first, California last
    S.phaseCtx.races.sort((a,b)=> geo(b.country)[1] - geo(a.country)[1]);
    S.phaseCtx.maxStages=Math.max(1, ...S.phaseCtx.races.map(r=>r.nStages));
    // unit queue: round-major, race-by-race (stage 1 of every race in TZ order, then stage 2, …)
    const units=[];
    for(let round=1; round<=S.phaseCtx.maxStages; round++)
      S.phaseCtx.races.forEach((rs,ri)=>{ if(rs.nStages>=round) units.push(ri); });
    S.phaseCtx.units=units; S.phaseCtx.uptr=0;
    return phaseDescriptor(S);
  }
  function phaseDescriptor(S){
    const ctx=S.phaseCtx;
    return { type:ctx.type, champs:!!ctx.champs, special:!!ctx.special, maxStages:ctx.maxStages||0,
      totalUnits:(ctx.units||[]).length,
      races: ctx.races.map(rs=>({ name:rs.name, host:rs.host, country:rs.country, division:rs.division,
        nStages:rs.nStages, tier:rs.tier, gt:rs.gt, teams:rs.teams.slice(),
        startlist: rs.riders.map(r=>({name:r.name,teamId:r.teamId})) })) };
  }
  function stepPhase(S){
    const ctx=S.phaseCtx; if(!ctx||ctx.champs) return null;
    if(ctx.uptr>=ctx.units.length) return { allDone:true, stage:null, unit:ctx.uptr, total:ctx.units.length };
    const ri=ctx.units[ctx.uptr++]; const rs=ctx.races[ri];
    const sr=stepRaceStage(rs);
    const inj=applyInjuries(S, sr.abandons); (rs.injuries||(rs.injuries=[])).push(...inj);
    let recap=null;
    if(rs.done && !rs.recorded){ recordRacePalmares(rs, S); rs.recorded=true; recap=finalizeRace(rs,S); }
    return { unit:ctx.uptr, total:ctx.units.length, raceIndex:ri, allDone: ctx.uptr>=ctx.units.length,
      stage:sr, injuries:inj, recap,
      race:{ name:rs.name, division:rs.division, host:rs.host, country:rs.country, tier:rs.tier, gt:rs.gt,
             done:rs.done, cur:rs.cur, nStages:rs.nStages } };
  }
  // peek the next race-stage WITHOUT simulating (for the preview page)
  function nextUnit(S){
    const ctx=S.phaseCtx; if(!ctx||ctx.champs||ctx.uptr>=ctx.units.length) return null;
    const ri=ctx.units[ctx.uptr]; const rs=ctx.races[ri]; const st=rs.stages[rs.cur];
    const gcNow=rs.riders.filter(r=>!r.out).sort((a,b)=>(a.time||0)-(b.time||0)||b.gc-a.gc);
    const lead=gcNow.length?(gcNow[0].time||0):0;
    return { raceIndex:ri, name:rs.name, division:rs.division, country:rs.country, host:rs.host,
      tier:rs.tier, gt:rs.gt, nStages:rs.nStages, stageNo:rs.cur+1, terrain:st.terrain,
      isRaceStart: rs.cur===0, isRaceEnd: rs.cur+1>=rs.nStages,
      unit:ctx.uptr+1, total:ctx.units.length,
      startlist: rs.cur===0 ? rs.riders.map(r=>({name:r.name,teamId:r.teamId,country:r.country,rating:r.rider.avg})) : null,
      gc: rs.cur>0 ? gcNow.slice(0,10).map((r,i)=>({pos:i,name:r.name,teamId:r.teamId,gap:(r.time||0)-lead})) : null };
  }
  function finishPhase(S){
    const ctx=S.phaseCtx; const log=ctx.log;
    if(ctx.champs){ runChamps(S, log); openMarket(S); advanceCounters(S); S.phaseCtx=null; return log; }
    const dr={};
    ctx.races.forEach(rs=>{ const race=finalizeRace(rs,S); log.races.push(race);
      awardPoints(S,race,rs.division); trackPhases(S,race,rs.division);
      (dr[rs.division]||(dr[rs.division]=[])).push(race); });
    S._divRaces=dr;
    if(ctx.special){ log.moves=specialPromoRelegate(S, log.races[0], divisionMap(S.teams)); }
    else { commonPromoRelegate(S, ctx.dmBefore, log); S.commonCount++; }
    S._divRaces={};
    openMarket(S);
    advanceCounters(S); S.phaseCtx=null;
    return log;
  }
  // transfer market: ~0.8% of the whole pool is listed each phase; signing is manual (UI)
  const ROSTER_SIZE=15;
  function eligibleMarketTeams(S){ return S.teams.filter(t=>t.riders.length<ROSTER_SIZE); }
  // up to three random teams that still need riders (re-rolled after every signing)
  function rollMarketTeams(S){ const ids=eligibleMarketTeams(S).map(t=>t.id); shuffle(ids); S.marketTeams=ids.slice(0,3); }
  // open the window: release ~0.8% of all riders into a floating pool sorted best→worst,
  // each release leaving an open slot on its former team. The pool is re-signed one rider
  // at a time (best first) until every team is back to exactly 15.
  function openMarket(S){
    const all=[]; S.teams.forEach(t=>t.riders.forEach(r=>{ if(!r.retired) all.push({r, tid:t.id}); }));
    const n=Math.max(1, Math.round(all.length*0.008));
    shuffle(all); S.marketPool=[];
    all.slice(0,n).forEach(({r,tid})=>{
      const t=S.teamById[tid], i=t.riders.indexOf(r); if(i>=0) t.riders.splice(i,1);
      delete S.riderTeam[r.name];
      S.marketPool.push(Object.assign({}, r, {fromId:tid}));
    });
    S.marketPool.sort((a,b)=>b.avg-a.avg);                 // best to worst
    S.teams.forEach(t=>{ t.avg=mean(t.riders.map(x=>x.avg)); });
    S.market=S.marketPool.map(p=>p.name);                  // names list (flow/compat checks)
    rollMarketTeams(S);
  }
  // sign the named pool rider to a team that still has an open slot (<15)
  function signFromPool(S, name, toId){
    const i=(S.marketPool||[]).findIndex(p=>p.name===name); if(i<0) return false;
    const t=S.teamById[toId]; if(!t || t.riders.length>=ROSTER_SIZE) return false;
    const p=S.marketPool.splice(i,1)[0]; const {fromId, ...rid}=p;
    t.riders.push(rid); S.riderTeam[name]=toId; S.riderCountry[name]=rid.country;
    t.avg=mean(t.riders.map(x=>x.avg));
    S.market=S.marketPool.map(q=>q.name);
    rollMarketTeams(S);
    return true;
  }
  // place any leftover pool riders so every team ends at exactly 15 (former team first)
  function finishMarket(S){
    (S.marketPool||[]).slice().forEach(p=>{
      let to=(S.teamById[p.fromId] && S.teamById[p.fromId].riders.length<ROSTER_SIZE) ? p.fromId : null;
      if(to==null){ const e=eligibleMarketTeams(S)[0]; to=e?e.id:null; }
      if(to!=null) signFromPool(S, p.name, to);
    });
    S.market=[]; S.marketTeams=[];
  }
  function transferRider(S, name, toTeamId){
    const fromId=S.riderTeam[name]; if(fromId===toTeamId) return false;
    const from=S.teamById[fromId], to=S.teamById[toTeamId]; if(!to) return false;
    let rider=null;
    if(from){ const i=from.riders.findIndex(r=>r.name===name); if(i>=0) rider=from.riders.splice(i,1)[0]; }
    if(!rider) return false;
    to.riders.push(rider); S.riderTeam[name]=toTeamId;
    from.avg=mean(from.riders.map(r=>r.avg)); to.avg=mean(to.riders.map(r=>r.avg));
    return true;
  }
  function advanceCounters(S){ S.abs++; if(S.phase>=34){ S.year++; S.phase=1; } else { S.phase++; } }

  // ---- import pipeline: overwrite stats from a re-imported database --------
  function normName(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
  function importUpdate(S, incoming){
    const existing=[]; S.teams.forEach(t=>t.riders.forEach(r=>existing.push(r))); (S.freeAgents||[]).forEach(r=>existing.push(r));
    const byId={}, byNorm={};
    existing.forEach(r=>{ if(r.id) byId[r.id]=r; const n=normName(r.name); (byNorm[n]||(byNorm[n]=[])).push(r); });
    const seen=new Set();
    const report={updated:0, added:0, ambiguous:[], addedNames:[], notSeen:[]};
    incoming.forEach(nr=>{
      let target=null;
      if(nr.id && byId[nr.id]) target=byId[nr.id];                          // 1) stable id
      else { const cand=byNorm[normName(nr.name)];                          // 2) normalized name
        if(cand){ if(cand.length===1) target=cand[0];
          else { report.ambiguous.push({name:nr.name, matches:cand.map(c=>c.name)}); return; } } } // homonyms: never auto-merge
      if(target){ target.avg=nr.avg; target.a=nr.a;
        if(nr.lastSeen) target.lastSeen=nr.lastSeen; if(nr.id&&!target.id) target.id=nr.id;
        if(nr.country){ target.country=nr.country; S.riderCountry[target.name]=nr.country; }
        seen.add(target); report.updated++; }
      else { const fa={name:nr.name,country:nr.country,avg:nr.avg,a:nr.a,id:nr.id,lastSeen:nr.lastSeen,retired:false};
        S.freeAgents.push(fa); S.riderCountry[nr.name]=nr.country; report.added++; report.addedNames.push(nr.name); }
    });
    S.teams.forEach(t=>{ t.avg=mean(t.riders.map(r=>r.avg)); });
    existing.forEach(r=>{ if(!seen.has(r)) report.notSeen.push(r.name); });   // staleness candidates
    return report;
  }
  // riders whose last-seen date is older than `days` (retirement-staleness alert)
  function staleRiders(S, days){
    const now=Date.now(), out=[];
    const scan=r=>{ if(r.retired||!r.lastSeen) return; const t=Date.parse(r.lastSeen); if(!isNaN(t) && (now-t)/86400000 > days) out.push({name:r.name, lastSeen:r.lastSeen}); };
    S.teams.forEach(t=>t.riders.forEach(scan)); (S.freeAgents||[]).forEach(scan);
    return out;
  }

  // atomic single-phase run (fast-forward path for Advance year / tests)
  function runPhase(S){
    setupPhase(S); const ctx=S.phaseCtx;
    if(!ctx.champs){ let g=0; while(ctx.uptr<ctx.units.length && g++<3000) stepPhase(S); }
    return finishPhase(S);
  }

  // ---- race construction + per-stage stepping --------------------------
  function prepareRace(division, meta, teams, S){
    const entries=[];
    teams.forEach(t=>{ const sel=selectRaceRiders(t, meta, S);
      sel.forEach(r=>{ entries.push({rider:r, teamId:t.id});
        S.phasesRidden[r.name]=(S.phasesRidden[r.name]||0)+1;
        if(meta.gt) S.gt[r.name]=(S.gt[r.name]||0)+1; }); });
    let stages;
    if(meta.gt) stages=buildStages('gt');
    else if(meta.oneday===false) stages=buildStages(randInt(3,7));
    else stages=buildStages('oneday', meta.terrain);
    const riders=entries.map(e=>({name:e.rider.name, teamId:e.teamId, country:e.rider.country,
      rider:e.rider, gc:0, pts:0, kom:0, out:false, energy:100, time:0}));
    return { division, name:meta.name, host:meta.host, country:meta.country||meta.host,
      tier:tierFor(division,{special:meta.tier?meta:null}), gt:meta.gt||null,
      nStages:stages.length, teams:teams.map(t=>t.id),
      stages, riders, stageResults:[], cur:0, done:false, abandons:[] };
  }
  function rand(a,b){ return a+Math.random()*(b-a); }
  function stepRaceStage(rs){
    if(rs.done) return null;
    const st=rs.stages[rs.cur], wa=TERRAIN_ATTRS[st.terrain]||['FLA','STA'];
    const climb = CLIMBISH.has(st.terrain) || st.terrain==='HIL';
    const flat  = st.terrain==='FLA' || st.terrain==='COB';
    const tt    = st.terrain==='TTR' || st.terrain==='PRL';
    const stageRace = rs.stages.length>1;
    // abandons this stage
    const fell=[];
    rs.riders.forEach(r=>{ if(!r.out && Math.random()<(stageRace?0.012:0.04)){ r.out=true; rs.abandons.push(r); fell.push(r);} });
    const racing=rs.riders.filter(r=>!r.out);
    // team leaders + headcount, for tactical support
    const leaderByTeam={}, matesByTeam={};
    racing.forEach(r=>{ matesByTeam[r.teamId]=(matesByTeam[r.teamId]||0)+1;
      const b=leaderByTeam[r.teamId]; if(!b||r.rider.avg>b.rider.avg) leaderByTeam[r.teamId]=r; });
    // performance: rating + specialism − fatigue + team support + noise
    racing.forEach(r=>{ const a=r.rider.a; if(r.energy==null) r.energy=100;
      const spec=(a[wa[0]]+a[wa[1]])/2;
      const fatigue=(100-r.energy)*0.05;
      let support=0; const mates=matesByTeam[r.teamId]-1;
      if(leaderByTeam[r.teamId]===r){
        if(climb) support += Math.min(3, mates*0.7);                 // domestiques pace uphill
        if(flat)  support += Math.min(2, mates*0.5)*(a.SPR/100);      // lead-out train
      }
      const noise=(tt?2.5:climb?4.5:flat?5.5:4)*randn();
      r._p = 0.5*r.rider.avg + 0.5*spec - fatigue + support + noise;
    });
    // breakaway: aggressive riders try to escape; survives more often uphill, rarely on the flat
    let note=null; const breakSet=new Set(); let bonus=0;
    if(racing.length>12 && !tt){
      const aggr=racing.slice().sort((a,b)=>(b.rider.a.ATT+b.rider.a.STA)-(a.rider.a.ATT+a.rider.a.STA));
      const brk=aggr.slice(0, 2+(Math.random()*5|0)).filter(()=>Math.random()<0.6);
      const survive = flat?0.10:climb?0.40:0.22;
      if(brk.length && Math.random()<survive){
        brk.forEach(r=>breakSet.add(r));
        bonus = Math.round(flat?rand(20,70):climb?rand(60,210):rand(40,150));
        note='Breakaway survived · '+brk.length+' riders, +'+bonus+'s';
      }
    }
    if(!note) note = tt?'Individual test':flat?'Bunch sprint':climb?'Summit showdown':'Punchy finish';
    // ordering: a surviving break contests the win, peloton arrives `bonus` seconds later
    const brkArr=racing.filter(r=>breakSet.has(r)).sort((a,b)=>b._p-a._p);
    const pelArr=racing.filter(r=>!breakSet.has(r)).sort((a,b)=>b._p-a._p);
    const order = breakSet.size ? brkArr.concat(pelArr) : racing.slice().sort((a,b)=>b._p-a._p);
    const sec=TERRAIN_GAP[st.terrain]||5, bunch=BUNCH[st.terrain]||0;
    const topP=order.length?order[0]._p:0, brkTopP=brkArr.length?brkArr[0]._p:topP;
    order.forEach((r,i)=>{
      let gap;
      if(breakSet.size){
        if(breakSet.has(r)) gap=Math.round(Math.max(0,(brkTopP-r._p))*sec);
        else gap=bonus+Math.round(Math.max(0,(brkArr[brkArr.length-1]._p - r._p))*(sec*0.3));
      } else gap=Math.round(Math.max(0,(topP-r._p)-bunch)*sec);
      r._gap=gap; r.time=(r.time||0)+gap; r.gc+=r._p;
      if(flat||st.terrain==='HIL') r.pts+=Math.max(0,15-i)*(r.rider.a.SPR/100);
      if(climb) r.kom+=Math.max(0,15-i)*(r.rider.a.MTN/100);
      const cost=(climb?14:tt?10:flat?8:11)*(1-(r.rider.a.STA/250));
      r.energy=Math.max(20, Math.min(100, r.energy - cost + r.rider.a.REC/14));
    });
    const gcNow=racing.slice().sort((a,b)=>(a.time||0)-(b.time||0)||b.gc-a.gc);
    const lead=gcNow.length?(gcNow[0].time||0):0;
    const sr={ name:st.name, terrain:st.terrain, note,
      results: order.slice(0,10).map((r,i)=>({pos:i,name:r.name,teamId:r.teamId,gap:r._gap})),
      winner: order[0]?{name:order[0].name,teamId:order[0].teamId}:null,
      gcTop: gcNow.slice(0,10).map((r,i)=>({pos:i,name:r.name,teamId:r.teamId,gap:(r.time||0)-lead})),
      abandons: fell.map(a=>({name:a.name,teamId:a.teamId})) };
    rs.stageResults.push(sr);
    rs.cur++; if(rs.cur>=rs.stages.length) rs.done=true;
    return sr;
  }
  function applyInjuries(S, abandons){
    const out=[];
    (abandons||[]).forEach(a=>{
      const roll=Math.random(); let days=0, sev='none';
      if(roll<0.25){ days=randInt(1,15); sev='minor'; }
      else if(roll<0.40){ days=randInt(16,60); sev='moderate'; }
      else if(roll<0.50){ days=randInt(61,300); sev='severe'; }
      const missed=Math.floor(days/11);
      if(missed>0){ S.injuries[a.name]=S.abs+missed; S.injuryDays[a.name]=days; }
      out.push({ name:a.name, teamId:a.teamId, days, missed, severity:sev });
    });
    return out;
  }
  function finalizeRace(rs, S){
    const finishers=rs.riders.filter(r=>!r.out).sort((a,b)=>(a.time||0)-(b.time||0)||b.gc-a.gc);
    const lead=finishers.length?(finishers[0].time||0):0;
    const gc=finishers.map((r,i)=>({pos:i,name:r.name,teamId:r.teamId,rider:r.rider,gap:(r.time||0)-lead}));
    const byTeam={}; gc.forEach(g=>{ (byTeam[g.teamId]||(byTeam[g.teamId]=[])).push(g.pos); });
    const teamClass=Object.keys(byTeam).map(tid=>{ const ps=byTeam[tid].sort((a,b)=>a-b).slice(0,3);
      return { teamId:+tid, score:ps.reduce((s,x)=>s+x,0)+(3-ps.length)*999 }; }).sort((a,b)=>a.score-b.score);
    const jp=best(finishers,r=>r.pts), jk=best(finishers,r=>r.kom);
    const pointsStand=finishers.slice().sort((a,b)=>b.pts-a.pts).filter(r=>r.pts>0).slice(0,30)
      .map((r,i)=>({pos:i,name:r.name,teamId:r.teamId,val:Math.round(r.pts)}));
    const komStand=finishers.slice().sort((a,b)=>b.kom-a.kom).filter(r=>r.kom>0).slice(0,30)
      .map((r,i)=>({pos:i,name:r.name,teamId:r.teamId,val:Math.round(r.kom)}));
    const result={ gc, abandons:rs.abandons.map(a=>({name:a.name,teamId:a.teamId})), teamClass,
      injuries: rs.injuries||[], pointsStand, komStand,
      ...computeZones(S, rs.division, gc, teamClass, jp?jp.teamId:null, jk?jk.teamId:null),
      jersey:{ points:jp?{name:jp.name,teamId:jp.teamId}:null, kom:jk?{name:jk.name,teamId:jk.teamId}:null },
      winner:gc[0]||null, stages:rs.stageResults };
    const race={ division:rs.division, name:rs.name, host:rs.host, country:rs.country,
      terrain: rs.nStages>1?'stage race':rs.stages[0].terrain, nStages:rs.nStages,
      tier:rs.tier, gt:rs.gt, teams:rs.teams, result };
    return race;
  }
  function recordRacePalmares(rs, S){
    const fin=rs.riders.filter(r=>!r.out).sort((a,b)=>(a.time||0)-(b.time||0)||b.gc-a.gc);
    const y=S.year, p=S.phase, rn=rs.name, dv=rs.division;
    const addR=(name,place)=>{ (S.palmares[name]||(S.palmares[name]=[])).push({y,p,race:rn,div:dv,place}); };
    const addT=(tid,place)=>{ (S.teamPalmares[tid]||(S.teamPalmares[tid]=[])).push({y,p,race:rn,div:dv,place}); };
    if(fin[0]){ addR(fin[0].name,'win'); addT(fin[0].teamId,'win'); }
    if(fin[1]) addR(fin[1].name,'2nd');
    if(fin[2]) addR(fin[2].name,'3rd');
    const jp=fin.slice().sort((a,b)=>b.pts-a.pts)[0], jk=fin.slice().sort((a,b)=>b.kom-a.kom)[0];
    if(jp) addR(jp.name,'points'); if(jk) addR(jk.name,'kom');
  }
  // live snapshot of a race in the current phase (for the full race screen, mid- or post-race)
  function phaseRaceSnapshot(S, name){
    const ctx=S.phaseCtx; if(!ctx) return null;
    const rs=ctx.races.find(r=>r.name===name); if(!rs) return null;
    const fin=rs.riders.filter(r=>!r.out).sort((a,b)=>(a.time||0)-(b.time||0)||b.gc-a.gc);
    const lead=fin.length?(fin[0].time||0):0;
    const jp=fin.slice().sort((a,b)=>b.pts-a.pts)[0], jk=fin.slice().sort((a,b)=>b.kom-a.kom)[0];
    const byTeam={}; fin.forEach((g,i)=>{ (byTeam[g.teamId]||(byTeam[g.teamId]=[])).push(i); });
    const teamClass=Object.keys(byTeam).map(tid=>{ const ps=byTeam[tid].slice(0,3);
      return { teamId:+tid, score:ps.reduce((s,x)=>s+x,0)+(3-ps.length)*999 }; }).sort((a,b)=>a.score-b.score);
    return { name:rs.name, division:rs.division, country:rs.country, tier:rs.tier, gt:rs.gt,
      nStages:rs.nStages, cur:rs.cur, done:rs.done, terrain: rs.nStages>1?'stage race':rs.stages[0].terrain,
      stages:rs.stageResults.slice(), teamClass, injuries: rs.injuries||[],
      pointsStand: fin.slice().sort((a,b)=>b.pts-a.pts).filter(r=>r.pts>0).slice(0,30).map((r,i)=>({pos:i,name:r.name,teamId:r.teamId,val:Math.round(r.pts)})),
      komStand: fin.slice().sort((a,b)=>b.kom-a.kom).filter(r=>r.kom>0).slice(0,30).map((r,i)=>({pos:i,name:r.name,teamId:r.teamId,val:Math.round(r.kom)})),
      gc: fin.map((r,i)=>({pos:i,name:r.name,teamId:r.teamId,gap:(r.time||0)-lead})),
      abandons: rs.abandons.map(a=>({name:a.name,teamId:a.teamId})),
      ...computeZones(S, rs.division, fin.map((r,i)=>({pos:i,name:r.name,teamId:r.teamId})), teamClass, jp&&jp.pts>0?jp.teamId:null, jk&&jk.kom>0?jk.teamId:null),
      jersey:{ points: jp&&jp.pts>0?{name:jp.name,teamId:jp.teamId}:null, kom: jk&&jk.kom>0?{name:jk.name,teamId:jk.teamId}:null } };
  }
  // pick nR fixtures from a division's pool, preferring distinct host countries
  function drawFixtures(pool, nR, offset){
    const N=pool.length, chosen=[], usedC=new Set();
    for(let i=0;i<N && chosen.length<nR;i++){ const f=pool[(offset+i)%N];
      if(!usedC.has(f.country)){ chosen.push(f); usedC.add(f.country); } }
    for(let i=0;i<N && chosen.length<nR;i++){ const f=pool[(offset+i)%N];
      if(!chosen.includes(f)) chosen.push(f); }
    return chosen;
  }
  function raceLabel(host,d,ri){ return host+' (D'+d+(ri?(' #'+(ri+1)):'')+')'; }

  // per-division race fixtures, generated once from the home cities of the teams
  // seeded into each division (a D1 city -> a D1 race, etc.). Fixed thereafter.
  function buildFixtures(teams){
    const fx={1:[],2:[],3:[],4:[]}; const dm=divisionMap(teams);
    [1,2,3,4].forEach(d=>{ dm[d].forEach((t,i)=>{
      const oneday=(i%2===0); const city=t.homeCity||t.name;
      fx[d].push({ name:(oneday?'Gran Premio ':'Tour de ')+city, host:city,
                   country:t.country, terrain:TERRAINS[(Math.random()*TERRAINS.length)|0],
                   division:d, oneday });
    }); });
    return fx;
  }

  function assignTeams(teams, hosts){
    const cap=25, buckets=hosts.map(h=>({fixture:h, country:h.country, teams:[]}));
    const ordered = teams.map(t=>{
      const ds=buckets.map((b,i)=>({i,d:gdist(t.country,b.country)+Math.random()*0.4}));
      ds.sort((a,b)=>a.d-b.d);
      return {t, ds};
    }).sort((a,b)=>{ // clearest preference (biggest gap to 2nd choice) placed first
      const ga=(a.ds[1]?a.ds[1].d:a.ds[0].d)-a.ds[0].d;
      const gb=(b.ds[1]?b.ds[1].d:b.ds[0].d)-b.ds[0].d;
      return gb-ga;
    });
    ordered.forEach(o=>{
      let placed=false;
      for(const cand of o.ds){ if(buckets[cand.i].teams.length<cap){ buckets[cand.i].teams.push(o.t); placed=true; break; } }
      if(!placed){ let m=0; buckets.forEach((b,i)=>{ if(b.teams.length<buckets[m].teams.length) m=i; }); buckets[m].teams.push(o.t); }
    });
    return buckets;
  }

  function awardPoints(S, race, division){
    race.result.gc.forEach(g=>{
      const pts=pointsFor(race.tier, g.pos);
      if(pts>0){ S.ledger.push({teamId:g.teamId, pts, abs:S.abs});
                 S.riderLedger.push({name:g.name, pts, abs:S.abs}); }
    });
  }

  function processInjuries(S, race){
    race.result.abandons.forEach(a=>{
      const roll=Math.random();
      let days=0;
      if(roll<0.25) days=randInt(1,15);
      else if(roll<0.40) days=randInt(16,60);
      else if(roll<0.50) days=randInt(61,300);
      if(days>0){
        const missed=Math.floor(days/11);
        if(missed>0){ S.injuries[a.name]=S.abs+missed; S.injuryDays[a.name]=days; }
      }
    });
  }
  function randInt(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }

  function trackPhases(S, race, division){
    const seen=new Set();
    race.teams.forEach(tid=>{
      const t=S.teamById[tid]; if(!t) return;
      const pbd=t.phasesByDivision;
      pbd[division]=(pbd[division]||0)+1;
      if(pbd[division]===1){ race.result.debutTeams=(race.result.debutTeams||[]); race.result.debutTeams.push(tid); }
    });
  }

  // ---- promotion / relegation ------------------------------------------
  function exemptTeams(race){
    // teams safe from relegation: GC top-10 rider OR a jersey winner
    const safe=new Set();
    race.result.gc.slice(0,10).forEach(g=>safe.add(g.teamId));
    if(race.result.jersey.points) safe.add(race.result.jersey.points.teamId);
    if(race.result.jersey.kom)    safe.add(race.result.jersey.kom.teamId);
    return safe;
  }
  function bottomNonExempt(race, n){
    const safe=exemptTeams(race);
    const out=[];
    for(let i=race.result.teamClass.length-1;i>=0 && out.length<n;i--){
      const tid=race.result.teamClass[i].teamId;
      if(!safe.has(tid)) out.push(tid);
    }
    return out;
  }
  function commonPromoRelegate(S, dmBefore, log){
    const dr=S._divRaces||{};
    const ranking=rankIndex(S);
    const moves=[];
    // relegations (down) per race: bottom-4 non-exempt
    const relegate={1:[],2:[],3:[]};
    [1,2,3].forEach(d=>{ (dr[d]||[]).forEach(race=>{ relegate[d].push(...bottomNonExempt(race,4)); }); });
    const relegateSet=new Set(); [1,2,3].forEach(d=>relegate[d].forEach(id=>relegateSet.add(id)));
    // promotions (up): promote(D) = 4 * races(divisionAbove); never a team already relegated
    const promoteCount={2:4*(dr[1]?dr[1].length:0), 3:4*(dr[2]?dr[2].length:0), 4:4*(dr[3]?dr[3].length:0)};
    const promote={2:[],3:[],4:[]};
    [2,3,4].forEach(d=>{
      const races=dr[d]||[]; const need=promoteCount[d]; if(!need) return;
      const winners=races.map(r=>r.result.winner?r.result.winner.teamId:null)
                         .filter(x=>x!=null && !relegateSet.has(x));
      const chosen=[]; const seen=new Set();
      winners.forEach(tid=>{ if(chosen.length<need && !seen.has(tid)){chosen.push(tid);seen.add(tid);} });
      if(chosen.length<need){
        const pool=(dmBefore[d]||[]).map(t=>t.id)
          .filter(id=>!seen.has(id) && !relegateSet.has(id))
          .sort((a,b)=>(ranking[a]??1e9)-(ranking[b]??1e9));
        for(const id of pool){ if(chosen.length>=need)break; chosen.push(id); seen.add(id); }
      }
      promote[d]=chosen.slice(0,need);
    });
    // apply: each team moves exactly once
    [2,3,4].forEach(d=>promote[d].forEach(tid=>{ S.teamById[tid].division=d-1; moves.push({tid,from:d,to:d-1,kind:'promote'}); }));
    [1,2,3].forEach(d=>relegate[d].forEach(tid=>{ S.teamById[tid].division=d+1; moves.push({tid,from:d,to:d+1,kind:'relegate'}); }));
    log.moves=moves;
  }

  function reshapeEliteD1(S, dm){
    // before a special phase, the special field = top-25 by world ranking, drawn
    // from the elite pool (D1∪D2). Kept a clean D1<->D2 swap so D3/D4 never leak.
    const pool=S.teams.filter(t=>t.division===1||t.division===2);
    const rankSum={}; S.ledger.forEach(e=>{ if(S.abs-e.abs<33) rankSum[e.teamId]=(rankSum[e.teamId]||0)+e.pts; });
    pool.sort((a,b)=>(rankSum[b.id]||0)-(rankSum[a.id]||0));
    pool.forEach((t,i)=>{ t.division = i<25 ? 1 : 2; });
  }
  function specialPromoRelegate(S, race, dm){
    const moves=[];
    const down=bottomNonExempt(race,2);
    down.forEach(tid=>{ S.teamById[tid].division=2; moves.push({tid,from:1,to:2,kind:'relegate'}); });
    const ranking=worldRanking(S);
    const up=ranking.filter(o=>o.team.division===2).slice(0,2).map(o=>o.team.id);
    up.forEach(tid=>{ S.teamById[tid].division=1; moves.push({tid,from:2,to:1,kind:'promote'}); });
    return moves;
  }

  // ---- championships (phase 34) ----------------------------------------
  function runChamps(S, log){
    // National championships: best home rider per nation wins the title + points
    // to their team. Then Worlds: a single elite field.
    const byNat={}; S.teams.forEach(t=>t.riders.forEach(r=>{ (byNat[r.country]||(byNat[r.country]=[])).push({r,teamId:t.id}); }));
    const champs={}; const nationals=[];
    Object.keys(byNat).sort().forEach(nat=>{
      const field=byNat[nat].map(e=>({...e, perf:e.r.avg+3*randn()})).sort((a,b)=>b.perf-a.perf);
      const w=field[0]; champs[nat]=w.r.name; nationals.push({country:nat, name:w.r.name, teamId:w.teamId});
      S.champions.national[nat]=w.r.name;
      (S.palmares[w.r.name]||(S.palmares[w.r.name]=[])).push({y:S.year,p:34,race:nat+' National Championship',div:0,place:'NC'});
      field.slice(0,8).forEach((e,i)=>{ const p=pointsFor('NATIONAL',i);
        S.ledger.push({teamId:e.teamId, pts:p, abs:S.abs});
        S.riderLedger.push({name:e.r.name, pts:p, abs:S.abs}); });
    });
    // Worlds: top ~150 riders by avg, one race
    const all=[]; S.teams.forEach(t=>t.riders.forEach(r=>all.push({rider:r,teamId:t.id})));
    all.sort((a,b)=>b.rider.avg-a.rider.avg);
    const field=all.slice(0,180);
    const res=simulateRace(field, buildStages('oneday','HIL'));
    res.gc.slice(0,16).forEach(g=>{ const p=pointsFor('WORLDS',g.pos);
      S.ledger.push({teamId:g.teamId, pts:p, abs:S.abs});
      S.riderLedger.push({name:g.name, pts:p, abs:S.abs}); });
    if(res.winner){
      S.champions.world=res.winner.name;
      (S.palmares[res.winner.name]||(S.palmares[res.winner.name]=[])).push({y:S.year,p:34,race:'World Championship',div:0,place:'WC'});
      (S.teamPalmares[res.winner.teamId]||(S.teamPalmares[res.winner.teamId]=[])).push({y:S.year,p:34,race:'World Championship',div:0,place:'WC'});
    }
    // Time Trial World Championship — field by TT ability, raced on a TT course
    const ttField=all.slice().sort((a,b)=>b.rider.a.TTR-a.rider.a.TTR).slice(0,120);
    const ttRes=simulateRace(ttField, buildStages('oneday','TTR'));
    ttRes.gc.slice(0,16).forEach(g=>{ const p=pointsFor('WORLDS',g.pos);
      S.ledger.push({teamId:g.teamId, pts:p, abs:S.abs});
      S.riderLedger.push({name:g.name, pts:p, abs:S.abs}); });
    if(ttRes.winner){
      S.champions.worldTT=ttRes.winner.name;
      (S.palmares[ttRes.winner.name]||(S.palmares[ttRes.winner.name]=[])).push({y:S.year,p:34,race:'TT World Championship',div:0,place:'WC-TT'});
      (S.teamPalmares[ttRes.winner.teamId]||(S.teamPalmares[ttRes.winner.teamId]=[])).push({y:S.year,p:34,race:'TT World Championship',div:0,place:'WC-TT'});
    }
    log.champs={ nationals, worldChampion: res.winner?{name:res.winner.name,teamId:res.winner.teamId,country:res.winner.rider.country}:null,
      ttWorldChampion: ttRes.winner?{name:ttRes.winner.name,teamId:ttRes.winner.teamId,country:ttRes.winner.rider.country}:null };
    log.races.push({division:0,name:'World Championship',host:'—',country:'—',terrain:'HIL',nStages:1,tier:'WORLDS',gt:null,teams:[],result:res});
    log.races.push({division:0,name:'TT World Championship',host:'—',country:'—',terrain:'TTR',nStages:1,tier:'WORLDS',gt:null,teams:[],result:ttRes});
  }

  // ---- new game ---------------------------------------------------------
  function newGame(riders){
    const {teams, freeAgents}=genesisDraft(riders);
    seedDivisions(teams);
    const teamById={}; teams.forEach(t=>teamById[t.id]=t);
    const riderTeam={}, riderCountry={};
    teams.forEach(t=>t.riders.forEach(r=>{ riderTeam[r.name]=t.id; riderCountry[r.name]=r.country; }));
    const S={
      riders, teams, teamById, freeAgents,
      fixtures: buildFixtures(teams),
      calendar: buildCalendar(),
      year:0, phase:34, abs:0, commonCount:0,   // Year 0 boots straight into championships
      ledger:[], riderLedger:[], riderTeam, riderCountry,
      palmares:{}, teamPalmares:{},
      injuries:{}, injuryDays:{}, phasesRidden:{}, gt:{},
      champions:{ world:null, worldTT:null, national:{} },
      market:[], marketTeams:[], marketPool:[],
      _divRaces:{}
    };
    return S;
  }

  // ---- persistence: serialize/rebuild a game (idle state only) ----------
  function serialize(S){
    const rid=r=>({name:r.name,country:r.country,avg:r.avg,a:r.a,id:r.id,lastSeen:r.lastSeen,retired:!!r.retired});
    // prune ranking ledgers to the rolling window (+margin) to keep saves small
    const keep=e=> (S.abs - e.abs) < 45;
    return { v:1, year:S.year, phase:S.phase, abs:S.abs, commonCount:S.commonCount,
      teams:S.teams.map(t=>({ id:t.id, name:t.name, homeCity:t.homeCity, country:t.country, division:t.division, avg:t.avg,
        phasesByDivision:t.phasesByDivision, riders:t.riders.map(rid) })),
      freeAgents:(S.freeAgents||[]).map(rid),
      ledger:S.ledger.filter(keep), riderLedger:S.riderLedger.filter(keep),
      palmares:S.palmares, teamPalmares:S.teamPalmares,
      injuries:S.injuries, injuryDays:S.injuryDays, phasesRidden:S.phasesRidden, gt:S.gt,
      champions:S.champions, market:S.market, marketTeams:S.marketTeams, marketPool:S.marketPool };
  }
  function deserialize(obj){
    const teams=obj.teams.map(t=>({ id:t.id, name:t.name, homeCity:t.homeCity||t.name, country:t.country, division:t.division, avg:t.avg,
      phasesByDivision:t.phasesByDivision||{}, riders:t.riders.map(r=>({...r})) }));
    const teamById={}; teams.forEach(t=>teamById[t.id]=t);
    const riderTeam={}, riderCountry={};
    teams.forEach(t=>t.riders.forEach(r=>{ riderTeam[r.name]=t.id; riderCountry[r.name]=r.country; }));
    (obj.freeAgents||[]).forEach(r=>{ riderCountry[r.name]=r.country; });
    (obj.marketPool||[]).forEach(p=>{ riderCountry[p.name]=p.country; });
    return { riders:[], teams, teamById, freeAgents:(obj.freeAgents||[]).map(r=>({...r})),
      fixtures:buildFixtures(teams), calendar:buildCalendar(),
      year:obj.year, phase:obj.phase, abs:obj.abs, commonCount:obj.commonCount||0,
      ledger:obj.ledger||[], riderLedger:obj.riderLedger||[], riderTeam, riderCountry,
      palmares:obj.palmares||{}, teamPalmares:obj.teamPalmares||{},
      injuries:obj.injuries||{}, injuryDays:obj.injuryDays||{}, phasesRidden:obj.phasesRidden||{}, gt:obj.gt||{},
      champions:obj.champions||{world:null,worldTT:null,national:{}}, market:obj.market||[], marketTeams:obj.marketTeams||[], marketPool:obj.marketPool||[],
      _divRaces:{} };
  }

  const API={ ATTRS, parseCSV, genesisDraft, seedDivisions, divisionMap, racesPerDivision,

              importUpdate, staleRiders,

  const more=el('div','rfoot','<button class="lnk">stage-by-stage & full field →</button>');
  more.querySelector('.lnk').onclick=()=>openRaceFromResult(race,'flow');
  v.appendChild(more);
}
function flowInjuries(v, list){
  if(!list||!list.length){ v.appendChild(el('div','flowsub mut','No abandons.')); return; }
  const hurt=list.filter(i=>i.missed>0), fine=list.filter(i=>i.missed===0);
  const row=(i,tagHtml)=>{ const t=S.teamById[i.teamId];
    return '<div class="injrow"><span class="injr">'+flag(rcountry(i.name))+rname(i.name)+
      ' <span class="mut">·&nbsp;'+(t?tname(t):'—')+'</span></span>'+tagHtml+'</div>'; };
  let h='<div class="dsec">Abandons & injury report <span class="mut">· '+list.length+' out, '+hurt.length+' injured</span></div><div class="injlist">';
  hurt.forEach(i=>{ const c=i.severity==='minor'?'':'dn';
    h+=row(i,'<span class="injtag '+c+'">'+i.severity+' · '+i.days+'d · out '+i.missed+'p</span>'); });
  fine.forEach(i=>{ h+=row(i,'<span class="injtag mut">no injury</span>'); });
  h+='</div>'; const d=el('div'); d.innerHTML=h; v.appendChild(d);
}

function renderTicker(){
  const t=$('ticker'); t.innerHTML='';
  S.calendar.forEach(c=>{
    const cls = c.type==='SPECIAL'?'sp':c.type==='CHAMPS'?'ch':'co';
    const cell=el('div','tcell '+cls+(c.phase===S.phase?' now':''));
    cell.title = c.type==='SPECIAL'?c.special.name : c.type==='CHAMPS'?'Championships':'Common phase '+c.phase;
    cell.textContent = c.phase;
    t.appendChild(cell);
  });
}

function rankPts(){ const m={}; E.worldRanking(S).forEach(o=>m[o.team.id]=o.pts); return m; }

function divChip(d){ return '<span class="chip '+DIVCOL[d]+'">D'+d+'</span>'; }

function renderDivisions(){
  const v=$('view'); v.innerHTML='';
  const sel=el('div','divsel');
  [1,2,3,4].forEach(d=>{ const b=el('button','pill '+DIVCOL[d]+(d===selDiv?' on':''),'D'+d);
    b.onclick=()=>{selDiv=d;renderDivisions();}; sel.appendChild(b); });
  v.appendChild(sel);
  const dm=E.divisionMap(S.teams); const rp=rankPts();
  const teams=dm[selDiv].slice().sort((a,b)=>(rp[b.id]||0)-(rp[a.id]||0));
  const tbl=el('table','tbl');
  tbl.innerHTML='<thead><tr><th>#</th><th>Team</th><th>Country</th><th class="r">Avg</th><th class="r">Ranking pts</th><th class="r">Phases in D'+selDiv+'</th></tr></thead>';
  const tb=el('tbody');
  teams.forEach((t,i)=>{
    const tr=el('tr');
    tr.innerHTML='<td class="mut">'+(i+1)+'</td><td class="tn">'+t.name+'</td><td class="mut">'+flag(t.country)+cname(t.country)+'</td>'+
      '<td class="r mono">'+t.avg.toFixed(1)+'</td><td class="r mono">'+(rp[t.id]||0)+'</td>'+
      '<td class="r mono">'+(t.phasesByDivision[selDiv]||0)+'</td>';
    tr.onclick=()=>{ selTeamId=t.id; tab='team'; setTab(); render(); };
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); v.appendChild(tbl);
}

function renderPhase(){
  const v=$('view'); v.innerHTML='';
  if(!lastLog){ v.appendChild(el('div','empty','Advance a phase to see races and results.')); return; }
  const head=el('div','phead','<b>Year '+lastLog.year+' · Phase '+lastLog.phase+'</b> — '+lastLog.type+
    (lastLog.type==='SPECIAL'?' ('+lastLog.races[0].name+')':''));
  v.appendChild(head);
  if(lastLog.champs){
    const c=lastLog.champs;
    const box=el('div','champbox');
    let h='<div class="dsec" style="margin-top:0">Championship phase — national titles, then the World Championship</div>';
    const wc=c.worldChampion, tt=c.ttWorldChampion;
    h+='<div style="font-family:var(--disp);font-size:18px;margin:4px 0 4px">🌈 World Champion: '+
      (wc?flag(wc.country)+rname(wc.name)+' <span class="mut">'+teamNameById(wc.teamId)+'</span>':'—')+'</div>';
    h+='<div style="font-family:var(--disp);font-size:16px;margin:0 0 10px">⏱ TT World Champion: '+
      (tt?flag(tt.country)+rname(tt.name)+' <span class="mut">'+teamNameById(tt.teamId)+'</span>':'—')+'</div>';
    h+='<div class="dsec">National champions ('+c.nationals.length+')</div><div class="slgrid">';
    c.nationals.forEach(n=>{ h+='<div class="slteam"><div class="slname">'+flag(n.country)+cname(n.country)+'</div>'+
      '<div class="slr">'+rname(n.name)+'</div></div>'; });
    h+='</div>';
    box.innerHTML=h; v.appendChild(box);
  }
  if((S.market||[]).length){
    v.appendChild(el('div','flowsub','🔁 <b>Transfer market open</b> — '+S.market.length+' rider'+(S.market.length===1?'':'s')+' released. Open the <b>Market</b> tab to re-sign them; every team finishes at 15.'));
  }
  lastLog.races.forEach(r=>{
    const card=el('div','race');
    const dbt=(r.result.debutTeams&&r.result.debutTeams.length)?' <span class="debut">'+r.result.debutTeams.length+' debut</span>':'';
    const terr = r.nStages>1 ? (r.nStages+' stages') : (E.TERRAIN_LABEL[r.terrain]||r.terrain);
    card.appendChild(el('div','rhead',(r.division?divChip(r.division):'<span class="chip champ">WC</span>')+
      ' '+flag(r.country)+'<b>'+r.name+'</b> <span class="mut">· '+terr+' · '+r.tier+'</span>'+dbt));
    card.appendChild(el('ol','rtop',r.result.gc.slice(0,5).map((g,i)=>gline(g,i)).join('')));
    const foot=el('div','rfoot','<span class="mut">'+r.result.gc.length+' finishers · '+
      r.result.abandons.length+' abandons</span><button class="lnk">view full race →</button>');
    foot.querySelector('.lnk').onclick=()=>openRaceFromResult(r,'phase');
    card.appendChild(foot);
    v.appendChild(card);
  });
}
function teamNameById(id){ const t=S.teamById[id]; return t?('<span class="mut">·</span> '+flag(t.country)+tname(t)):''; }
// rider row for classification lists: flag + name (+champion badges) + team + optional gap/value
function gline(g,i,gap){ return '<li><span class="pos">'+(i+1)+'</span> '+flag(rcountry(g.name))+rname(g.name)+' '+
  teamNameById(g.teamId)+(gap!==undefined?'<span class="gap">'+(typeof gap==='number'?gtime(gap):gap)+'</span>':'')+'</li>'; }
function teamClassList(r){ const rel=new Set(r.relZone||[]), pro=new Set(r.promoZone||[]);
  return '<ol class="fullgc tall">'+r.teamClass.slice(0,25).map((t,i)=>{ const tm=S.teamById[t.teamId];
    const mark = pro.has(t.teamId) ? '<span class="up" title="promotion">▲</span> '
               : rel.has(t.teamId) ? '<span class="dn" title="relegation">▼</span> ' : '';
    return '<li><span class="pos">'+(i+1)+'</span> '+mark+(tm?flag(tm.country)+tname(tm):t.teamId)+'</li>'; }).join('')+'</ol>'; }
function classRows(data, which){
  if(which==='pts') return '<ol class="fullgc tall">'+(data.pointsStand||[]).map((g,i)=>gline(g,i,g.val+' pts')).join('')+'</ol>';
  if(which==='kom') return '<ol class="fullgc tall">'+(data.komStand||[]).map((g,i)=>gline(g,i,g.val+' pts')).join('')+'</ol>';
  if(which==='team') return teamClassList(data);
  return '<ol class="fullgc tall">'+data.gc.map((g,i)=>gline(g,i,g.gap)).join('')+'</ol>';
}

// ---- full race screen ----
function openRaceFromResult(race, back){ const r=race.result;
  openRace({ name:race.name, division:race.division, country:race.country, tier:race.tier, gt:race.gt,
    nStages:race.nStages, terrain:race.terrain, done:true,
    stages:r.stages, gc:r.gc, abandons:r.abandons, jersey:r.jersey, teamClass:r.teamClass,
    pointsStand:r.pointsStand, komStand:r.komStand, injuries:r.injuries }, back); }
function openRaceSnapshot(name, back){ const s=E.phaseRaceSnapshot(S,name); if(s) openRace(s, back); }
function openRace(norm, back){ raceView=norm; raceBackTab=back||'phase'; raceTab='gc'; tab='racescreen'; render(); }
function renderRaceScreen(){
  const v=$('view'); v.innerHTML=''; const r=raceView;
  if(!r){ tab=raceBackTab; render(); return; }
  const back=el('button','lnk','← back'); back.style.cssText='margin-bottom:10px;padding-left:0';
  back.onclick=()=>{ tab=raceBackTab; setTab(); render(); };
  v.appendChild(back);
  const profile = r.nStages>1 ? r.nStages+' stages' : (E.TERRAIN_LABEL[r.terrain]||r.terrain);
  v.appendChild(el('div','phead',(r.division?divChip(r.division):'<span class="chip champ">WC</span>')+' '+flag(r.country)+
    '<b>'+r.name+'</b> <span class="mut">· '+profile+' · '+r.tier+(r.done?'':' · in progress')+'</span>'));
  const j=r.jersey||{}; const lead=r.done?'':' (leading)';
  const isClassic=r.nStages<=1, ptsLabel=isClassic?'Sprints':'Points';
  v.appendChild(el('div','jerseys','<span class="jw">🏆 '+(r.gc[0]?flag(rcountry(r.gc[0].name))+rname(r.gc[0].name)+lead:'—')+'</span>'+
    (j.points?'<span class="jw pts">'+ptsLabel+lead+' · '+flag(rcountry(j.points.name))+rname(j.points.name)+'</span>':'')+
    (j.kom?'<span class="jw kom">Mountains'+lead+' · '+flag(rcountry(j.kom.name))+rname(j.kom.name)+'</span>':'')));

  // classification tab bar
  const tabs=[['gc', isClassic?'Result':'General']];
  if(r.pointsStand&&r.pointsStand.length) tabs.push(['pts',ptsLabel]);
  if(r.komStand&&r.komStand.length) tabs.push(['kom','Mountains']);
  if(r.teamClass&&r.teamClass.length) tabs.push(['team','Teams']);
  if(r.stages&&r.nStages>1) tabs.push(['stages','Stages']);
  tabs.push(['dnf','Abandons']);
  if(!tabs.some(t=>t[0]===raceTab)) raceTab='gc';
  const bar=el('div','subtabs');
  tabs.forEach(t=>{ const b=el('button','subtab'+(t[0]===raceTab?' on':''),t[1]); b.onclick=()=>{ raceTab=t[0]; renderRaceScreen(); }; bar.appendChild(b); });
  v.appendChild(bar);

  const body=el('div');
  if(raceTab==='gc'||raceTab==='pts'||raceTab==='kom'||raceTab==='team'){
    body.innerHTML=classRows(r, raceTab);
    if(raceTab==='team' && ((r.relZone&&r.relZone.length)||(r.promoZone&&r.promoZone.length))) body.insertAdjacentHTML('afterbegin','<div class="flowsub mut">▲ promotion / ▼ relegation if standings hold.</div>');
  } else if(raceTab==='stages'){
    body.innerHTML='<div class="stagelist">'+r.stages.map(st=>'<div class="stagerow"><span class="stname">'+st.name+'</span><span class="stterr">'+(E.TERRAIN_LABEL[st.terrain]||st.terrain)+
      '</span><span class="stwin">'+(st.winner?flag(rcountry(st.winner.name))+rname(st.winner.name)+' '+teamNameById(st.winner.teamId):'—')+'</span></div>').join('')+'</div>';
  } else if(raceTab==='dnf'){
    body.innerHTML = r.abandons.length?('<div class="slgrid">'+r.abandons.map(a=>'<div class="slr">'+flag(rcountry(a.name))+rname(a.name)+' '+teamNameById(a.teamId)+'</div>').join('')+'</div>'):'<div class="palmsum">No abandons.</div>';
  }
  v.appendChild(body);
}

function renderRanking(){
  const v=$('view'); v.innerHTML='';
  const r=E.worldRanking(S);
  v.appendChild(el('div','phead','<b>World ranking</b> <span class="mut">— rolling last 33 phases</span>'));
  const tbl=el('table','tbl');
  tbl.innerHTML='<thead><tr><th>#</th><th></th><th>Team</th><th>Country</th><th class="r">Points</th></tr></thead>';
  const tb=el('tbody');
  r.slice(0,50).forEach((o,i)=>{
    const tr=el('tr');
    tr.innerHTML='<td class="mut">'+(i+1)+'</td><td>'+divChip(o.team.division)+'</td>'+
      '<td class="tn">'+tname(o.team)+'</td><td class="mut">'+flag(o.team.country)+cname(o.team.country)+'</td><td class="r mono">'+o.pts+'</td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); v.appendChild(tbl);
}

function renderRiders(){
  const v=$('view'); v.innerHTML='';
  const rankPts={}; E.worldRankingRiders(S).forEach(o=>rankPts[o.name]=o.pts);
  const rows=[];
  S.teams.forEach(t=>t.riders.forEach(r=>{
    const inj=S.injuries[r.name]; const out=(inj!=null&&inj>=S.abs)?(inj-S.abs+1):0;
    rows.push({name:r.name, country:r.country, cn:cname(r.country), teamId:t.id, teamName:t.name,
      division:t.division, rating:r.avg, phases:S.phasesRidden[r.name]||0, out, pts:rankPts[r.name]||0}); }));
  (S.freeAgents||[]).forEach(r=>{ const inj=S.injuries[r.name]; const out=(inj!=null&&inj>=S.abs)?(inj-S.abs+1):0;
    rows.push({name:r.name, country:r.country, cn:cname(r.country), teamId:null, teamName:'', division:9,
      rating:r.avg, phases:S.phasesRidden[r.name]||0, out, pts:rankPts[r.name]||0}); });
  v.appendChild(el('div','phead','<b>Riders</b> <span class="mut">— '+rows.length.toLocaleString()+' riders · click a column to sort</span>'));

  const cmp={ name:(a,b)=>a.name.localeCompare(b.name), country:(a,b)=>a.cn.localeCompare(b.cn)||a.name.localeCompare(b.name),
    team:(a,b)=>(a.division-b.division)||a.teamName.localeCompare(b.teamName)||b.rating-a.rating,
    division:(a,b)=>a.division-b.division||b.rating-a.rating, rating:(a,b)=>a.rating-b.rating,
    phases:(a,b)=>a.phases-b.phases, health:(a,b)=>a.out-b.out||b.rating-a.rating, points:(a,b)=>a.pts-b.pts };
  rows.sort((a,b)=>cmp[riderSort.key](a,b)*riderSort.dir);

  const cols=[['name','Rider',1],['country','Country',1],['team','Team',1],['division','Div',1],
    ['rating','Rating',-1],['phases','Phases',-1],['health','Health',1],['points','Points',-1]];
  const tbl=el('table','tbl');
  const ar=k=> riderSort.key===k ? ('<span class="ar">'+(riderSort.dir>0?'▲':'▼')+'</span>') : '';
  tbl.innerHTML='<thead><tr><th>#</th>'+cols.map(c=>'<th class="sort'+(c[0]==='rating'||c[0]==='phases'||c[0]==='points'?' r':'')+'" data-k="'+c[0]+'" data-d="'+c[2]+'">'+c[1]+' '+ar(c[0])+'</th>').join('')+'</tr></thead>';
  const tb=el('tbody');
  rows.slice(0,400).forEach((o,i)=>{ const t=o.teamId!=null?S.teamById[o.teamId]:null;
    const health=o.out>0?'<span class="dn">out '+o.out+'p</span>':'<span class="up">fit</span>';
    const tr=el('tr');
    tr.innerHTML='<td class="mut">'+(i+1)+'</td><td class="tn">'+rname(o.name)+'</td>'+
      '<td class="mut">'+flag(o.country)+cname(o.country||'')+'</td>'+
      '<td class="mut">'+(t?tname(t):'<span class="mut">free agent</span>')+'</td>'+
      '<td>'+(o.division===9?'<span class="mut">—</span>':divChip(o.division))+'</td>'+
      '<td class="r mono">'+o.rating.toFixed(1)+'</td><td class="r mono">'+o.phases+'</td>'+
      '<td>'+health+'</td><td class="r mono">'+o.pts+'</td>';
    tb.appendChild(tr); });
  tbl.appendChild(tb); v.appendChild(tbl);
  if(rows.length>400) v.appendChild(el('div','palmsum','Showing top 400 of '+rows.length.toLocaleString()+' by current sort.'));
  tbl.querySelectorAll('th.sort').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k, d=+th.dataset.d;
    riderSort = (riderSort.key===k) ? {key:k,dir:-riderSort.dir} : {key:k,dir:d};
    render();
  });
}

function renderTeam(){
  const v=$('view'); v.innerHTML='';
  const sel=el('select','teamsel'); sel.id='teamPick';
  S.teams.slice().sort((a,b)=>a.division-b.division||a.name.localeCompare(b.name)).forEach(t=>{
    const o=el('option',null,'D'+t.division+' · '+t.name+' ('+cname(t.country)+')'); o.value=String(t.id); sel.appendChild(o);
  });
  if(selTeamId==null) selTeamId=S.teams[0].id;
  sel.value=String(selTeamId);
  sel.onchange=()=>{ selTeamId=+sel.value; renderTeamBody(selTeamId); };
  v.appendChild(sel);
  v.appendChild(el('div','teambody'));
  renderTeamBody(selTeamId);
}
function renderTeamBody(id){
  const t=S.teamById[id]; const box=document.querySelector('.teambody'); if(!t||!box)return;
  const rp=rankPts();
  let h='<div class="tmeta">'+divChip(t.division)+' '+flag(t.country)+'<b>'+t.name+'</b> <span class="mut">· '+cname(t.country)+
    ' · avg '+t.avg.toFixed(1)+' · '+(rp[t.id]||0)+' ranking pts</span></div>';
  h+='<div class="tmeta mut">Phases by division: '+[1,2,3,4].map(d=>'D'+d+' '+(t.phasesByDivision[d]||0)).join(' · ')+'</div>';
  h+='<div class="dsec">Roster</div>';
  h+='<table class="tbl"><thead><tr><th>Rider</th><th>Country</th><th class="r">Avg</th><th class="r">Phases</th><th class="r">GTs</th><th>Status</th></tr></thead><tbody>';
  t.riders.slice().sort((a,b)=>b.avg-a.avg).forEach(r=>{
    const inj=S.injuries[r.name]; const out=(inj!=null&&inj>=S.abs);
    const status=out?('<span class="dn">OUT '+(inj-S.abs+1)+'p</span>'):'<span class="ok">fit</span>';
    h+='<tr><td class="tn">'+rname(r.name)+'</td><td class="mut">'+flag(r.country)+cname(r.country)+'</td><td class="r mono">'+r.avg.toFixed(1)+
      '</td><td class="r mono">'+(S.phasesRidden[r.name]||0)+'</td><td class="r mono">'+(S.gt[r.name]||0)+
      '</td><td>'+status+'</td></tr>';
  });
  h+='</tbody></table>';
  h+='<div class="dsec">Team palmarès</div>'+palmaresBlock(S.teamPalmares[id]);
  box.innerHTML=h;
}

function renderMarket(){
  const v=$('view'); v.innerHTML='';
  const pool=S.marketPool||[];
  v.appendChild(el('div','phead','<b>Transfer market</b> <span class="mut">— riders are re-signed best-to-worst; every team finishes with exactly 15</span>'));
  if(!pool.length){ v.appendChild(el('div','empty','Market complete — every team is back to 15 riders. Click “Close market”.')); return; }
  const cur=pool[0]; const ft=S.teamById[cur.fromId];
  const cand=(S.marketTeams||[]).map(id=>S.teamById[id]).filter(Boolean);
  v.appendChild(el('div','flowsub',pool.length+' rider'+(pool.length===1?'':'s')+' still to place.'));
  // current rider in play
  const card=el('div','daycard');
  card.innerHTML='<div class="mktnow"><span class="mktlbl">Now signing · best available</span>'+
    '<div class="mktname">'+flag(cur.country)+rname(cur.name)+' <span class="srat">'+cur.avg.toFixed(1)+'</span></div>'+
    '<div class="mut">'+cname(cur.country)+' &middot; former team: '+(ft?divChip(ft.division)+' '+tname(ft):'—')+'</div></div>';
  v.appendChild(card);
  // candidate teams in play (only teams that still need a rider)
  v.appendChild(el('div','flowsub','Sign to a team in play <span class="mut">(teams still needing a 15th rider)</span>:'));
  const wrap=el('div','mktcell');
  if(!cand.length){ wrap.innerHTML='<span class="mut">No eligible teams left.</span>'; }
  cand.forEach(ct=>{ const b=el('button','mktbtn');
    b.innerHTML=flag(ct.country)+ct.name+' <span class="mut">'+ct.riders.length+'/15</span>';
    b.onclick=()=>{ if(E.signFromPool(S, cur.name, ct.id)){ msg(cur.name+' → '+ct.name); saveGame(); render(); } };
    wrap.appendChild(b); });
  v.appendChild(wrap);
  // upcoming queue — names only, no team options
  if(pool.length>1){ const q=el('div','mktqueue');
    q.innerHTML='<div class="dsec">Up next</div>'+pool.slice(1,13).map((p,i)=>
      '<span class="mktq"><b>'+(i+2)+'.</b> '+flag(p.country)+p.name+' <span class="mut mono">'+p.avg.toFixed(1)+'</span></span>').join('');
    v.appendChild(q); }
  const af=el('button','ghost'); af.textContent='Auto-fill remaining'; af.style.marginTop='12px';
  af.onclick=()=>{ E.finishMarket(S); msg('Remaining riders auto-placed'); saveGame(); render(); };
  v.appendChild(af);
}

msg('load a rider database to begin');
// auto-resume a saved season if one exists
(async function boot(){ try{ const ok=await loadGame();
  if(ok){ tab='divisions'; setTab(); render(); syncButtons(); msg('resumed your saved season — Year '+S.year+' · Phase '+S.phase); }
}catch(e){} })();
})();

</script>
