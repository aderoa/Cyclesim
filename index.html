<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CycleSim v14 — skeleton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15161A; --panel:#1E2026; --panel2:#24262E; --line:#2E313B;
  --ink:#E8E6E0; --muted:#8A8D96;
  --d1:#F2C200; --d2:#9BB7D4; --d3:#C98A4B; --d4:#6B7280;
  --up:#3FB36B; --dn:#E0483D; --champ:#9B7BD4;
  --disp:'Barlow Condensed',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding:0 0 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:.04em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.18em;margin-left:8px}
.status{text-align:right;font-family:var(--disp);font-weight:600}
#yp{font-size:18px;letter-spacing:.02em}
.ptype{display:block;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.ptype.special{color:var(--d1)} .ptype.champs{color:var(--champ)}

.ticker{display:flex;gap:3px;padding:14px 22px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tcell{width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel);border-radius:4px;
  border:1px solid transparent;cursor:default}
.tcell.co{background:var(--panel)}
.tcell.sp{background:rgba(242,194,0,.14);color:var(--d1);border-color:rgba(242,194,0,.3)}
.tcell.ch{background:rgba(155,123,212,.16);color:#c9b6ec;border-color:rgba(155,123,212,.35)}
.tcell.now{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink)}

.controls{display:flex;align-items:center;gap:10px;padding:16px 22px;flex-wrap:wrap}
button,.filebtn{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.03em;text-transform:uppercase;
  background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer}
button:hover:not(:disabled),.filebtn:hover{border-color:#454a57}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent}
.filebtn{background:var(--d1);color:#1a1a1a;border-color:var(--d1)}
.filebtn input{display:none}
.msg{color:var(--muted);font-size:13px;margin-left:6px}

.pyramid{padding:8px 22px 18px;display:flex;flex-direction:column;gap:7px}
.prow{display:flex;align-items:center;gap:12px}
.pbar{position:relative;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;color:#15161A;font-family:var(--disp);font-weight:700;min-width:120px;transition:width .35s ease}
.pbar.d1{background:var(--d1)} .pbar.d2{background:var(--d2)} .pbar.d3{background:var(--d3)} .pbar.d4{background:var(--d4);color:#E8E6E0}
.plabel{font-size:15px;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
.pcount{font-family:var(--mono);font-size:15px}
.pflow{display:flex;gap:10px;font-family:var(--disp);font-weight:700;font-size:15px}
.pflow .up{color:var(--up)} .pflow .dn{color:var(--dn)}

.tabs{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;
  color:var(--muted);padding:10px 12px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--d1)}

main{padding:18px 22px}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.phead{font-family:var(--disp);font-size:18px;margin-bottom:12px}
.mut{color:var(--muted)} .r{text-align:right} .mono{font-family:var(--mono)}
.tn{font-weight:500}

.divsel,.tabs{flex-wrap:wrap}
.divsel{display:flex;gap:6px;margin-bottom:14px}
.pill{font-family:var(--disp);font-weight:700;padding:6px 16px;border-radius:20px;border:1px solid var(--line);
  background:transparent;color:var(--muted)}
.pill.on.d1{background:var(--d1);color:#1a1a1a;border-color:var(--d1)}
.pill.on.d2{background:var(--d2);color:#15161A;border-color:var(--d2)}
.pill.on.d3{background:var(--d3);color:#15161A;border-color:var(--d3)}
.pill.on.d4{background:var(--d4);color:#fff;border-color:var(--d4)}

.chip{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;color:#15161A;vertical-align:middle}
.chip.d1{background:var(--d1)} .chip.d2{background:var(--d2)} .chip.d3{background:var(--d3)} .chip.d4{background:var(--d4);color:#fff}
.chip.champ{background:var(--champ);color:#fff}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-family:var(--disp);font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  font-size:11px;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 10px;border-bottom:1px solid rgba(46,49,59,.5)}
.tbl tbody tr:hover{background:var(--panel)}
.tbl tbody tr{cursor:pointer}

.race{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.rhead{font-family:var(--disp);font-size:16px;margin-bottom:6px}
.rtop{list-style:none;margin:0;padding:0;font-size:13px}
.rtop li{padding:2px 0;display:flex;gap:8px;align-items:baseline}
.rtop .pos{font-family:var(--mono);color:var(--muted);width:16px}
.rfoot{margin-top:6px;font-size:12px}
.debut{font-family:var(--mono);font-size:10px;background:rgba(63,179,107,.16);color:var(--up);padding:2px 6px;border-radius:4px}
.movesum{margin-bottom:12px;font-family:var(--disp);font-size:15px}
.movesum .up{color:var(--up)} .movesum .dn{color:var(--dn)}
.champbox{background:rgba(155,123,212,.1);border:1px solid rgba(155,123,212,.3);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.up{color:var(--up)} .dn{color:var(--dn)} .ok{color:var(--muted)}

.teamsel{font-family:var(--disp);font-weight:600;font-size:15px;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-bottom:14px;min-width:280px}
.tmeta{font-family:var(--disp);font-size:16px;margin-bottom:6px}
.tmeta.mut{font-size:13px;margin-bottom:12px}
</style>
</head>
<body>
<header>
  <div class="brand">CycleSim <span>v14 · skeleton</span></div>
  <div class="status"><span id="yp">—</span><span id="ptype" class="ptype"></span></div>
</header>
<div id="ticker" class="ticker"></div>
<div class="controls">
  <label class="filebtn">Load database<input type="file" id="csv" accept=".csv"></label>
  <button id="btnDraft" disabled>Run draft</button>
  <button id="btnPhase" disabled>Advance phase</button>
  <button id="btnYear" disabled>Advance year</button>
  <button id="btnReset" class="ghost">Reset</button>
  <span id="msg" class="msg"></span>
</div>
<section id="pyramid" class="pyramid"></section>
<nav class="tabs">
  <button data-tab="divisions" class="on">Divisions</button>
  <button data-tab="phase">Last phase</button>
  <button data-tab="ranking">World ranking</button>
  <button data-tab="team">Team</button>
</nav>
<main id="view"></main>
<script>
/* CycleSim v14 — engine (pure logic, no DOM)
   Implements the locked design: genesis draft, division seeding, 34-phase year,
   geographic assignment, rating-based race sim, division-tiered points,
   rolling-33 world ranking, promotion/relegation (incl. D4-everlasting + special
   phases), 7-of-15 selection with GT cap + Tour guarantee, and injuries on the
   11-day phase clock.
   The race sim here is a clean placeholder behind simulateRace(); the real
   stage-by-stage engine drops in at that single boundary later. */

(function (root) {
  'use strict';

  // ---- attributes (must match CSV column order) -------------------------
  const ATTRS = ['FLA','MTN','MM','HIL','TTR','PRL','COB','SPR','ACC','DHI','ATT','STA','RES','REC'];

  // terrain -> the two attributes that matter most
  const TERRAIN_ATTRS = {
    FLAT:['SPR','FLA'], HILLS:['HIL','PRL'], MOUNTAIN:['MTN','ATT'],
    COBBLES:['COB','FLA'], TT:['TTR','PRL']
  };
  const TERRAINS = Object.keys(TERRAIN_ATTRS);

  // ---- country geography: name -> [lat, lng, region] --------------------
  const G = {
    'Italy':[42,12,'EUW'],'France':[47,2,'EUW'],'Belgium':[51,4,'EUW'],'Netherlands':[52,5,'EUW'],
    'Spain':[40,-4,'EUW'],'Portugal':[39,-8,'EUW'],'Germany':[51,10,'EUW'],'Switzerland':[47,8,'EUW'],
    'Austria':[48,14,'EUW'],'United Kingdom':[54,-2,'EUW'],'Ireland':[53,-8,'EUW'],'Luxembourg':[50,6,'EUW'],
    'Monaco':[44,7,'EUW'],
    'Denmark':[56,10,'SCAND'],'Norway':[61,9,'SCAND'],'Sweden':[60,16,'SCAND'],'Finland':[64,26,'SCAND'],
    'Iceland':[65,-18,'SCAND'],
    'Poland':[52,20,'EUE'],'Czech Republic':[50,15,'EUE'],'Slovakia':[49,19,'EUE'],'Slovenia':[46,15,'EUE'],
    'Croatia':[45,16,'EUE'],'Serbia':[44,21,'EUE'],'Hungary':[47,19,'EUE'],'Romania':[46,25,'EUE'],
    'Greece':[39,22,'EUE'],'Bulgaria':[43,25,'EUE'],'Albania':[41,20,'EUE'],'Kosovo':[42,21,'EUE'],
    'BA':[44,18,'EUE'],'Latvia':[57,25,'EUE'],'Lithuania':[55,24,'EUE'],'Estonia':[59,26,'EUE'],
    'Ukraine':[49,32,'EUE'],'Belarus':[53,28,'EUE'],'Russia':[56,38,'EUE'],'AM':[40,45,'EUE'],'GE':[42,43,'EUE'],
    'United States':[39,-98,'NA'],'Canada':[56,-106,'NA'],'Bermuda':[32,-65,'NA'],'Guam':[13,144,'OCE'],
    'Mexico':[23,-102,'SA'],'Colombia':[4,-73,'SA'],'Ecuador':[-1,-78,'SA'],'Venezuela':[7,-66,'SA'],
    'Argentina':[-38,-64,'SA'],'Chile':[-35,-71,'SA'],'Brazil':[-10,-52,'SA'],'Bolivia':[-17,-65,'SA'],
    'Uruguay':[-33,-56,'SA'],'Costa Rica':[10,-84,'SA'],'Guatemala':[15,-90,'SA'],'Honduras':[15,-86,'SA'],
    'Panama':[9,-80,'SA'],'Puerto Rico':[18,-66,'SA'],'Belize':[17,-88,'SA'],'SV':[14,-89,'SA'],
    'Australia':[-25,134,'OCE'],'New Zealand':[-41,174,'OCE'],
    'Japan':[36,138,'ASE'],'China':[35,104,'ASE'],'South Korea':[36,128,'ASE'],'Taiwan':[24,121,'ASE'],
    'Hong Kong':[22,114,'ASE'],'Macau':[22,113,'ASE'],'Mongolia':[46,105,'ASE'],
    'Thailand':[15,101,'ASE'],'Malaysia':[4,102,'ASE'],'Indonesia':[-2,118,'ASE'],'Philippines':[13,122,'ASE'],
    'Vietnam':[16,108,'ASE'],'Laos':[20,102,'ASE'],'Singapore':[1,104,'ASE'],
    'Kazakhstan':[48,67,'ASW'],'Uzbekistan':[41,64,'ASW'],'Kyrgyzstan':[41,75,'ASW'],'Afghanistan':[33,66,'ASW'],
    'Iran':[32,53,'ASW'],'Israel':[31,35,'ASW'],'Bahrain':[26,50,'ASW'],'Saudi Arabia':[24,45,'ASW'],
    'United Arab Emirates':[24,54,'ASW'],'Turkey':[39,35,'ASW'],
    'Eritrea':[15,39,'AFR'],'Ethiopia':[9,40,'AFR'],'Rwanda':[-2,30,'AFR'],'Algeria':[28,2,'AFR'],
    'Morocco':[32,-6,'AFR'],'South Africa':[-29,24,'AFR'],'Mauritius':[-20,57,'AFR'],'Cameroon':[6,12,'AFR'],
    'Uganda':[1,32,'AFR'],'Kenya':[0,38,'AFR'],'DR Congo':[-4,22,'AFR']
  };
  function geo(c){ return G[c] || [20,0,'OTH']; }
  function regionOf(c){ return geo(c)[2]; }
  function gdist(a,b){
    const A=geo(a),B=geo(b); let dlng=Math.abs(A[1]-B[1]); if(dlng>180) dlng=360-dlng;
    const dlat=A[0]-B[0]; return Math.sqrt(dlat*dlat+dlng*dlng);
  }

  // ---- rng helpers ------------------------------------------------------
  function randn(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

  // ---- CSV parse --------------------------------------------------------
  // Accepts the locked schema, with OPTIONAL trailing id + lastSeen columns.
  // Rating,Team,RIDER,Country,<14 attrs>[,id][,lastSeen]
  function parseCSV(text){
    const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
    const out=[];
    for(let i=0;i<lines.length;i++){
      const c = lines[i].split(',');
      if(c.length<18) continue;
      if(c[2]==='RIDER' || c[2]===undefined) continue;          // header
      const avg = parseFloat(c[0]); if(isNaN(avg)) continue;     // header/garbage
      const a={}; for(let k=0;k<14;k++) a[ATTRS[k]] = parseInt(c[4+k],10)||0;
      out.push({
        id: (c[18]!=null && c[18].trim()) ? c[18].trim() : null,
        name: c[2].trim(),
        country: c[3].trim(),
        avg: avg,
        a: a,
        lastSeen: (c[19]!=null && c[19].trim()) ? c[19].trim() : null
      });
    }
    return out;
  }

  // ---- genesis draft ----------------------------------------------------
  // One-time. 15 per team: 8 from one home nation + 7 drafted from the pool.
  // Team count is bounded by riders/15. National cores allocated by capacity
  // (floor(count/8)) proportionally; the 7-slot fill is a weakest-first snake
  // on best-available, so a team's strength is driven by its national core.
  function genesisDraft(riders){
    const teamCount = Math.floor(riders.length/15);
    // group by country, sort each by rating desc
    const byC={}; riders.forEach(r=>{ (byC[r.country]||(byC[r.country]=[])).push(r); });
    Object.values(byC).forEach(list=>list.sort((x,y)=>y.avg-x.avg));
    // capacity per country = floor(n/8); distribute teamCount proportionally,
    // largest capacity first.
    const caps = Object.keys(byC).map(c=>({c,cap:Math.floor(byC[c].length/8),n:byC[c].length}))
      .filter(o=>o.cap>0).sort((a,b)=>b.n-a.n);
    let alloc={}, remaining=teamCount, totalCap=caps.reduce((s,o)=>s+o.cap,0);
    caps.forEach(o=>{ alloc[o.c]=0; });
    // proportional first pass
    caps.forEach(o=>{ const want=Math.min(o.cap, Math.round(teamCount*o.cap/totalCap)); alloc[o.c]=want; remaining-=want; });
    // fix rounding drift
    let ci=0; const order=caps.slice();
    while(remaining>0){ const o=order[ci%order.length]; if(alloc[o.c]<o.cap){alloc[o.c]++;remaining--;} ci++; if(ci>order.length*50)break; }
    while(remaining<0){ const o=order[ci%order.length]; if(alloc[o.c]>0){alloc[o.c]--;remaining++;} ci++; if(ci>order.length*50)break; }

    // build teams: take 8 cores, push leftovers to draft pool
    const teams=[]; const draftPool=[]; let tid=0;
    Object.keys(byC).forEach(c=>{
      const list=byC[c]; const n=alloc[c]||0;
      for(let t=0;t<n;t++){
        const core=list.slice(t*8,t*8+8);
        teams.push({ id:tid++, name:teamName(c,t), country:c, riders:core.slice(),
                     avg:0, division:0, phasesByDivision:{}, debutDivision:null });
      }
      // any riders not used as cores -> draft pool
      list.slice(n*8).forEach(r=>draftPool.push(r));
    });
    // weakest-first snake draft for the 7 fill
    draftPool.sort((x,y)=>y.avg-x.avg);
    let pi=0;
    for(let round=0; round<7; round++){
      const ord = teams.slice().sort((a,b)=>coreAvg(a)-coreAvg(b)); // weakest first
      for(const t of ord){ if(pi<draftPool.length){ t.riders.push(draftPool[pi++]); } }
    }
    teams.forEach(t=>{ t.avg = mean(t.riders.map(r=>r.avg)); });
    const freeAgents = draftPool.slice(pi); // leftovers
    return { teams, freeAgents };
  }
  function coreAvg(t){ return mean(t.riders.map(r=>r.avg)); }
  function teamName(country,idx){ return country+' '+(idx+1); }
  function mean(a){ return a.length? a.reduce((s,x)=>s+x,0)/a.length : 0; }

  // ---- division seeding -------------------------------------------------
  // By average rating. Caps 25/50/100 then D4 = everlasting remainder.
  // Robust to small datasets (clamps to team count).
  function seedDivisions(teams){
    const sorted = teams.slice().sort((a,b)=>b.avg-a.avg);
    const caps=[25,50,100];
    let i=0, div=1;
    for(const cap of caps){
      for(let k=0;k<cap && i<sorted.length;k++,i++) sorted[i].division=div;
      div++;
      if(i>=sorted.length) break;
    }
    while(i<sorted.length){ sorted[i].division=4; i++; } // D4 everlasting
    return divisionMap(teams);
  }
  function divisionMap(teams){
    const m={1:[],2:[],3:[],4:[]};
    teams.forEach(t=>{ if(m[t.division]) m[t.division].push(t); });
    return m;
  }
  function racesPerDivision(divTeamCount, division){
    if(division===1) return 1;
    if(division===2) return 2;
    if(division===3) return 4;
    return Math.max(1, Math.ceil(divTeamCount/25)); // D4
  }

  // ---- calendar ---------------------------------------------------------
  // 34 phases/year: 25 common + 8 special (D1 only) + phase 34 championships.
  // Specials evenly spaced, real-world order, Lombardia last special.
  const SPECIALS = [
    {name:'Milano-Sanremo',  host:'Italy',   terrain:'HILLS',   tier:'MONUMENT'},
    {name:'Tour of Flanders',host:'Belgium', terrain:'COBBLES', tier:'MONUMENT'},
    {name:'Paris-Roubaix',   host:'France',  terrain:'COBBLES', tier:'MONUMENT'},
    {name:'Liege-Bastogne-Liege',host:'Belgium',terrain:'MOUNTAIN',tier:'MONUMENT'},
    {name:'Giro d\'Italia',  host:'Italy',   terrain:'MOUNTAIN',tier:'GT', gt:'GIRO'},
    {name:'Tour de France',  host:'France',  terrain:'MOUNTAIN',tier:'TOUR', gt:'TOUR'},
    {name:'Vuelta a Espana', host:'Spain',   terrain:'MOUNTAIN',tier:'GT', gt:'VUELTA'},
    {name:'Il Lombardia',    host:'Italy',   terrain:'MOUNTAIN',tier:'MONUMENT'}
  ];
  function buildCalendar(){
    // place 8 specials across phases 1..33, evenly, Lombardia at phase 32.
    const specialPhase = {}; // phase -> special index
    for(let i=0;i<8;i++){ const p = Math.round((i+1)*33/9); specialPhase[p]=i; }
    // guarantee distinctness & Lombardia last
    const used=new Set(); const phases=[];
    for(let p=1;p<=34;p++){
      if(p===34){ phases.push({phase:34,type:'CHAMPS'}); continue; }
      if(specialPhase[p]!=null && !used.has(specialPhase[p])){
        used.add(specialPhase[p]);
        phases.push({phase:p,type:'SPECIAL',special:SPECIALS[specialPhase[p]]});
      } else {
        phases.push({phase:p,type:'COMMON'});
      }
    }
    // any specials not placed (collisions) -> drop into earliest free common phases
    for(let i=0;i<8;i++){ if(!used.has(i)){
      const slot=phases.find(ph=>ph.type==='COMMON'); if(slot){slot.type='SPECIAL';slot.special=SPECIALS[i];used.add(i);}
    }}
    return phases;
  }

  // ---- points -----------------------------------------------------------
  const PTS_BASE=[100,80,70,62,54,48,42,38,34,30,26,22,18,14,10,6];
  const TIER_MULT={ TOUR:1.0, GT:0.8, MONUMENT:0.7, UWT:0.55, PRO:0.4, C21:0.28, C22:0.16, WORLDS:0.9, NATIONAL:0.2 };
  function pointsFor(tier,pos){ if(pos>=PTS_BASE.length) return 0; return Math.round(PTS_BASE[pos]*(TIER_MULT[tier]||0.2)); }
  function tierFor(division, race){
    if(race.special) return race.special.tier;     // TOUR / GT / MONUMENT
    if(division===1) return 'UWT';
    if(division===2) return 'PRO';
    if(division===3) return 'C21';
    return 'C22';
  }

  // ---- rider selection (7 of 15) ---------------------------------------
  function selectRaceRiders(team, race, S){
    const abs=S.abs;
    let pool = team.riders.filter(r=>{
      const inj=S.injuries[r.name]; if(inj!=null && inj>=abs) return false;  // still out
      if(race.gt && (S.gt[r.name]||0)>=2) return false;                       // GT cap
      return true;
    });
    const forced=[];
    if(race.gt==='TOUR' && pool.length){
      const best=pool.slice().sort((a,b)=>b.avg-a.avg)[0];
      forced.push(best); pool=pool.filter(r=>r!==best);
    }
    pool.sort((a,b)=>{
      const pa=S.phasesRidden[a.name]||0, pb=S.phasesRidden[b.name]||0;
      return pa-pb || Math.random()-0.5;
    });
    const pick = forced.concat(pool).slice(0,7);
    return pick;
  }

  // ---- race simulation (placeholder behind a stable boundary) ----------
  // entries: [{rider, teamId}]  -> result with gc, abandons, teamClass, jerseys
  function simulateRace(entries, terrain){
    const wa = TERRAIN_ATTRS[terrain]||['FLA','STA'];
    const field = entries.map(e=>{
      const r=e.rider;
      const spec = (r.a[wa[0]]+r.a[wa[1]])/2;
      const perf = 0.55*r.avg + 0.45*spec + 4.0*randn(); // ability + form noise

    const abandons=[]; const finishers=[];
    field.forEach(f=>{ if(Math.random()<0.04){ abandons.push(f);} else finishers.push(f); });
    finishers.sort((a,b)=>b.perf-a.perf);
    const gc = finishers.map((f,i)=>({pos:i,name:f.name,teamId:f.teamId,rider:f.rider}));
    // team classification = sum of best-3 finisher positions (lower = better)
    const byTeam={};
    gc.forEach(g=>{ (byTeam[g.teamId]||(byTeam[g.teamId]=[])).push(g.pos); });
    const teamClass = Object.keys(byTeam).map(tid=>{
      const ps=byTeam[tid].sort((a,b)=>a-b).slice(0,3);
      return { teamId:+tid, score: ps.reduce((s,x)=>s+x,0) + (3-ps.length)*999 };
    }).sort((a,b)=>a.score-b.score);

  function assignTeams(teams, hosts){

      ds.sort((a,b)=>a.d-b.d);

      const ga=(a.ds[1]?a.ds[1].d:a.ds[0].d)-a.ds[0].d;
      const gb=(b.ds[1]?b.ds[1].d:b.ds[0].d)-b.ds[0].d;

    ordered.forEach(o=>{
      let placed=false;

  v.appendChild(el('div','phead','<b>World ranking</b> <span class="mut">— rolling last 33 phases</span>'));
  const tbl=el('table','tbl');
  tbl.innerHTML='<thead><tr><th>#</th><th></th><th>Team</th><th>Country</th><th class="r">Points</th></tr></thead>';
  const tb=el('tbody');
  r.slice(0,50).forEach((o,i)=>{
    const tr=el('tr');
    tr.innerHTML='<td class="mut">'+(i+1)+'</td><td>'+divChip(o.team.division)+'</td>'+
      '<td class="tn">'+o.team.name+'</td><td class="mut">'+o.team.country+'</td><td class="r mono">'+o.pts+'</td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); v.appendChild(tbl);
}

function renderTeam(){
  const v=$('view'); v.innerHTML='';
  const sel=el('select','teamsel'); sel.id='teamPick';
  S.teams.slice().sort((a,b)=>a.division-b.division||a.name.localeCompare(b.name)).forEach(t=>{
    const o=el('option',null,'D'+t.division+' · '+t.name); o.value=String(t.id); sel.appendChild(o);
  });
  sel.onchange=()=>renderTeamBody(+sel.value);
  v.appendChild(sel);
  v.appendChild(el('div','teambody'));
  renderTeamBody(+sel.value);
}
function renderTeamBody(id){
  const t=S.teamById[id]; const box=document.querySelector('.teambody'); if(!t||!box)return;
  const rp=rankPts();
  let h='<div class="tmeta">'+divChip(t.division)+' <b>'+t.name+'</b> <span class="mut">· '+t.country+
    ' · avg '+t.avg.toFixed(1)+' · '+(rp[t.id]||0)+' ranking pts</span></div>';
  h+='<div class="tmeta mut">Phases by division: '+[1,2,3,4].map(d=>'D'+d+' '+(t.phasesByDivision[d]||0)).join(' · ')+'</div>';
  h+='<table class="tbl"><thead><tr><th>Rider</th><th>Country</th><th class="r">Avg</th><th class="r">Phases</th><th class="r">GTs</th><th>Status</th></tr></thead><tbody>';
  t.riders.slice().sort((a,b)=>b.avg-a.avg).forEach(r=>{
    const inj=S.injuries[r.name]; const out=(inj!=null&&inj>=S.abs);
    const status=out?('<span class="dn">OUT '+(inj-S.abs+1)+'p</span>'):'<span class="ok">fit</span>';
    h+='<tr><td class="tn">'+r.name+'</td><td class="mut">'+r.country+'</td><td class="r mono">'+r.avg.toFixed(1)+
      '</td><td class="r mono">'+(S.phasesRidden[r.name]||0)+'</td><td class="r mono">'+(S.gt[r.name]||0)+
      '</td><td>'+status+'</td></tr>';
  });
  h+='</tbody></table>';
  box.innerHTML=h;
}

msg('load a rider database to begin');
})();

</script>
