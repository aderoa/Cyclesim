<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CycleSim v14 — skeleton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15161A; --panel:#1E2026; --panel2:#24262E; --line:#2E313B;
  --ink:#E8E6E0; --muted:#8A8D96;
  --d1:#F2C200; --d2:#9BB7D4; --d3:#C98A4B; --d4:#6B7280;
  --up:#3FB36B; --dn:#E0483D; --champ:#9B7BD4;
  --disp:'Barlow Condensed',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding:0 0 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--disp);font-weight:700;font-size:30px;letter-spacing:.04em;text-transform:uppercase}
.brand span{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.18em;margin-left:8px}
.status{text-align:right;font-family:var(--disp);font-weight:600}
#yp{font-size:18px;letter-spacing:.02em}
.ptype{display:block;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.ptype.special{color:var(--d1)} .ptype.champs{color:var(--champ)}

.ticker{display:flex;gap:3px;padding:14px 22px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tcell{width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel);border-radius:4px;
  border:1px solid transparent;cursor:default}
.tcell.co{background:var(--panel)}
.tcell.sp{background:rgba(242,194,0,.14);color:var(--d1);border-color:rgba(242,194,0,.3)}
.tcell.ch{background:rgba(155,123,212,.16);color:#c9b6ec;border-color:rgba(155,123,212,.35)}
.tcell.now{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink)}

.controls{display:flex;align-items:center;gap:10px;padding:16px 22px;flex-wrap:wrap}
button,.filebtn{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.03em;text-transform:uppercase;
  background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer}
button:hover:not(:disabled),.filebtn:hover{border-color:#454a57}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent}
.filebtn{background:var(--d1);color:#1a1a1a;border-color:var(--d1)}
.filebtn input{display:none}
.msg{color:var(--muted);font-size:13px;margin-left:6px}

.pyramid{padding:8px 22px 18px;display:flex;flex-direction:column;gap:7px}
.prow{display:flex;align-items:center;gap:12px}
.pbar{position:relative;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;color:#15161A;font-family:var(--disp);font-weight:700;min-width:120px;transition:width .35s ease}
.pbar.d1{background:var(--d1)} .pbar.d2{background:var(--d2)} .pbar.d3{background:var(--d3)} .pbar.d4{background:var(--d4);color:#E8E6E0}
.plabel{font-size:15px;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
.pcount{font-family:var(--mono);font-size:15px}
.pflow{display:flex;gap:10px;font-family:var(--disp);font-weight:700;font-size:15px}
.pflow .up{color:var(--up)} .pflow .dn{color:var(--dn)}

.tabs{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;
  color:var(--muted);padding:10px 12px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--d1)}

main{padding:18px 22px}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.phead{font-family:var(--disp);font-size:18px;margin-bottom:12px}
.mut{color:var(--muted)} .r{text-align:right} .mono{font-family:var(--mono)}
.tn{font-weight:500}

.divsel,.tabs{flex-wrap:wrap}
.divsel{display:flex;gap:6px;margin-bottom:14px}
.pill{font-family:var(--disp);font-weight:700;padding:6px 16px;border-radius:20px;border:1px solid var(--line);
  background:transparent;color:var(--muted)}
.pill.on.d1{background:var(--d1);color:#1a1a1a;border-color:var(--d1)}
.pill.on.d2{background:var(--d2);color:#15161A;border-color:var(--d2)}
.pill.on.d3{background:var(--d3);color:#15161A;border-color:var(--d3)}
.pill.on.d4{background:var(--d4);color:#fff;border-color:var(--d4)}

.chip{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;color:#15161A;vertical-align:middle}
.chip.d1{background:var(--d1)} .chip.d2{background:var(--d2)} .chip.d3{background:var(--d3)} .chip.d4{background:var(--d4);color:#fff}
.chip.champ{background:var(--champ);color:#fff}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-family:var(--disp);font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  font-size:11px;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 10px;border-bottom:1px solid rgba(46,49,59,.5)}
.tbl tbody tr:hover{background:var(--panel)}
.tbl tbody tr{cursor:pointer}

.race{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.rhead{font-family:var(--disp);font-size:16px;margin-bottom:6px}
.rtop{list-style:none;margin:0;padding:0;font-size:13px}
.rtop li{padding:2px 0;display:flex;gap:8px;align-items:baseline}
.rtop .pos{font-family:var(--mono);color:var(--muted);width:16px}
.rfoot{margin-top:6px;font-size:12px}
.debut{font-family:var(--mono);font-size:10px;background:rgba(63,179,107,.16);color:var(--up);padding:2px 6px;border-radius:4px}
.movesum{margin-bottom:12px;font-family:var(--disp);font-size:15px}
.movesum .up{color:var(--up)} .movesum .dn{color:var(--dn)}
.champbox{background:rgba(155,123,212,.1);border:1px solid rgba(155,123,212,.3);border-radius:8px;padding:10px 14px;margin-bottom:12px}
.up{color:var(--up)} .dn{color:var(--dn)} .ok{color:var(--muted)}

.teamsel{font-family:var(--disp);font-weight:600;font-size:15px;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-bottom:14px;min-width:280px}
.tmeta{font-family:var(--disp);font-size:16px;margin-bottom:6px}
.tmeta.mut{font-size:13px;margin-bottom:12px}

.lnk{font-family:var(--disp);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;
  background:none;border:none;color:var(--d1);padding:0 0 0 10px;cursor:pointer}
.rdetail{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.dsec{font-family:var(--disp);font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.jerseys{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
.jw{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:3px 10px}
.jw.pts{color:var(--up)} .jw.kom{color:var(--dn)}
.slgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slteam{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.slname{font-family:var(--disp);font-weight:600;font-size:13px;margin-bottom:3px}
.slr{font-size:11px;color:var(--muted)}
.fullgc{list-style:none;margin:0;padding:0;max-height:280px;overflow:auto;font-size:12px;
  border:1px solid var(--line);border-radius:6px}
.fullgc li{display:flex;gap:8px;padding:3px 8px;border-bottom:1px solid rgba(46,49,59,.4)}
.fullgc .pos{font-family:var(--mono);color:var(--muted);width:26px;text-align:right}
</style>
</head>

<main id="view"></main>

  };
  function geo(c){ return G[c] || [20,0,'OTH']; }
  function regionOf(c){ return geo(c)[2]; }
  function gdist(a,b){
    const A=geo(a),B=geo(b); let dlng=Math.abs(A[1]-B[1]); if(dlng>180) dlng=360-dlng;
    const dlat=A[0]-B[0]; return Math.sqrt(dlat*dlat+dlng*dlng);
  }

  // ---- rng helpers ------------------------------------------------------
  function randn(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

  // ---- CSV parse --------------------------------------------------------
  // Accepts the locked schema, with OPTIONAL trailing id + lastSeen columns.
  // Rating,Team,RIDER,Country,<14 attrs>[,id][,lastSeen]
  function parseCSV(text){
    const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
    const out=[];
    for(let i=0;i<lines.length;i++){
      const c = lines[i].split(',');
      if(c.length<18) continue;
      if(c[2]==='RIDER' || c[2]===undefined) continue;          // header
      const avg = parseFloat(c[0]); if(isNaN(avg)) continue;     // header/garbage
      const a={}; for(let k=0;k<14;k++) a[ATTRS[k]] = parseInt(c[4+k],10)||0;
      out.push({
        id: (c[18]!=null && c[18].trim()) ? c[18].trim() : null,
        name: c[2].trim(),
        country: c[3].trim(),
        avg: avg,
        a: a,
        lastSeen: (c[19]!=null && c[19].trim()) ? c[19].trim() : null
      });
    }
    return out;
  }

  // ---- genesis draft ----------------------------------------------------
  // One-time. 15 per team. (1) Randomly pick 8/15 of all riders as "natives",
  // bucket them by nationality into cores of 8 (small-nation leftovers merged
  // geographically). (2) Draft the rest: best rider -> best team, second -> second,
  // and so on, the SAME team order every round, so strength compounds.
  function genesisDraft(riders){
    const teamCount=Math.floor(riders.length/15);
    const nativeTarget=teamCount*8;
    const shuffled=shuffle(riders.slice());
    const natives=shuffled.slice(0,nativeTarget);
    const pool=shuffled.slice(nativeTarget);

    // bucket natives by nation -> cores of 8
    const byC={}; natives.forEach(r=>{(byC[r.country]||(byC[r.country]=[])).push(r);});
    const cores=[]; const leftover=[];
    Object.keys(byC).forEach(c=>{ const list=byC[c]; const g=Math.floor(list.length/8);
      for(let k=0;k<g;k++) cores.push({country:c, riders:list.slice(k*8,k*8+8)});
      list.slice(g*8).forEach(r=>leftover.push(r));
    });
    // geographic merge of leftovers into mixed cores (home = most-represented nation)
    leftover.sort((a,b)=>regionOf(a.country).localeCompare(regionOf(b.country)));
    for(let i=0;i+8<=leftover.length;i+=8){
      const grp=leftover.slice(i,i+8); const cnt={};
      grp.forEach(r=>cnt[r.country]=(cnt[r.country]||0)+1);
      const home=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
      cores.push({country:home, riders:grp});
    }
    leftover.slice(Math.floor(leftover.length/8)*8).forEach(r=>pool.push(r));

    // build teams, each named after an unused city of its home nation
    const cityUse={}; const teams=[]; let tid=0;
    cores.forEach(core=>{
      const city=cityFor(core.country, cityUse);
      teams.push({ id:tid++, name:city, homeCity:city, country:core.country,
                   riders:core.riders.slice(), avg:0, division:0,
                   phasesByDivision:{}, debutDivision:null });
    });
    teams.forEach(t=>t.avg=coreAvg(t));

    // straight draft: fixed team order (best core first), best remaining rider each round
    pool.sort((a,b)=>b.avg-a.avg);
    const order=teams.slice().sort((a,b)=>b.avg-a.avg);
    let pi=0;
    for(let round=0; round<7; round++){
      for(const t of order){ if(pi<pool.length) t.riders.push(pool[pi++]); }
    }
    teams.forEach(t=>{ t.avg = mean(t.riders.map(r=>r.avg)); });
    return { teams, freeAgents: pool.slice(pi) };
  }
  function cityFor(country, used){
    const list=CITIES[country]||[]; used[country]=used[country]||0;
    if(used[country]<list.length) return list[used[country]++];
    used[country]++; return country+' '+(used[country]-list.length); // fallback if cities exhausted
  }
  function coreAvg(t){ return mean(t.riders.map(r=>r.avg)); }
  function mean(a){ return a.length? a.reduce((s,x)=>s+x,0)/a.length : 0; }

  // ---- division seeding -------------------------------------------------
  // By average rating. Caps 25/50/100 then D4 = everlasting remainder.
  // Robust to small datasets (clamps to team count).
  function seedDivisions(teams){
    const sorted = teams.slice().sort((a,b)=>b.avg-a.avg);
    const caps=[25,50,100];
    let i=0, div=1;
    for(const cap of caps){
      for(let k=0;k<cap && i<sorted.length;k++,i++) sorted[i].division=div;
      div++;
      if(i>=sorted.length) break;
    }
    while(i<sorted.length){ sorted[i].division=4; i++; } // D4 everlasting
    return divisionMap(teams);
  }
  function divisionMap(teams){
    const m={1:[],2:[],3:[],4:[]};
    teams.forEach(t=>{ if(m[t.division]) m[t.division].push(t); });
    return m;
  }
  function racesPerDivision(divTeamCount, division){
    if(division===1) return 1;
    if(division===2) return 2;
    if(division===3) return 4;
    return Math.max(1, Math.ceil(divTeamCount/25)); // D4
  }

  // ---- calendar ---------------------------------------------------------
  // 34 phases/year: 25 common + 8 special (D1 only) + phase 34 championships.
  // Specials evenly spaced, real-world order, Lombardia last special.
  const SPECIALS = [
    {name:'Milano-Sanremo',  host:'Italy',   terrain:'HILLS',   tier:'MONUMENT'},
    {name:'Tour of Flanders',host:'Belgium', terrain:'COBBLES', tier:'MONUMENT'},
    {name:'Paris-Roubaix',   host:'France',  terrain:'COBBLES', tier:'MONUMENT'},
    {name:'Liege-Bastogne-Liege',host:'Belgium',terrain:'MOUNTAIN',tier:'MONUMENT'},
    {name:'Giro d\'Italia',  host:'Italy',   terrain:'MOUNTAIN',tier:'GT', gt:'GIRO'},
    {name:'Tour de France',  host:'France',  terrain:'MOUNTAIN',tier:'TOUR', gt:'TOUR'},
    {name:'Vuelta a Espana', host:'Spain',   terrain:'MOUNTAIN',tier:'GT', gt:'VUELTA'},
    {name:'Il Lombardia',    host:'Italy',   terrain:'MOUNTAIN',tier:'MONUMENT'}
  ];
  function buildCalendar(){
    // place 8 specials across phases 1..33, evenly, Lombardia at phase 32.
    const specialPhase = {}; // phase -> special index
    for(let i=0;i<8;i++){ const p = Math.round((i+1)*33/9); specialPhase[p]=i; }
    // guarantee distinctness & Lombardia last
    const used=new Set(); const phases=[];
    for(let p=1;p<=34;p++){
      if(p===34){ phases.push({phase:34,type:'CHAMPS'}); continue; }
      if(specialPhase[p]!=null && !used.has(specialPhase[p])){
        used.add(specialPhase[p]);
        phases.push({phase:p,type:'SPECIAL',special:SPECIALS[specialPhase[p]]});
      } else {
        phases.push({phase:p,type:'COMMON'});
      }
    }
    // any specials not placed (collisions) -> drop into earliest free common phases
    for(let i=0;i<8;i++){ if(!used.has(i)){
      const slot=phases.find(ph=>ph.type==='COMMON'); if(slot){slot.type='SPECIAL';slot.special=SPECIALS[i];used.add(i);}
    }}
    return phases;
  }

  // ---- points -----------------------------------------------------------
  const PTS_BASE=[100,80,70,62,54,48,42,38,34,30,26,22,18,14,10,6];
  const TIER_MULT={ TOUR:1.0, GT:0.8, MONUMENT:0.7, UWT:0.55, PRO:0.4, C21:0.28, C22:0.16, WORLDS:0.9, NATIONAL:0.2 };
  function pointsFor(tier,pos){ if(pos>=PTS_BASE.length) return 0; return Math.round(PTS_BASE[pos]*(TIER_MULT[tier]||0.2)); }
  function tierFor(division, race){
    if(race.special) return race.special.tier;     // TOUR / GT / MONUMENT
    if(division===1) return 'UWT';
    if(division===2) return 'PRO';
    if(division===3) return 'C21';
    return 'C22';
  }

  // ---- rider selection (7 of 15) ---------------------------------------
  function selectRaceRiders(team, race, S){
    const abs=S.abs;
    let pool = team.riders.filter(r=>{
      const inj=S.injuries[r.name]; if(inj!=null && inj>=abs) return false;  // still out
      if(race.gt && (S.gt[r.name]||0)>=2) return false;                       // GT cap
      return true;
    });
    const forced=[];
    if(race.gt==='TOUR' && pool.length){
      const best=pool.slice().sort((a,b)=>b.avg-a.avg)[0];
      forced.push(best); pool=pool.filter(r=>r!==best);
    }
    pool.sort((a,b)=>{
      const pa=S.phasesRidden[a.name]||0, pb=S.phasesRidden[b.name]||0;
      return pa-pb || Math.random()-0.5;
    });
    const pick = forced.concat(pool).slice(0,7);
    return pick;
  }

  // ---- race simulation (placeholder behind a stable boundary) ----------
  // entries: [{rider, teamId}]  -> result with gc, abandons, teamClass, jerseys
  function simulateRace(entries, terrain){
    const wa = TERRAIN_ATTRS[terrain]||['FLA','STA'];
    const field = entries.map(e=>{
      const r=e.rider;
      const spec = (r.a[wa[0]]+r.a[wa[1]])/2;
      const perf = 0.55*r.avg + 0.45*spec + 4.0*randn(); // ability + form noise
      return { name:r.name, teamId:e.teamId, country:r.country, rider:r, perf };
    });
    // abandons: ~4% crash/DNF, removed from GC, eligible for injury roll
    const abandons=[]; const finishers=[];
    field.forEach(f=>{ if(Math.random()<0.04){ abandons.push(f);} else finishers.push(f); });
    finishers.sort((a,b)=>b.perf-a.perf);
    const gc = finishers.map((f,i)=>({pos:i,name:f.name,teamId:f.teamId,rider:f.rider}));
    // team classification = sum of best-3 finisher positions (lower = better)
    const byTeam={};
    gc.forEach(g=>{ (byTeam[g.teamId]||(byTeam[g.teamId]=[])).push(g.pos); });
    const teamClass = Object.keys(byTeam).map(tid=>{
      const ps=byTeam[tid].sort((a,b)=>a-b).slice(0,3);
      return { teamId:+tid, score: ps.reduce((s,x)=>s+x,0) + (3-ps.length)*999 };
    }).sort((a,b)=>a.score-b.score);
    // secondary jerseys: best SPR (points) & best MTN (KOM) among finishers
    const jersey={};
    jersey.points = best(finishers,f=>f.rider.a.SPR);
    jersey.kom    = best(finishers,f=>f.rider.a.MTN);
    return { gc, abandons, teamClass, jersey, winner: gc[0]||null };
  }
  function best(arr,f){ let bv=-1,bx=null; arr.forEach(a=>{const v=f(a); if(v>bv){bv=v;bx=a;}}); return bx; }

  // ---- world ranking (rolling 33 phases) -------------------------------
  function worldRanking(S){
    const sums={};
    S.ledger.forEach(e=>{ if(S.abs - e.abs < 33){ sums[e.teamId]=(sums[e.teamId]||0)+e.pts; } });
    return S.teams.map(t=>({team:t, pts:sums[t.id]||0})).sort((a,b)=>b.pts-a.pts);
  }
  function worldRankingRiders(S){
    const sums={};
    S.riderLedger.forEach(e=>{ if(S.abs - e.abs < 33){ sums[e.name]=(sums[e.name]||0)+e.pts; } });
    return Object.keys(sums).map(n=>({name:n, pts:sums[n], teamId:S.riderTeam[n],
            country:S.riderCountry[n]})).sort((a,b)=>b.pts-a.pts);
  }
  function rankIndex(S){ const r=worldRanking(S); const idx={}; r.forEach((o,i)=>idx[o.team.id]=i); return idx; }

  // ---- run one phase ----------------------------------------------------
  function runPhase(S){
    const cal = S.calendar[(S.phase-1)];
    const log = { year:S.year, phase:S.phase, type:cal.type, races:[], moves:[] };

    if(cal.type==='CHAMPS'){ runChamps(S, log); finalizePhase(S,log); return log; }

    const dm = divisionMap(S.teams);
    const ranking = rankIndex(S);

    if(cal.type==='SPECIAL'){
      // D1 reshaped to top-25 by world ranking; only D1 races. D2-D4 frozen.
      reshapeEliteD1(S, dm);
      const fresh = divisionMap(S.teams);
      const d1 = fresh[1];
      const race = makeRace(1, cal.special, d1, S);
      log.races.push(race);
      awardPoints(S, race, 1);
      processInjuries(S, race);
      trackPhases(S, race, 1);
      specialPromoRelegate(S, race, fresh);
      finalizePhase(S,log);
      return log;
    }

    // COMMON phase: every division races, drawing from its fixed city-race pool.
    for(let d=1; d<=4; d++){
      const teams=dm[d]; if(!teams || !teams.length) continue;
      const nR = racesPerDivision(teams.length, d);
      const pool = S.fixtures[d]||[]; if(!pool.length) continue;
      const ci = S.commonCount;
      const hosts=[]; for(let k=0;k<nR;k++) hosts.push(pool[((ci*nR)+k)%pool.length]);
      const buckets = assignTeams(teams, hosts);
      const divRaces=[];
      buckets.forEach(b=>{
        if(!b.teams.length) return;
        const race = makeRace(d, b.fixture, b.teams, S);
        log.races.push(race); divRaces.push(race);
        awardPoints(S, race, d);
        processInjuries(S, race);
        trackPhases(S, race, d);
      });
      S._divRaces = S._divRaces||{}; S._divRaces[d]=divRaces;
    }
    commonPromoRelegate(S, dm, log);
    S._divRaces={};
    S.commonCount++;
    finalizePhase(S,log);
    return log;
  }

  function finalizePhase(S, log){
    S.abs++;
    if(S.phase>=34){ S.year++; S.phase=1; } else { S.phase++; }
  }

  // ---- phase helpers ----------------------------------------------------
  function makeRace(division, meta, teams, S){
    const entries=[];
    teams.forEach(t=>{
      const sel = selectRaceRiders(t, meta, S);
      sel.forEach(r=>{
        entries.push({rider:r, teamId:t.id});
        S.phasesRidden[r.name]=(S.phasesRidden[r.name]||0)+1;
        if(meta.gt) S.gt[r.name]=(S.gt[r.name]||0)+1;
      });
    });
    const res = simulateRace(entries, meta.terrain);
    return { division, name:meta.name, host:meta.host, terrain:meta.terrain,
             tier:tierFor(division,{special:meta.tier?meta:null}), gt:meta.gt||null,
             teams:teams.map(t=>t.id), result:res };
  }
  function raceLabel(host,d,ri){ return host+' (D'+d+(ri?(' #'+(ri+1)):'')+')'; }

  // per-division race fixtures, generated once from the home cities of the teams
  // seeded into each division (a D1 city -> a D1 race, etc.). Fixed thereafter.
  function buildFixtures(teams){
    const fx={1:[],2:[],3:[],4:[]}; const dm=divisionMap(teams);
    [1,2,3,4].forEach(d=>{ dm[d].forEach((t,i)=>{
      const oneday=(i%2===0);
      fx[d].push({ name:(oneday?'Gran Premio ':'Tour de ')+t.homeCity, host:t.homeCity,
                   country:t.country, terrain:TERRAINS[(Math.random()*TERRAINS.length)|0],
                   division:d, oneday });
    }); });
    return fx;
  }

  function assignTeams(teams, hosts){
    const cap=25, buckets=hosts.map(h=>({fixture:h, country:h.country, teams:[]}));
    const ordered = teams.map(t=>{
      const ds=buckets.map((b,i)=>({i,d:gdist(t.country,b.country)+Math.random()*0.4}));
      ds.sort((a,b)=>a.d-b.d);
      return {t, ds};
    }).sort((a,b)=>{ // clearest preference (biggest gap to 2nd choice) placed first
      const ga=(a.ds[1]?a.ds[1].d:a.ds[0].d)-a.ds[0].d;
      const gb=(b.ds[1]?b.ds[1].d:b.ds[0].d)-b.ds[0].d;
      return gb-ga;
    });
    ordered.forEach(o=>{
      let placed=false;
      for(const cand of o.ds){ if(buckets[cand.i].teams.length<cap){ buckets[cand.i].teams.push(o.t); placed=true; break; } }
      if(!placed){ let m=0; buckets.forEach((b,i)=>{ if(b.teams.length<buckets[m].teams.length) m=i; }); buckets[m].teams.push(o.t); }
    });
    return buckets;
  }

  function awardPoints(S, race, division){
    race.result.gc.forEach(g=>{
      const pts=pointsFor(race.tier, g.pos);
      if(pts>0){ S.ledger.push({teamId:g.teamId, pts, abs:S.abs});
                 S.riderLedger.push({name:g.name, pts, abs:S.abs}); }
    });
  }

  function processInjuries(S, race){
    race.result.abandons.forEach(a=>{
      const roll=Math.random();
      let days=0;
      if(roll<0.25) days=randInt(1,15);
      else if(roll<0.40) days=randInt(16,60);
      else if(roll<0.50) days=randInt(61,300);
      if(days>0){
        const missed=Math.floor(days/11);
        if(missed>0){ S.injuries[a.name]=S.abs+missed; S.injuryDays[a.name]=days; }
      }
    });
  }
  function randInt(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }

  function trackPhases(S, race, division){
    const seen=new Set();
    race.teams.forEach(tid=>{
      const t=S.teamById[tid]; if(!t) return;
      const pbd=t.phasesByDivision;
      pbd[division]=(pbd[division]||0)+1;
      if(pbd[division]===1){ race.result.debutTeams=(race.result.debutTeams||[]); race.result.debutTeams.push(tid); }
    });
  }

  // ---- promotion / relegation ------------------------------------------
  function exemptTeams(race){
    // teams safe from relegation: GC top-10 rider OR a jersey winner
    const safe=new Set();
    race.result.gc.slice(0,10).forEach(g=>safe.add(g.teamId));
    if(race.result.jersey.points) safe.add(race.result.jersey.points.teamId);
    if(race.result.jersey.kom)    safe.add(race.result.jersey.kom.teamId);
    return safe;
  }
  function bottomNonExempt(race, n){
    const safe=exemptTeams(race);
    const out=[];
    for(let i=race.result.teamClass.length-1;i>=0 && out.length<n;i--){
      const tid=race.result.teamClass[i].teamId;
      if(!safe.has(tid)) out.push(tid);
    }
    return out;
  }
  function commonPromoRelegate(S, dmBefore, log){
    const dr=S._divRaces||{};
    const ranking=rankIndex(S);
    const moves=[];
    // relegations (down) per race: bottom-4 non-exempt
    const relegate={1:[],2:[],3:[]};
    [1,2,3].forEach(d=>{ (dr[d]||[]).forEach(race=>{ relegate[d].push(...bottomNonExempt(race,4)); }); });
    const relegateSet=new Set(); [1,2,3].forEach(d=>relegate[d].forEach(id=>relegateSet.add(id)));
    // promotions (up): promote(D) = 4 * races(divisionAbove); never a team already relegated
    const promoteCount={2:4*(dr[1]?dr[1].length:0), 3:4*(dr[2]?dr[2].length:0), 4:4*(dr[3]?dr[3].length:0)};
    const promote={2:[],3:[],4:[]};
    [2,3,4].forEach(d=>{
      const races=dr[d]||[]; const need=promoteCount[d]; if(!need) return;
      const winners=races.map(r=>r.result.winner?r.result.winner.teamId:null)
                         .filter(x=>x!=null && !relegateSet.has(x));
      const chosen=[]; const seen=new Set();
      winners.forEach(tid=>{ if(chosen.length<need && !seen.has(tid)){chosen.push(tid);seen.add(tid);} });
      if(chosen.length<need){
        const pool=(dmBefore[d]||[]).map(t=>t.id)
          .filter(id=>!seen.has(id) && !relegateSet.has(id))
          .sort((a,b)=>(ranking[a]??1e9)-(ranking[b]??1e9));
        for(const id of pool){ if(chosen.length>=need)break; chosen.push(id); seen.add(id); }
      }
      promote[d]=chosen.slice(0,need);
    });
    // apply: each team moves exactly once
    [2,3,4].forEach(d=>promote[d].forEach(tid=>{ S.teamById[tid].division=d-1; moves.push({tid,from:d,to:d-1,kind:'promote'}); }));
    [1,2,3].forEach(d=>relegate[d].forEach(tid=>{ S.teamById[tid].division=d+1; moves.push({tid,from:d,to:d+1,kind:'relegate'}); }));
    log.moves=moves;
  }

  function reshapeEliteD1(S, dm){
    // before a special phase, the special field = top-25 by world ranking, drawn
    // from the elite pool (D1∪D2). Kept a clean D1<->D2 swap so D3/D4 never leak.
    const pool=S.teams.filter(t=>t.division===1||t.division===2);
    const rankSum={}; S.ledger.forEach(e=>{ if(S.abs-e.abs<33) rankSum[e.teamId]=(rankSum[e.teamId]||0)+e.pts; });
    pool.sort((a,b)=>(rankSum[b.id]||0)-(rankSum[a.id]||0));
    pool.forEach((t,i)=>{ t.division = i<25 ? 1 : 2; });
  }
  function specialPromoRelegate(S, race, dm){
    const moves=[];
    const down=bottomNonExempt(race,2);
    down.forEach(tid=>{ S.teamById[tid].division=2; moves.push({tid,from:1,to:2,kind:'relegate'}); });
    const ranking=worldRanking(S);
    const up=ranking.filter(o=>o.team.division===2).slice(0,2).map(o=>o.team.id);
    up.forEach(tid=>{ S.teamById[tid].division=1; moves.push({tid,from:2,to:1,kind:'promote'}); });
    return moves;
  }

  // ---- championships (phase 34) ----------------------------------------
  function runChamps(S, log){
    // National championships: best home rider per nation wins the title + points
    // to their team. Then Worlds: a single elite field.
    const byNat={}; S.teams.forEach(t=>t.riders.forEach(r=>{ (byNat[r.country]||(byNat[r.country]=[])).push({r,teamId:t.id}); }));
    const champs={};
    Object.keys(byNat).forEach(nat=>{
      const field=byNat[nat].map(e=>({...e, perf:e.r.avg+3*randn()})).sort((a,b)=>b.perf-a.perf);
      const w=field[0]; champs[nat]=w.r.name;
      field.slice(0,8).forEach((e,i)=>{ const p=pointsFor('NATIONAL',i);
        S.ledger.push({teamId:e.teamId, pts:p, abs:S.abs});
        S.riderLedger.push({name:e.r.name, pts:p, abs:S.abs}); });
    });
    // Worlds: top ~150 riders by avg, one race
    const all=[]; S.teams.forEach(t=>t.riders.forEach(r=>all.push({rider:r,teamId:t.id})));
    all.sort((a,b)=>b.rider.avg-a.rider.avg);
    const field=all.slice(0,180);
    const res=simulateRace(field,'HILLS');
    res.gc.slice(0,16).forEach(g=>{ const p=pointsFor('WORLDS',g.pos);
      S.ledger.push({teamId:g.teamId, pts:p, abs:S.abs});
      S.riderLedger.push({name:g.name, pts:p, abs:S.abs}); });
    log.champs={ national:champs, worldChampion: res.winner?res.winner.name:null };
    log.races.push({division:0,name:'World Championships',host:'—',terrain:'HILLS',tier:'WORLDS',gt:null,
                    teams:[],result:res});
  }

  // ---- new game ---------------------------------------------------------
  function newGame(riders){
    const {teams, freeAgents}=genesisDraft(riders);
    seedDivisions(teams);
    const teamById={}; teams.forEach(t=>teamById[t.id]=t);
    const riderTeam={}, riderCountry={};
    teams.forEach(t=>t.riders.forEach(r=>{ riderTeam[r.name]=t.id; riderCountry[r.name]=r.country; }));
    const S={
      riders, teams, teamById, freeAgents,
      fixtures: buildFixtures(teams),
      calendar: buildCalendar(),
      year:0, phase:34, abs:0, commonCount:0,   // Year 0 boots straight into championships
      ledger:[], riderLedger:[], riderTeam, riderCountry,
      injuries:{}, injuryDays:{}, phasesRidden:{}, gt:{},
      _divRaces:{}
    };
    return S;
  }

  const API={ ATTRS, parseCSV, genesisDraft, seedDivisions, divisionMap, racesPerDivision,
              buildCalendar, runPhase, worldRanking, worldRankingRiders, rankIndex, newGame,
              regionOf, gdist, tierFor, pointsFor, simulateRace, SPECIALS };
  if(typeof module!=='undefined' && module.exports) module.exports=API;
  root.CycleEngine=API;
})(typeof window!=='undefined'?window:globalThis);
/* CycleSim v14 skeleton — UI controller */
(function(){
const E = window.CycleEngine;
let S=null, riders=null, lastLog=null, selDiv=1, tab='divisions';
const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const DIVCOL={1:'d1',2:'d2',3:'d3',4:'d4'};
const fmt=n=>Math.round(n);
function msg(t){ $('msg').textContent=t||''; }

// ---- input / controls ----
$('csv').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  msg('reading '+f.name+'…');
  const rd=new FileReader();
  rd.onload=()=>{ riders=E.parseCSV(rd.result); msg(riders.length.toLocaleString()+' riders loaded — run the draft to build the world');
    $('btnDraft').disabled = riders.length<15; };
  rd.readAsText(f);
});
$('btnDraft').onclick=()=>{ if(!riders) return;
  S=E.newGame(riders); lastLog=null;
  $('btnPhase').disabled=false; $('btnYear').disabled=false;
  msg(S.teams.length+' teams built (8 home + 7 drafted) · '+S.freeAgents.length+' free agents · seeded into divisions by rating');
  tab='divisions'; setTab(); render();
};
$('btnPhase').onclick=()=>{ if(!S) return; lastLog=E.runPhase(S); tab='phase'; setTab(); render(); };
$('btnYear').onclick=()=>{ if(!S) return; const y=S.year; let g=0; do{ lastLog=E.runPhase(S); g++; }while(S.year===y && g<40); tab='phase'; setTab(); render(); };
$('btnReset').onclick=()=>{ S=null;riders=null;lastLog=null;
  ['btnDraft','btnPhase','btnYear'].forEach(b=>$(b).disabled=true);
  $('csv').value=''; msg('load a rider database to begin');
  $('view').innerHTML=''; $('ticker').innerHTML=''; $('pyramid').innerHTML='';
  $('yp').textContent='—'; $('ptype').textContent='';
};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; setTab(); render(); });
function setTab(){ document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab)); }

// ---- master render ----
function render(){
  if(!S){ return; }
  const cal=S.calendar[S.phase-1];
  $('yp').textContent='Year '+S.year+' · Phase '+S.phase+'/34';
  $('ptype').textContent = cal.type==='SPECIAL' ? ('SPECIAL — '+cal.special.name)
                         : cal.type==='CHAMPS' ? 'CHAMPIONSHIPS' : 'COMMON';
  $('ptype').className='ptype '+cal.type.toLowerCase();
  renderTicker(); renderPyramid();
  if(tab==='divisions') renderDivisions();
  else if(tab==='phase') renderPhase();
  else if(tab==='ranking') renderRanking();
  else if(tab==='riders') renderRiders();
  else if(tab==='team') renderTeam();
}

function renderTicker(){
  const t=$('ticker'); t.innerHTML='';
  S.calendar.forEach(c=>{
    const cls = c.type==='SPECIAL'?'sp':c.type==='CHAMPS'?'ch':'co';
    const cell=el('div','tcell '+cls+(c.phase===S.phase?' now':''));
    cell.title = c.type==='SPECIAL'?c.special.name : c.type==='CHAMPS'?'Championships':'Common phase '+c.phase;
    cell.textContent = c.phase;
    t.appendChild(cell);
  });
}

function rankPts(){ const m={}; E.worldRanking(S).forEach(o=>m[o.team.id]=o.pts); return m; }

function renderPyramid(){
  const dm=E.divisionMap(S.teams);
  const counts=[1,2,3,4].map(d=>dm[d].length);
  const maxc=Math.max.apply(null,counts)||1;
  const moves={1:{up:0,dn:0},2:{up:0,dn:0},3:{up:0,dn:0},4:{up:0,dn:0}};
  if(lastLog&&lastLog.moves) lastLog.moves.forEach(m=>{
    if(m.kind==='promote'){ moves[m.to].up++; } else { moves[m.to].dn++; }
  });
  const labels={1:'D1 · World Tour',2:'D2 · Pro',3:'D3 · Continental',4:'D4 · Open floor'};
  const p=$('pyramid'); p.innerHTML='';
  [1,2,3,4].forEach((d,i)=>{
    const row=el('div','prow');
    const bar=el('div','pbar '+DIVCOL[d]);
    bar.style.width=(12+88*counts[i]/maxc)+'%';
    bar.innerHTML='<span class="plabel">'+labels[d]+'</span><span class="pcount">'+counts[i]+(d===4?' ·∞':'')+'</span>';
    const flow=el('div','pflow');
    if(moves[d].up) flow.innerHTML+='<span class="up">↑'+moves[d].up+'</span>';
    if(moves[d].dn) flow.innerHTML+='<span class="dn">↓'+moves[d].dn+'</span>';
    row.appendChild(bar); row.appendChild(flow);
    p.appendChild(row);
  });
}

function divChip(d){ return '<span class="chip '+DIVCOL[d]+'">D'+d+'</span>'; }

function renderDivisions(){
  const v=$('view'); v.innerHTML='';
  const sel=el('div','divsel');
  [1,2,3,4].forEach(d=>{ const b=el('button','pill '+DIVCOL[d]+(d===selDiv?' on':''),'D'+d);
    b.onclick=()=>{selDiv=d;renderDivisions();}; sel.appendChild(b); });
  v.appendChild(sel);
  const dm=E.divisionMap(S.teams); const rp=rankPts();
  const teams=dm[selDiv].slice().sort((a,b)=>(rp[b.id]||0)-(rp[a.id]||0));
  const tbl=el('table','tbl');
  tbl.innerHTML='<thead><tr><th>#</th><th>Team</th><th>Country</th><th class="r">Avg</th><th class="r">Ranking pts</th><th class="r">Phases in D'+selDiv+'</th></tr></thead>';
  const tb=el('tbody');
  teams.forEach((t,i)=>{
    const tr=el('tr');
    tr.innerHTML='<td class="mut">'+(i+1)+'</td><td class="tn">'+t.name+'</td><td class="mut">'+t.country+'</td>'+
      '<td class="r mono">'+t.avg.toFixed(1)+'</td><td class="r mono">'+(rp[t.id]||0)+'</td>'+
      '<td class="r mono">'+(t.phasesByDivision[selDiv]||0)+'</td>';
    tr.onclick=()=>{ tab='team'; setTab(); render(); setTimeout(()=>{const s=$('teamPick'); if(s){s.value=String(t.id); renderTeam();}},0); };
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); v.appendChild(tbl);
}

function renderPhase(){
  const v=$('view'); v.innerHTML='';
  if(!lastLog){ v.appendChild(el('div','empty','Advance a phase to see races and results.')); return; }
  const head=el('div','phead','<b>Year '+lastLog.year+' · Phase '+lastLog.phase+'</b> — '+lastLog.type+
    (lastLog.type==='SPECIAL'?' ('+lastLog.races[0].name+')':''));
  v.appendChild(head);
  if(lastLog.champs){
    v.appendChild(el('div','champbox','<b>World Champion:</b> '+(lastLog.champs.worldChampion||'—')+
      ' &nbsp;·&nbsp; '+Object.keys(lastLog.champs.national).length+' national titles awarded'));
  }
  if(lastLog.moves&&lastLog.moves.length){
    const up=lastLog.moves.filter(m=>m.kind==='promote').length, dn=lastLog.moves.filter(m=>m.kind==='relegate').length;
    v.appendChild(el('div','movesum','<span class="up">▲ '+up+' promoted</span> · <span class="dn">▼ '+dn+' relegated</span>'));
  }
  lastLog.races.forEach(r=>{
    const card=el('div','race');
    const dbt=(r.result.debutTeams&&r.result.debutTeams.length)?' <span class="debut">'+r.result.debutTeams.length+' debut</span>':'';
    card.appendChild(el('div','rhead',(r.division?divChip(r.division):'<span class="chip champ">WC</span>')+
      ' <b>'+r.name+'</b> <span class="mut">· '+r.terrain.toLowerCase()+' · '+r.tier+'</span>'+dbt));
    const top=r.result.gc.slice(0,5).map((g,i)=>'<li><span class="pos">'+(i+1)+'</span> '+g.name+
      ' <span class="mut">'+teamNameById(g.teamId)+'</span></li>').join('');
    card.appendChild(el('ol','rtop',top));
    const foot=el('div','rfoot','<span class="mut">'+r.result.gc.length+' finishers · '+
      r.result.abandons.length+' abandons</span><button class="lnk">full results &amp; startlist</button>');
    card.appendChild(foot);
    const detail=el('div','rdetail'); detail.style.display='none'; detail.innerHTML=raceDetailHTML(r);
    card.appendChild(detail);
    foot.querySelector('.lnk').onclick=()=>{ detail.style.display = detail.style.display==='none'?'block':'none'; };
    v.appendChild(card);
  });
}
function raceDetailHTML(r){
  const j=r.result.jersey;
  let h='<div class="dsec">Classifications</div><div class="jerseys">'+
    '<span class="jw">🏆 '+(r.result.winner?r.result.winner.name:'—')+'</span>'+
    (j.points?'<span class="jw pts">Points · '+j.points.name+'</span>':'')+
    (j.kom?'<span class="jw kom">Mountains · '+j.kom.name+'</span>':'')+'</div>';
  // startlist grouped by team (finishers + DNF)
  const starters={};
  r.result.gc.forEach(g=>{(starters[g.teamId]||(starters[g.teamId]=[])).push(g.name);});
  r.result.abandons.forEach(a=>{(starters[a.teamId]||(starters[a.teamId]=[])).push(a.name+' · DNF');});
  h+='<div class="dsec">Startlist — '+r.teams.length+' teams</div><div class="slgrid">';
  r.teams.forEach(tid=>{ const t=S.teamById[tid];
    h+='<div class="slteam"><div class="slname">'+(t?t.name:tid)+'</div>'+
      (starters[tid]||[]).map(n=>'<div class="slr">'+n+'</div>').join('')+'</div>';
  });
  h+='</div>';
  h+='<div class="dsec">General classification</div><ol class="fullgc">'+
    r.result.gc.map((g,i)=>'<li><span class="pos">'+(i+1)+'</span> '+g.name+
      ' <span class="mut">'+teamNameById(g.teamId)+'</span></li>').join('')+'</ol>';
  return h;
}
function teamNameById(id){ const t=S.teamById[id]; return t?('· '+t.name):''; }

function renderRanking(){
  const v=$('view'); v.innerHTML='';
  const r=E.worldRanking(S);
  v.appendChild(el('div','phead','<b>World ranking</b> <span class="mut">— rolling last 33 phases</span>'));
  const tbl=el('table','tbl');
  tbl.innerHTML='<thead><tr><th>#</th><th></th><th>Team</th><th>Country</th><th class="r">Points</th></tr></thead>';
  const tb=el('tbody');
  r.slice(0,50).forEach((o,i)=>{
    const tr=el('tr');
    tr.innerHTML='<td class="mut">'+(i+1)+'</td><td>'+divChip(o.team.division)+'</td>'+
      '<td class="tn">'+o.team.name+'</td><td class="mut">'+o.team.country+'</td><td class="r mono">'+o.pts+'</td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); v.appendChild(tbl);
}

function renderRiders(){
  const v=$('view'); v.innerHTML='';
  const r=E.worldRankingRiders(S);
  v.appendChild(el('div','phead','<b>Rider ranking</b> <span class="mut">— rolling last 33 phases · individual points</span>'));
  if(!r.length){ v.appendChild(el('div','empty','No points yet — advance a phase.')); return; }
  const tbl=el('table','tbl');
  tbl.innerHTML='<thead><tr><th>#</th><th>Rider</th><th>Country</th><th>Team</th><th class="r">Points</th></tr></thead>';
  const tb=el('tbody');
  r.slice(0,60).forEach((o,i)=>{ const t=S.teamById[o.teamId];
    const tr=el('tr');
    tr.innerHTML='<td class="mut">'+(i+1)+'</td><td class="tn">'+o.name+'</td><td class="mut">'+(o.country||'')+'</td>'+
      '<td class="mut">'+(t?(divChip(t.division)+' '+t.name):'—')+'</td><td class="r mono">'+o.pts+'</td>';
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); v.appendChild(tbl);
}

function renderTeam(){
  const v=$('view'); v.innerHTML='';
  const sel=el('select','teamsel'); sel.id='teamPick';
  S.teams.slice().sort((a,b)=>a.division-b.division||a.name.localeCompare(b.name)).forEach(t=>{
    const o=el('option',null,'D'+t.division+' · '+t.name); o.value=String(t.id); sel.appendChild(o);
  });
  sel.onchange=()=>renderTeamBody(+sel.value);
  v.appendChild(sel);
  v.appendChild(el('div','teambody'));
  renderTeamBody(+sel.value);
}
function renderTeamBody(id){
  const t=S.teamById[id]; const box=document.querySelector('.teambody'); if(!t||!box)return;
  const rp=rankPts();
  let h='<div class="tmeta">'+divChip(t.division)+' <b>'+t.name+'</b> <span class="mut">· '+t.country+
    ' · avg '+t.avg.toFixed(1)+' · '+(rp[t.id]||0)+' ranking pts</span></div>';
  h+='<div class="tmeta mut">Phases by division: '+[1,2,3,4].map(d=>'D'+d+' '+(t.phasesByDivision[d]||0)).join(' · ')+'</div>';
  h+='<table class="tbl"><thead><tr><th>Rider</th><th>Country</th><th class="r">Avg</th><th class="r">Phases</th><th class="r">GTs</th><th>Status</th></tr></thead><tbody>';
  t.riders.slice().sort((a,b)=>b.avg-a.avg).forEach(r=>{
    const inj=S.injuries[r.name]; const out=(inj!=null&&inj>=S.abs);
    const status=out?('<span class="dn">OUT '+(inj-S.abs+1)+'p</span>'):'<span class="ok">fit</span>';
    h+='<tr><td class="tn">'+r.name+'</td><td class="mut">'+r.country+'</td><td class="r mono">'+r.avg.toFixed(1)+
      '</td><td class="r mono">'+(S.phasesRidden[r.name]||0)+'</td><td class="r mono">'+(S.gt[r.name]||0)+
      '</td><td>'+status+'</td></tr>';
  });
  h+='</tbody></table>';
  box.innerHTML=h;
}

msg('load a rider database to begin');
})();

</script>
